<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="../../assets/css/images/biglogo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据管理器</title>
<!-- 维护工具页，robots.txt 的 Disallow 在 GitHub Pages 项目站点上根本不生效
     （爬虫只看域名根 /robots.txt），只能在这里用 meta 兜底不让收录 -->
<meta name="robots" content="noindex">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0f1117;--bg1:#1a1d27;--bg2:#242836;--bg3:#2d3244;--bg4:#363b50;
  --bd:#2e3348;--bd2:#3a3f55;
  --t1:#e4e6f0;--t2:#9498b0;--t3:#6b7094;
  --ac:#6c8cff;--ac2:#8aa4ff;--acd:rgba(108,140,255,.15);
  --dg:#ff5c6c;--dgd:rgba(255,92,108,.15);
  --wn:#ffb347;--wnd:rgba(255,179,71,.15);
  --ok:#4ecdc4;--okd:rgba(78,205,196,.15);
  --lg:#a78bfa;--lgd:rgba(167,139,250,.15);
  --cf:#ff4444;--cfd:rgba(255,68,68,.12);
  --hl-uid:#ff6b9d;--hl-uid-bg:rgba(255,107,157,.12);
  --hl-site:#c084fc;--hl-site-bg:rgba(192,132,252,.12);
  --hl-dup:#6c8cff;--hl-dup-bg:rgba(108,140,255,.14);
  --val-err:#ffb347;--val-err-bg:rgba(255,179,71,.1);
  --r:8px;--rl:12px;--sh:0 4px 24px rgba(0,0,0,.3);--tr:.2s ease;
  --sw:260px;--hh:56px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg0);color:var(--t1);font-size:14px;line-height:1.5;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--t1);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:8px 12px;outline:none;transition:border-color var(--tr)}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--t3)}
.app{display:flex;height:100vh}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--bg1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;z-index:50;transition:left .3s ease}
.sidebar-hd{padding:16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.sidebar-hd h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.sidebar-act{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--bd)}
.sec-title{padding:12px 16px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);display:flex;justify-content:space-between;align-items:center}
.p-list{flex:1;overflow-y:auto;padding:4px 8px}
.p-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:var(--r);cursor:pointer;transition:all var(--tr);margin-bottom:2px}
.p-item:hover{background:var(--bg3)}
.p-item.active{background:var(--acd);color:var(--ac)}
/* 「全部数据」是左侧列表的总入口，单独给一套强调样式，和下面这些分区区分开 */
.p-item.p-all{font-weight:600;margin-bottom:10px;padding-bottom:11px;border-bottom:1px solid var(--bd);border-radius:var(--r) var(--r) 0 0}
.p-item.p-all .p-name{letter-spacing:.4px}
.p-item.p-all.active{background:var(--ac);color:#fff}
.p-item.p-all.active .p-cnt{background:rgba(255,255,255,.28);color:#fff}
.p-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.p-cnt{font-size:11px;color:var(--t3);background:var(--bg2);padding:2px 8px;border-radius:10px;min-width:28px;text-align:center}
.p-item.active .p-cnt{background:var(--ac);color:#fff}
.p-del{opacity:0;margin-left:4px;color:var(--dg);font-size:12px;padding:2px 4px;border-radius:4px;transition:opacity var(--tr)}
.p-item:hover .p-del{opacity:1}
.p-del:hover{background:var(--dgd)}
.eye-btn{margin-left:4px;cursor:pointer;font-size:14px;opacity:.5;transition:opacity var(--tr)}
.eye-btn:hover{opacity:1}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.toolbar{height:var(--hh);min-height:var(--hh);display:flex;align-items:center;padding:0 20px;gap:10px;border-bottom:1px solid var(--bd);background:var(--bg1)}
.sep{width:1px;height:24px;background:var(--bd)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;transition:all var(--tr);white-space:nowrap}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ac2)}
.btn-o{border:1px solid var(--bd);color:var(--t2)}.btn-o:hover{border-color:var(--ac);color:var(--ac);background:var(--acd)}
.btn-d{background:var(--dg);color:#fff}.btn-d:hover{opacity:.85}
.btn-sm{padding:5px 10px;font-size:12px}
.search-box{position:relative;flex:0 1 280px}
.search-box input{width:100%;padding-left:32px}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.more-wrap{position:relative}
.more-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:190px;background:var(--bg1);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:4px;display:none;flex-direction:column;z-index:60}
.more-menu.open{display:flex}
.mm-item{background:none;border:0;text-align:left;padding:8px 12px;font-size:13px;color:var(--t1);cursor:pointer;border-radius:6px;white-space:nowrap}
.mm-item:hover{background:var(--bg3)}
.uid-chip{display:inline-block;padding:2px 8px;border:1px solid var(--bd);border-radius:5px;font-size:12px;font-family:ui-monospace,Consolas,monospace;background:var(--bg2)}
.badge{font-size:12px;color:var(--t3);padding:4px 10px;background:var(--bg2);border-radius:10px}
.batch-bar{height:48px;background:var(--ac);color:#fff;display:flex;align-items:center;padding:0 20px;gap:12px;font-size:13px;font-weight:600;animation:slideDown .2s ease}
.batch-bar .btn{background:rgba(255,255,255,.2);color:#fff;border:none}
.batch-bar .btn:hover{background:rgba(255,255,255,.3)}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.drop-zone{margin:16px 20px;padding:32px;border:2px dashed var(--bd);border-radius:var(--rl);text-align:center;transition:all var(--tr);cursor:pointer;background:var(--bg1)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--ac);background:var(--acd)}
.drop-zone.compact{padding:12px;margin:8px 20px}
.drop-zone.compact .dz-icon,.drop-zone.compact .dz-hint{display:none}
.dz-icon{font-size:36px;margin-bottom:8px}
.dz-text{color:var(--t2);font-size:14px}
.dz-hint{color:var(--t3);font-size:12px;margin-top:4px}
.file-bar{padding:0 20px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ftag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;background:var(--bg2);color:var(--t2);border:1px solid var(--bd)}
.ftag .fdel{cursor:pointer;opacity:.5;font-size:10px}.ftag .fdel:hover{opacity:1;color:var(--dg)}
.ftag.conflict{border-color:var(--wn);color:var(--wn)}
.ftag.hidden{opacity:.4}
.tbl-wrap{flex:1;overflow:auto;margin:0 20px 16px;border:1px solid var(--bd);border-radius:var(--rl);background:var(--bg1)}
.tbl-wrap table{width:100%;border-collapse:collapse;min-width:640px}
.tbl-wrap thead{position:sticky;top:0;z-index:10}
.tbl-wrap th{background:var(--bg2);padding:7px 9px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}
.tbl-wrap th:hover{color:var(--t1)}
.tbl-wrap th.sa::after{content:' ▲';font-size:10px}
.tbl-wrap th.sd::after{content:' ▼';font-size:10px}
.tbl-wrap td{padding:5px 9px;border-bottom:1px solid var(--bd);font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tbl-wrap tr:hover td{background:var(--bg3)}
/* ── 紧凑列：勾选 / 编号 / 来源 三者几乎紧贴 ── */
.tbl-wrap col.c-chk,.tbl-wrap .c-chk{width:26px;min-width:26px;padding-left:10px;padding-right:7px}
/* 条目里的勾选框相对行内文字下移 1px（表头的全选框不动） */
.tbl-wrap tbody .c-chk input[type="checkbox"]{position:relative;top:3px}
.tbl-wrap col.c-idx,.tbl-wrap .c-idx{width:24px;min-width:24px;max-width:24px;padding-left:0;padding-right:0;color:var(--t3);font-variant-numeric:tabular-nums}
/* ── 来源列改成「贴合内容」的宽度 ──
   以前写死 94px，而文件名（如 acg-nav）只占 41px，右边空掉一大截：
   实测「来源」文字右边缘到 name 文字左边缘隔着 **62px**。
   改成 width:1% + nowrap 让列宽跟着内容走，再把两侧内距收到最小，
   单分区视图下间距 ≈15px。
   （「全部」视图下同列要容纳最长的文件名（comic_illustrat…），列宽被它撑开，
     名字短的那些行空隙会大一些 —— 表格一列只有一个宽度，这个躲不掉。） */
.tbl-wrap col.c-src,.tbl-wrap .c-src{width:1%;min-width:0;max-width:none;padding-left:0;padding-right:2px;font-size:11px;color:var(--t3)}
/* ── UID 与 URL 间隔拉近(12px)，URL 与 RELATED 间隔减 1/7(15px) ── */
.tbl-wrap col.c-uid,.tbl-wrap .c-uid{width:1%;min-width:44px;max-width:110px;padding-right:3px}
/* URL 列收掉五分之一（实测 250px → 200px）：长链接本来就有 ellipsis，省出来的宽度给别的列 */
.tbl-wrap col.c-url,.tbl-wrap .c-url{min-width:125px;max-width:200px;padding-left:3px;padding-right:8px}
.tbl-wrap col.c-rel,.tbl-wrap .c-rel{max-width:200px;padding-left:7px}
.tbl-wrap col.c-name,.tbl-wrap .c-name{max-width:190px;padding-left:6px}
/* LOGO 列缩到原来的三分之二（实测 189px → 约 126px）：里面只是个图片路径，不值那么宽 */
.tbl-wrap col.c-logo,.tbl-wrap .c-logo{max-width:126px}
/* 操作列已取消（列太占宽度）：✏️👁🗑 挪到图例那一行的最右边，
   作用于「单击选中的那一行」，见 paintSel() / actOnSel() */
.tbl-wrap tr:last-child td{border-bottom:none}
.tbl-wrap tr.uc td{background:var(--hl-uid-bg)}
.tbl-wrap tr.uc td.uid-c{color:var(--hl-uid);font-weight:600}
.tbl-wrap tr.sc td{background:var(--hl-site-bg)}
.tbl-wrap tr.sc td.site-c{color:var(--hl-site);font-weight:600}
.tbl-wrap tr.dup td{background:var(--hl-dup-bg)}
.tbl-wrap tr.val-err td{background:var(--val-err-bg)}
/* 被选中的操作目标行：左侧一条金色竖条 + 淡金底 + 序号变金（和 hover 的浅色底区分开） */
.tbl-wrap tbody tr.row-sel td{background:var(--acd)}
.tbl-wrap tbody tr.row-sel td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.tbl-wrap tbody tr.row-sel td.c-idx{color:var(--ac);font-weight:600}
.ce-btn{font-size:12px;padding:2px 6px;border-radius:4px;color:var(--ac)}.ce-btn:hover{background:var(--acd)}
.cd-btn{font-size:12px;padding:2px 6px;border-radius:4px;color:var(--dg)}.cd-btn:hover{background:var(--dgd)}
/* 详情页预览按钮（蓝色系，和编辑/删除区分开） */
.cp-btn{font-size:12px;padding:2px 6px;border-radius:4px;color:var(--t2)}.cp-btn:hover{background:var(--bg3);color:var(--ac)}
/* 预览弹窗里的 iframe */
.pv-tip{font-size:12px;color:var(--t3);line-height:1.8;margin-bottom:10px}
.pv-tip b{color:var(--t2)}
.pv-frame{width:100%;height:74vh;border:1px solid var(--bd);border-radius:var(--r);background:#0f172a}
.empty{padding:60px 20px;text-align:center;color:var(--t3)}
.empty .ei{font-size:48px;margin-bottom:12px}
.no-res{padding:40px;text-align:center;color:var(--t3);font-size:14px}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
/* 图例行同时兼「行操作」工具条：三个按钮贴在最右边 */
.legend{display:flex;gap:16px;padding:8px 20px;font-size:12px;color:var(--t3);align-items:center}
.lg-act{margin-left:auto;display:flex;align-items:center;gap:4px}
.lg-cur{font-size:11px;color:var(--t3);margin-right:6px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-cur.has{color:var(--ac)}
.lg-act button:disabled{opacity:.28;cursor:not-allowed}
.lg-act button:disabled:hover{background:transparent;color:inherit}
/* ── ❓ 知识库：折叠标题式（原生 <details>，不用 JS）── */
.kb-sec{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;background:var(--bg1);overflow:hidden}
.kb-sec[open]{border-color:var(--acd)}
.kb-hd{cursor:pointer;user-select:none;padding:9px 12px;font-size:13px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:8px;list-style:none}
.kb-hd::-webkit-details-marker{display:none}
.kb-hd::before{content:'▶';font-size:9px;color:var(--t3);transition:transform .2s;flex-shrink:0}
.kb-sec[open] .kb-hd::before{transform:rotate(90deg);color:var(--ac)}
.kb-sec[open] .kb-hd{color:var(--t1)}
.kb-hd:hover{background:var(--bg3)}
.kb-bd{padding:0 14px 12px 30px;font-size:13px;line-height:1.9;color:var(--t2)}
.kb-bd p{margin:4px 0}
.kb-bd b{color:var(--t1)}
.kb-bd code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:12px;color:var(--t1)}
.kb-bd pre{margin:8px 0;padding:10px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);overflow:auto;font-size:12px;line-height:1.7;font-family:'Menlo','Consolas','Courier New',monospace}
.kb-bd table{border-collapse:collapse;margin:10px 0;font-size:12.5px;width:100%}
.kb-bd th,.kb-bd td{border:1px solid var(--bd);padding:5px 9px;text-align:left;vertical-align:top}
.kb-bd th{background:var(--bg2);color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.kb-bd td:first-child{white-space:nowrap;color:var(--ac)}
.kb-bd .kb-warn{color:var(--wn)}
/* ── tag 字段控件（编辑 / 新建面板共用）──
   字段框里是「− 标签」小按钮（点一下移除）；点空白弹出库里已有的 tag 列表（「+ 标签」）。
   真正的值仍写在一个 hidden 的 data-f="tag" 里（竖线分隔），保存逻辑不用改。 */
.tag-field{border:1px solid var(--bd);border-radius:var(--r);background:var(--bg2);min-height:34px;padding:5px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:pointer}
.tag-field:hover{border-color:var(--ac)}
.tf-tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acd);color:var(--ac);cursor:pointer;user-select:none}
.tf-tag:hover{background:var(--dg);color:#fff}
.tf-empty{font-size:12px;color:var(--t3)}
.tp-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;max-height:46vh;overflow:auto;padding:1px}
.tp-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--bd);border-radius:999px;background:var(--bg2);color:var(--t2);font-size:12.5px;cursor:pointer}
.tp-item:hover{border-color:var(--ac);color:var(--ac)}
/* 已选中的：金底 + 前缀变 −，悬停变红提示「点一下是移除」，仍然可点 */
.tp-item.on{border-color:var(--ac);background:var(--acd);color:var(--ac)}
.tp-item.on .tp-op{color:var(--dg)}
.tp-item.on:hover{border-color:var(--dg);color:var(--dg)}
.tp-op{font-weight:700;color:var(--ac)}
.tp-n{font-size:11px;color:var(--t3)}
.tp-none{font-size:12.5px;color:var(--t3);padding:6px 0}
.tp-new{border-top:1px solid var(--bd);padding-top:12px}
.tp-new label{display:block;font-size:11px;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
/* ── 勾选分区替换 ── */
.pp-wrap{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow:auto;margin-bottom:10px;padding:1px}
.pp-row{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg2);cursor:pointer;font-size:12.5px;user-select:none}
.pp-row:hover{border-color:var(--ac)}
.pp-row input{position:relative;top:1px}
.pp-name{font-weight:600;color:var(--t1)}
.pp-key{font-size:11px;color:var(--t3)}
.pp-n{margin-left:auto;font-size:11px;color:var(--t3)}
.pp-tip{font-size:11.5px;color:var(--t3);margin-top:10px;line-height:1.8}
.lg-i{display:flex;align-items:center;gap:6px}
.lg-d{width:10px;height:10px;border-radius:50%}
.lg-d.u{background:var(--hl-uid)}.lg-d.s{background:var(--hl-site)}.lg-d.d{background:var(--hl-dup)}.lg-d.v{background:var(--val-err)}
.pg{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 20px;border-top:1px solid var(--bd)}
.pg button{padding:5px 10px;border-radius:var(--r);font-size:12px;color:var(--t2);border:1px solid var(--bd)}
.pg button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.pg button:disabled{opacity:.3;cursor:not-allowed}
.pg button.pa{background:var(--ac);color:#fff;border-color:var(--ac)}
.pg .pi{font-size:12px;color:var(--t3);margin:0 8px}
.log-panel{border-top:1px solid var(--bd);background:var(--bg1);display:flex;flex-direction:column;transition:height .3s ease;overflow:hidden}
.log-panel.open{height:300px}
.log-panel.closed{height:36px}
.log-hd{padding:8px 16px;font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;background:var(--bg2);cursor:pointer;user-select:none}
.log-hd:hover{background:var(--bg3)}
.log-toggle{font-size:10px;color:var(--t3);transition:transform .3s}
.log-panel.open .log-toggle{transform:rotate(90deg)}
.log-panel.closed .log-toggle{transform:rotate(0deg)}
.log-actions{margin-left:auto;display:flex;gap:8px}
.log-bd{flex:1;overflow-y:auto;padding:8px 16px;font-family:'Menlo','Consolas','Courier New',monospace;font-size:12px;line-height:1.7}
.log-entry{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-line{display:flex;gap:10px;align-items:baseline}
.log-time{color:var(--t3);white-space:nowrap;min-width:70px;flex-shrink:0}
.log-tag{font-weight:700;min-width:70px;text-transform:uppercase;flex-shrink:0}
.log-tag.info{color:var(--ac)}.log-tag.ok{color:var(--ok)}.log-tag.warn{color:var(--wn)}.log-tag.error{color:var(--dg)}.log-tag.match{color:var(--lg)}.log-tag.analysis{color:#f97316}.log-tag.conflict{color:var(--cf)}.log-tag.skip{color:var(--t3)}.log-tag.history{color:var(--lg)}
.log-msg{color:var(--t2);word-break:break-all}
.log-msg b{color:var(--t1);font-weight:600}
.log-detail{margin:6px 0 6px 80px;padding:8px 12px;background:var(--bg3);border-radius:6px;font-size:11px;line-height:1.8;border-left:3px solid var(--ac);white-space:pre-wrap;word-break:break-all}
.log-detail.warn{border-left-color:var(--wn)}
.log-detail.error{border-left-color:var(--dg)}
.log-detail.conflict{border-left-color:var(--cf);background:var(--cfd)}
.log-detail.skip{border-left-color:var(--t3);opacity:.8}

<script>
const DEFAULT_PARTITIONS=['GAL','音声/音乐','漫画/插画/本子','综合资源站','GAL情报/入正','轻小说','动漫','MMD','WIKI','二次元导航站','工具','搜索引擎','英灵殿'];
const FILE_PARTITION_MAP={'gal':'GAL','voice_music':'音声/音乐','comic_illustration':'漫画/插画/本子','hub':'综合资源站','gal-info':'GAL情报/入正','ln':'轻小说','anime':'动漫','mmd':'MMD','wiki':'WIKI','acg-nav':'二次元导航站','tools':'工具','search':'搜索引擎','valhalla':'英灵殿'};


const PART_KEY_MAP=Object.fromEntries(Object.entries(FILE_PARTITION_MAP).map(([k,v])=>[v,k]));
function partKey(partName){return PART_KEY_MAP[partName]||String(partName||'').trim()||'未分类';}
function keyToPart(key){const k=String(key||'').trim().toLowerCase();for(const[pk,pn]of Object.entries(FILE_PARTITION_MAP)){if(pk===k)return pn;}return null;}

function relUrls(v){
  let parts=[];
  if(!v)parts=[];
  else if(Array.isArray(v))parts=v;
  else if(typeof v==='object')parts=Object.entries(v).map(([l,u])=>`${l}|${u}`);
  else parts=String(v).split(/[,;，；\s]+/);
  return parts.map(s=>String(s).trim().replace(/^["']+|["']+$/g,''))
    .map(s=>s.includes('|')?s.split('|').pop():s)
    .filter(u=>/^https?:\/\//i.test(u));
}

const AUTO_LABEL_RULES=[['github.com','GitHub'],['gitlab.com','GitLab'],['gitee.com','Gitee'],['t.me','Telegram'],['telegram.org','Telegram'],['telegram.me','Telegram'],['discord','Discord'],['x.com','X'],['twitter.com','Twitter'],['bilibili.com','Bilibili'],['apps.apple.com','App Store'],['play.google.com','Google Play'],['steamcommunity.com','Steam'],['store.steampowered.com','Steam'],['weibo.com','微博'],['youtube.com','YouTube']];
function autoLabel(u){const h=normUrl(u).toLowerCase();for(const[f,l]of AUTO_LABEL_RULES){if(h.includes(f))return l;}return h||'链接';}
function isCommunityUrl(u){const h=normUrl(u).toLowerCase();return ['t.me','telegram.org','telegram.me','discord.com','discord.gg','qm.qq.com','jq.qq.com','qq.com'].some(c=>h===c||h.endsWith('.'+c));}
/* 把「一个元素」归一成 [label, url]。兼容这些写法：
     {label:'发布页', url:'https://x'} / {name, link} / {名称, 链接} / {'发布页':'https://x'}
     ['发布页', 'https://x']
   不是对象就返回 null，交给外层的字符串逻辑处理。 */
const PAIR_LABEL_KEYS=['label','name','title','text','名称','名','按钮名','站点','说明'];
const PAIR_URL_KEYS=['url','link','href','value','链接','地址','网址','站点地址'];
function normPairObj(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return null;
  const lk=PAIR_LABEL_KEYS.find(k=>k in o),uk=PAIR_URL_KEYS.find(k=>k in o);
  if(uk)return[lk?o[lk]:'',o[uk]];
  const e=Object.entries(o);
  return e.length?[e[0][0],e[0][1]]:null;
}
/* 把「被存成 JSON 字符串」的值解析回对象 —— 旧编辑器 bug 的产物，形如 '{"交流群":"http://…"}'。
   只对以 { 或 [ 开头的字符串尝试解析，普通 URL / QQ 群号 / 纯文本一律原样返回。 */
function parseMaybeJson(v){
  if(typeof v!=='string')return v;
  const s=v.trim();
  if(s.charAt(0)!=='{'&&s.charAt(0)!=='[')return v;
  try{const p=JSON.parse(s);if(p&&typeof p==='object')return p;}catch(e){}
  return v;
}
function linkPairs(v){ 
  /* 自愈：related/community 被存成"JSON 字符串"时先解析回对象，
     避免整串 JSON 被当成一条链接渲染出来。 */
  v=parseMaybeJson(v);
  let parts=[];
  if(!v)parts=[];
  else if(Array.isArray(v))parts=v.map(x=>[null,x]);
  else if(typeof v==='object')parts=Object.entries(v);
  else parts=String(v).split(/[,;，；]+/).map(x=>[null,x.trim()]);
  return parts.map(p=>{
    let label=p[0],raw=p[1];
    /* 元素本身还是对象/数组（如 related:[{label,url}]）→ 再解一层。
       以前这里直接把元素 String() 了，对象会变成 "[object Object]" 混进结果。 */
    if(raw&&typeof raw==='object'){
      const inner=Array.isArray(raw)?(raw.length>=2?[raw[0],raw[1]]:(raw.length?[null,raw[0]]:null)):normPairObj(raw);
      if(inner){if(label===null||label===undefined||label==='')label=inner[0];raw=inner[1];}
    }
    let val=String(raw??'').trim().replace(/^["']+|["']+$/g,'');
    if(label===null||label===undefined)label='';
    label=String(label).trim().replace(/^["']+|["']+$/g,'');
    if(!label&&val.includes('|')){label=val.slice(0,val.indexOf('|')).trim();val=val.slice(val.indexOf('|')+1).trim();}
    return {label:label,url:val};
  }).filter(p=>p.url&&!/^\[object /i.test(p.url));   /* 丢掉 "[object Object]" 这类被字符串化的脏值 */
}
function pairsToObj(pairs,filter){
  const out={};const used=new Map();
  for(const p of pairs){
    if(filter&&!filter(p))continue;
    let label=p.label||autoLabel(p.url);
    if(used.has(label)){const n=used.get(label)+1;used.set(label,n);label=label+' '+n;}else used.set(label,1);
    out[label]=p.url;
  }
  return out;
}
function normalizeItem(it){
  const o=Object.assign({},it);
  /* 分拣规则（2026-09-25 改）：
     - 原本就在 community 里的值，一律留在社群 —— 包括 QQ 群号 / 腾讯频道这类非 http 的值。
       旧逻辑只看域名，isCommunityUrl() 认不出非 http 值 → 会被当成"非社群"塞进 related，
       表现就是 community 跑到「相关」里去。
     - 保留单向补救：related 里混进的社群域名链接（t.me / discord / qq 群）仍挪到社群。
     - 绝不反向把社群内容塞回相关。 */
  const relPairs=linkPairs(o.related);
  const commPairs=linkPairs(o.community);
  const commUrls=new Set(commPairs.map(p=>p.url));
  const moved=relPairs.filter(p=>isCommunityUrl(p.url)&&!commUrls.has(p.url));
  const relKeep=relPairs.filter(p=>!isCommunityUrl(p.url)&&!commUrls.has(p.url));
  o.related=pairsToObj(relKeep);
  const comm=pairsToObj(commPairs.concat(moved));
  if(Object.keys(comm).length)o.community=comm;else delete o.community;
  return o;
}
const UID_FIELDS=['uid','id','UID','userId','user_id','siteId','site_id','rid','UUID','uuid','编号','标识'];

function gid(){return 'id_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function dlBlob(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),100);}

function normUrl(u){if(!u)return '';const s=String(u).trim();if(!s)return '';try{return new URL(s).hostname.replace(/^www\./,'');}catch{return s.replace(/^https?:\/\/(www\.)?/,'').split('/')[0];}}

/* 白名单现在按 UID 识别：判断的是"这个条目在不在白名单里" */
function isWhitelistedUid(uid){const u=String(uid||'').trim();if(!u)return false;return S.uidWhitelist.includes(u);}
/* 旧版白名单存的是域名 → 迁移成 UID：把该域名能匹配到的条目 uid 全部收进来。
   files 可显式传入（导入 JSON 时用 b.files），不传则用当前的 S.files。 */
function migrateDomainWhitelist(domains,files){
  const want=new Set((domains||[]).map(d=>String(d||'').trim().toLowerCase()).filter(Boolean));
  if(!want.size)return[];
  const all=((files||S.files||[])).flatMap(f=>f.data||[]);
  if(!all.length)return[];
  const sf=detectField(all,URL_FIELDS)?.field;
  if(!sf)return[];
  const out=new Set();
  all.forEach(it=>{
    const d=normUrl(String(it[sf]||'').trim()).toLowerCase();
    if(d&&want.has(d)){const u=String(it.uid||'').trim();if(u)out.add(u);}
  });
  return[...out];
}
/* 从导入的 JSON 里读白名单：新格式 uidWhitelist 直接用；
   旧格式 domainWhitelist 则用导入文件里的条目就地迁移成 UID。 */
function readImportedWhitelist(b){
  if(Array.isArray(b.uidWhitelist))return b.uidWhitelist.map(u=>String(u).trim()).filter(Boolean);
  if(Array.isArray(b.domainWhitelist)&&b.domainWhitelist.length){
    const uids=migrateDomainWhitelist(b.domainWhitelist,b.files);
    log(`🛡 导入的白名单是旧版（域名制），已迁移为 UID 制：${b.domainWhitelist.length} 个域名 → ${uids.length} 个 UID`,'warn');
    return uids;
  }
  return[];
}
function stringSimilarity(a,b){if(!a||!b)return 0;a=String(a).toLowerCase().trim();b=String(b).toLowerCase().trim();if(a===b)return 1;if(a.length<2||b.length<2)return 0;const bigrams=new Map();for(let i=0;i<a.length-1;i++){const bg=a.substring(i,i+2);bigrams.set(bg,(bigrams.get(bg)||0)+1);}let matches=0;for(let i=0;i<b.length-1;i++){const bg=b.substring(i,i+2);const cnt=bigrams.get(bg);if(cnt&&cnt>0){matches++;bigrams.set(bg,cnt-1);}}return(2*matches)/(a.length-1+b.length-1);}
function isSameEntity(a,b,nameField){if(!nameField)return{same:true,reason:'无名称字段，无法区分实体',similarity:-1};const nameA=String(a[nameField]||'').trim();const nameB=String(b[nameField]||'').trim();if(!nameA||!nameB)return{same:true,reason:'名称字段至少一方为空',similarity:-1};const sim=stringSimilarity(nameA,nameB);if(sim>=NAME_SIMILARITY_THRESHOLD)return{same:true,reason:'名称相似度 '+(sim*100).toFixed(1)+'% ≥ 阈值'+(NAME_SIMILARITY_THRESHOLD*100).toFixed(0)+'%',similarity:sim};return{same:false,reason:'名称相似度 '+(sim*100).toFixed(1)+'% < 阈值'+(NAME_SIMILARITY_THRESHOLD*100).toFixed(0)+'%，判定为不同实体',similarity:sim};}
function detectField(items,cands){if(!items.length)return null;const freq=new Map();for(const it of items){for(const k of Object.keys(it)){const lk=k.toLowerCase();const e=freq.get(lk)||{key:k,count:0};e.count++;freq.set(lk,e);}}for(const c of cands){const e=freq.get(c.toLowerCase());if(e)return{field:e.key,count:e.count,total:items.length};}return null;}
function getPartNameByFi(fi){const file=S.files[fi];if(!file)return '未知';const part=S.partitions.find(p=>p.id===file.partitionId);return part?part.name:'未知';}
function rebuildOffsets(){S.fileOffsets=new Map();let off=0;S.files.forEach(f=>{S.fileOffsets.set(f,off);off+=f.data.length;});}

function runValidation(){
  S.validationErrors.clear();
  let totalChecked=0,totalViolations=0,skippedWhitelist=0;
  const violationDetails=[];
  S.files.forEach((f,fi)=>{
    f.data.forEach((item,ii)=>{
      totalChecked++;
      const uidField=detectField([item],UID_FIELDS)?.field;
      const urlField=detectField([item],URL_FIELDS)?.field;
      const nameField=detectField([item],NAME_FIELDS)?.field;
      /* 白名单按 UID：命中的条目跳过"缺名称/URL/UID"的验证违规 */
      if(isWhitelistedUid(uidField?item[uidField]:'')){skippedWhitelist++;return;}
      const errors=[];
      if(!nameField || !String(item[nameField]||'').trim()) errors.push('名称缺失');
      if(!urlField || !String(item[urlField]||'').trim()) errors.push('URL缺失');
      if(!uidField || !String(item[uidField]||'').trim()) errors.push('UID缺失');
      if(errors.length>0){
        S.validationErrors.add(getGI(f,ii));
        totalViolations++;
        if(violationDetails.length<10) violationDetails.push(`📄 ${esc(f.name)}[${ii}] (${esc(getPartNameByFi(fi))}): ${errors.join(', ')}`);
      }
    });
  });
  if(skippedWhitelist){
    log(`<span class="log-skip-tag">⏭️ 验证违规跳过 ${skippedWhitelist} 条</span> 这些条目在白名单里`,'skip',`【跳过原因】已加入白名单，不参与"缺名称/URL/UID"校验`);
  }
  if(totalViolations>0){
    log(`⚠️ 验证违规: ${totalViolations}/${totalChecked} 条缺少核心字段`,'warn',violationDetails.join('\n')+(totalViolations>10?`\n...及其他 ${totalViolations-10} 条违规`:''));
  } else {
    log(`验证通过: 所有条目均包含名称、URL、UID`,'ok');
  }
  updateStats();
}

/* ============================================================
   加权相似度（v2.2）
   · 名字权重占大头。
   · URL 拆成两段分别算：
       - 服务商段（github.io / discord.gg / t.me / vercel.app …）是**共用的**，
         只有"相同"时才给分，而且权重很低（10）—— 免得两条不同站点被共用的服务商拉成"相似"。
       - 自有标识段（heyue-org、/web 这类）才是站点自己的标志，正常算权重（30）。
     例：heyue-org.github.io/web vs heri-org.github.io/web —— 服务商相同但自有标识不同，
         总分约 28%（< 35%）⇒ 不判为同一实体；
     heyue-org.github.io/web vs heyue-org.vercel.app —— 自有标识相同 ⇒ 约 70% ⇒ 判同一实体
         （可怀疑一个是主站一个是副站）。
   · UID 不参与（它是判定依据，不是"内容"）。
   · 分母固定为全部权重之和；字段缺失该项记 0 分（只会拉低总分，不会反过来放大相似度）。
   ============================================================ */
const SERVICE_HOSTS=['github.io','gitlab.io','gitee.io','pages.dev','netlify.app','vercel.app','herokuapp.com','firebaseapp.com','web.app','codeberg.page','sourceforge.net','discord.gg','discord.com','t.me','telegram.me','telegram.org','bilibili.com','steamcommunity.com','itch.io','gamejolt.com','weibo.com','youtube.com','nicovideo.jp','wikipedia.org','fandom.com','archive.org','pastebin.com','gist.github.com','jsdelivr.net','unpkg.com','npmjs.com','pypi.org','crates.io','greasyfork.org','wixsite.com','blogspot.com','wordpress.com','medium.com','notion.site','gitbook.io','readthedocs.io'];
const SIM_W={name:40,own:30,svc:10,related:15,community:5,remark:5,other:3};
const SIM_TOTAL=SIM_W.name+SIM_W.own+SIM_W.svc+SIM_W.related+SIM_W.community+SIM_W.remark+SIM_W.other;
function urlParts(u){
  const s=String(u||'').trim();
  let host='',path='';
  try{const U=new URL(s);host=U.hostname.toLowerCase();path=U.pathname.replace(/\/+$/,'');}
  catch(e){host=s.replace(/^https?:\/\//i,'').split(/[\/?#]/)[0].toLowerCase();path=s.replace(/^https?:\/\/[^/]*/i,'').replace(/\/+$/,'');}
  let svc='',own=host;
  for(const h of SERVICE_HOSTS){if(host===h||host.endsWith('.'+h)){svc=h;own=host.slice(0,host.length-h.length).replace(/\.$/,'');break;}}
  if(!svc&&host.indexOf('www.')===0)own=host.slice(4);
  return {svc:svc,own:(own+path)||''};
}
function relDomainSet(item){
  const set=new Set();const v=item&&item['related'];if(!v)return set;
  relUrls(v).forEach(function(l){const d=normUrl(l);if(d)set.add(d);});
  return set;
}
function weightedSim(a,b,nf,sf){
  let got=0;const det=[];
  if(nf){
    const na=String(a[nf]||'').trim(),nb=String(b[nf]||'').trim();
    if(na&&nb){const s=idfSim(na,nb);det.push('名称 "'+na+'" vs "'+nb+'" '+(s*100).toFixed(0)+'% → '+(s*SIM_W.name).toFixed(1)+'/'+SIM_W.name);got+=s*SIM_W.name;}
    else det.push('名称 缺字段 → 0/'+SIM_W.name);
  }
  if(sf){
    const pa=urlParts(a[sf]),pb=urlParts(b[sf]);
    const so=(pa.own&&pb.own)?idfSim(pa.own,pb.own):0;
    det.push('URL自有标识 "'+pa.own+'" vs "'+pb.own+'" '+(so*100).toFixed(0)+'% → '+(so*SIM_W.own).toFixed(1)+'/'+SIM_W.own);got+=so*SIM_W.own;
    const ss=(pa.svc&&pa.svc===pb.svc)?1:0;
    det.push('URL服务商 '+(pa.svc||'—')+' vs '+(pb.svc||'—')+' '+(ss?'相同':'不同')+' → '+(ss*SIM_W.svc).toFixed(1)+'/'+SIM_W.svc+(ss?'（共用服务商，低权重）':''));got+=ss*SIM_W.svc;
  }
  const ra=relDomainSet(a),rb=relDomainSet(b);let common=0;
  ra.forEach(function(d){if(rb.has(d))common++;});
  const sr=(ra.size&&rb.size)?(common/Math.max(ra.size,rb.size)):0;
  det.push('related 共同域名 '+common+'个 → '+(sr*SIM_W.related).toFixed(1)+'/'+SIM_W.related);got+=sr*SIM_W.related;
  ['community','remark'].forEach(function(k){
    const va=String(a[k]==null?'':a[k]).trim(),vb=String(b[k]==null?'':b[k]).trim();
    if(!va&&!vb)return;
    const s=(va&&vb)?idfSim(va,vb):0;
    det.push(k+' '+(s*100).toFixed(0)+'% → '+(s*SIM_W[k]).toFixed(1)+'/'+SIM_W[k]);got+=s*SIM_W[k];
  });
  let so=0,n=0;
  ['tag','logo'].forEach(function(k){
    const va=String(a[k]==null?'':a[k]).trim(),vb=String(b[k]==null?'':b[k]).trim();
    if(!va&&!vb)return;
    so+=(va&&vb)?idfSim(va,vb):0;n++;
  });
  const sother=n?(so/n):0;
  det.push('其它(tag/logo) → '+(sother*SIM_W.other).toFixed(1)+'/'+SIM_W.other);got+=sother*SIM_W.other;
  return {score:got/SIM_TOTAL,detail:det.join('\n│ ')};
}
/* ============================================================
   为什么需要 IDF：这个语料里"名字像"≠"同一实体" —— 鲲Galgame / H萌Galgame / Galgamex / Galgamer
   全是不同人办的不同站，只是共享 "Galgame" 这种通用词，普通 bigram 相似度能给到 80~85%。
   所以：① 相似度改成 **IDF 加权**（越常见的片段权重越低，"Galgame""com" 这类几乎不贡献分数，
   而"茶馆""梓澪""合月亭" 这类罕见片段才给高分）。② 模糊相似度不再单独当判据，必须 **先过硬关联门**。
   ============================================================ */
const TWO_LEVEL_SUFFIX=['com.cn','net.cn','org.cn','gov.cn','com.tw','com.hk','co.jp','or.jp','ne.jp','co.uk','org.uk','ac.uk','com.au','co.kr','com.br'];
let SIM_IDF=null;                    /* bigram → idf，detectConflicts 开头重建 */
function gramsOf(s){
  const x=String(s||'').toLowerCase().replace(/[^0-9a-z\u4e00-\u9fa5\u3040-\u30ff]+/g,'');
  const out=[];for(let i=0;i<x.length-1;i++)out.push(x.substring(i,i+2));
  return out;
}
function buildIdf(rows,nf,sf){
  const df=new Map();let N=0;
  rows.forEach(function(r){
    const s=String(r.item[nf]||'')+' '+urlParts(r.item[sf]).own;
    const set=new Set(gramsOf(s));
    if(!set.size)return;
    N++;
    set.forEach(function(g){df.set(g,(df.get(g)||0)+1);});
  });
  const idf=new Map();
  df.forEach(function(c,g){idf.set(g,Math.log((N+1)/(c+0.5)));});
  SIM_IDF=idf;
  return {N:N,terms:idf.size};
}
function idfSim(a,b){
  const w=function(g){return SIM_IDF?((SIM_IDF.get(g))||Math.log(6)):1;};   /* 语料里没见过的按"较罕见"计 */
  const ca=new Map(),cb=new Map();
  gramsOf(a).forEach(function(g){ca.set(g,(ca.get(g)||0)+1);});
  gramsOf(b).forEach(function(g){cb.set(g,(cb.get(g)||0)+1);});
  if(!ca.size||!cb.size)return 0;
  let shared=0,sa=0,sb=0;
  const ww=function(g){return w(g);};
  ca.forEach(function(cnt,g){const wg=ww(g);sa+=cnt*wg;const m=Math.min(cnt,cb.get(g)||0);shared+=m*wg;});
  cb.forEach(function(cnt,g){sb+=cnt*ww(g);});
  return (sa+sb)?(2*shared/(sa+sb)):0;
}
function hostOfUrl(u){
  try{return new URL(String(u||'').trim()).hostname.toLowerCase();}
  catch(e){return String(u||'').replace(/^https?:\/\//i,'').split(/[\/?#]/)[0].toLowerCase();}
}
/* 注册主域：去掉服务商后缀，再取"最后两段"（com.tw 这类取三段） */
function mainDomain(u){
  const h=hostOfUrl(u);if(!h)return '';
  let core=h;
  for(const s of SERVICE_HOSTS){if(h===s||h.endsWith('.'+s)){core=h.slice(0,h.length-s.length).replace(/\.$/,'');break;}}
  const parts=core.split('.').filter(Boolean);
  if(parts.length<=2)return parts.join('.');
  const l2=parts.slice(-2).join('.'),l3=parts.slice(-3).join('.');
  return TWO_LEVEL_SUFFIX.indexOf(l2)>=0?l3:l2;
}
/* 名称规范化：去括号及其内容、去空格、全角转半角、小写 */
function normName(v){
  let s=String(v||'').trim().toLowerCase();
  s=s.replace(/[（(][^）)]*[）)]/g,'');
  s=s.replace(/[\uff01-\uff5e]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xfee0);});
  s=s.replace(/\s+/g,'');
  return s;
}
function commKeys(item){
  const set=new Set();const v=item&&item['community'];if(!v)return set;
  const obj=(typeof v==='object')?v:parseMaybeJson(v);
  if(obj&&typeof obj==='object'){
    Object.keys(obj).forEach(function(k){
      const val=String(obj[k]==null?'':obj[k]).trim();
      if(val)set.add(val.replace(/^https?:\/\//i,'').split(/[\/?#]/)[0]+'|'+k);
    });
  }
  return set;
}
/* 硬关联：命中任一才允许继续打分。返回的数组就是命中的证据（写入日志） */
function hardLink(a,b,nf,sf){
  const L=[];
  const pa=urlParts(a[sf]),pb=urlParts(b[sf]);
  if(pa.own&&pa.own===pb.own)L.push('URL自有标识完全相同');
  const da=mainDomain(a[sf]),db=mainDomain(b[sf]);
  const na=normName(a[nf]),nb=normName(b[nf]);
  if(na&&na===nb&&da&&da===db)L.push('规范化名称相同 + 同主域');
  /* related 互指：任一方把对方的域名写进自己的 related */
  const dba=normUrl(String(b[sf]||'')),dab=normUrl(String(a[sf]||''));
  let relHit=false;
  relDomainSet(a).forEach(function(d){if(d===dba||mainDomain('https://'+d)===db)relHit=true;});
  if(!relHit)relDomainSet(b).forEach(function(d){if(d===dab||mainDomain('https://'+d)===da)relHit=true;});
  if(relHit)L.push('related 指向对方');
  /* ⚠️ 这里**故意不把「community 相同」算作硬关联**：同一个交流群只能说明是同一批人运营，
     不等于同一个站点 —— 实测 H萌漫画(comic.hmgal.com) 和 H萌Galgame(hmgal.com) 共用一个群，
     但确实是两个站，各自该有自己的 UID。community 仍参与打分（权重 5），只是不能单独开门。 */
  return L;
}
function detectConflicts(){
  resetLog();
  log(`🔍 ═══ 开始扫描 (v1.8) ═══`,'analysis',
    `总文件数: ${S.files.length}\n总条目数: ${S.files.reduce((s,f)=>s+f.data.length,0)}\n平台域名白名单: ${PLATFORM_DOMAINS.length}个\nUID白名单: ${S.uidWhitelist.length}个\n名称相似度阈值: ${(NAME_SIMILARITY_THRESHOLD*100).toFixed(0)}%`);

  const uc=new Set(), sc=new Set(), dupSet=new Set();
  const crossSame=new Set();      /* 跨分区同实体（完全一致）→ 仅标记，不算冲突 */
  S.issueGroups={uidConflicts:[], siteConflicts:[], duplicates:[]};

  const rows=[];
  S.files.forEach(function(f,fi){f.data.forEach(function(item,ii){rows.push({gi:getGI(f,ii),fi:fi,ii:ii,item:item,fn:f.name,pid:f.partitionId});});});
  const uidR=detectField(rows.map(function(r){return r.item;}),UID_FIELDS);
  const urlR=detectField(rows.map(function(r){return r.item;}),URL_FIELDS);
  const nameR=detectField(rows.map(function(r){return r.item;}),NAME_FIELDS);
  const uf=uidR?uidR.field:null, sf=urlR?urlR.field:null, nf=nameR?nameR.field:null;
  const idfStat=buildIdf(rows,nf,sf);
  const fieldCount=function(it){return Object.keys(it||{}).filter(function(k){return String(it[k]==null?'':it[k]).trim()!=='';}).length;};
  const entryDetailsOf=function(list,fu){return list.map(function(r,i){
    return '┌─ 条目 #'+(i+1)+'\n│ 来源: '+r.fn+'['+r.ii+']\n│ 分区: '+getPartNameByFi(r.fi)+'\n│ 全局索引: '+r.gi+'\n│ '+fu+': "'+String(r.item[fu]||'')+'"\n│ 完整数据:\n'+jsonBlock(r.item)+'\n└─';
  }).join('\n\n');};

  /* ============ 1. 同 UID ============ */
  if(uf){
    log(`🔍 ── 同 UID 检测 ──`,'analysis',`按 UID 分组后再看分区：跨分区完全一致→仅标记；跨分区有差异 / 同分区域名不同→UID冲突；同分区且相似→重复`);
    const g=new Map();
    rows.forEach(function(r){const u=String(r.item[uf]||'').trim();if(!u)return;if(!g.has(u))g.set(u,[]);g.get(u).push(r);});
    let nMark=0,nUidC=0,nDup=0,skipWl=0,skipOne=0;
    for(const [uid,list] of g.entries()){
      if(list.length<=1){skipOne++;continue;}
      if(S.uidWhitelist.includes(uid)){skipWl++;continue;}
      /* 按分区拆子组 */
      const byPart=new Map();
      list.forEach(function(r){if(!byPart.has(r.pid))byPart.set(r.pid,[]);byPart.get(r.pid).push(r);});
      const parts=[...byPart.values()];
      /* ① 同一分区里出现多条 */
      parts.forEach(function(sub){
        if(sub.length<=1)return;
        const domains=new Set(sub.map(function(r){return normUrl(String(r.item[sf]||'').trim());}));
        const names=new Set(sub.map(function(r){return String(r.item[nf]||'').trim();}));
        if(domains.size>1||names.size>1){
          nUidC++;sub.forEach(function(r){uc.add(r.gi);});
          S.issueGroups.uidConflicts.push({uid:uid,reason:'同分区同号但域名/站名不同 ⇒ 不同实体误用同一 UID',items:sub});
          log(`<span class="log-conflict-tag">⚠️ UID冲突（同分区）</span> uid="<b>${esc(uid)}</b>" ${sub.length}条`,'conflict',`【原因】同一分区内 ${sub.length} 条共用 UID ${uid}，但域名 ${domains.size} 个 / 站名 ${names.size} 个 ⇒ 判定为不同实体误用同一 UID，请人工处理\n\n${entryDetailsOf(sub,uf)}`);
          return;
        }
        const sameName=normName(sub[0].item[nf])===normName(sub[1].item[nf]);
        const sameDomain=mainDomain(sub[0].item[sf])===mainDomain(sub[1].item[sf]);
        const w=weightedSim(sub[0].item,sub[1].item,nf,sf);
        if(sameName&&sameDomain){
          nDup++;sub.forEach(function(r){dupSet.add(r.gi);});
          S.issueGroups.duplicates.push({partitionId:sub[0].pid,key:uid,items:sub});
          log(`<span class="log-conflict-tag">🗑️ 同分区重复</span> uid="${esc(uid)}" ${sub.length}条`,'conflict',`【处理】只保留字段最全的一条，其余删除\n【相似度】${(w.score*100).toFixed(1)}%\n│ ${w.detail}\n\n${entryDetailsOf(sub,uf)}`);
        }else{
          /* 同分区 + 同号 + 域名站名都一样，可内容却不相似 ⇒ 一样可疑，交人工 */
          nUidC++;sub.forEach(function(r){uc.add(r.gi);});
          S.issueGroups.uidConflicts.push({uid:uid,reason:'同分区同号、域名站名相同但加权相似度不足 ⇒ 疑似不同实体误用同一 UID',items:sub});
          log(`<span class="log-conflict-tag">⚠️ UID冲突（同分区·内容差异大）</span> uid="${esc(uid)}" ${sub.length}条`,'conflict',`【原因】域名和站名都一样，但加权相似度只有 ${(w.score*100).toFixed(1)}%（< ${(NAME_SIMILARITY_THRESHOLD*100).toFixed(0)}%）⇒ 疑似不同实体误用同一 UID，请人工处理\n│ ${w.detail}\n\n${entryDetailsOf(sub,uf)}`);
        }
      });
      /* ② 同一个 UID 跨了多个分区 */
      if(parts.length>1){
        const reps=parts.map(function(p){return p.slice().sort(function(a,b){return fieldCount(b.item)-fieldCount(a.item);})[0];});
        let allSame=true;
        for(let i=1;i<reps.length;i++){if(normVal(reps[0].item)!==normVal(reps[i].item)){allSame=false;break;}}
        if(allSame){
          nMark++;reps.forEach(function(r){crossSame.add(r.gi);});
          log(`🧩 跨分区同实体 uid="${esc(uid)}" 跨 ${parts.length} 个分区`,'match',`【处理】仅标记，不算冲突\n【说明】这些条目完全相同，是同一实体出现在多个分区\n\n${entryDetailsOf(reps,uf)}`);
        }else{
          nUidC++;reps.forEach(function(r){uc.add(r.gi);});
          S.issueGroups.uidConflicts.push({uid:uid,reason:'跨分区同号但条目内容有差异 ⇒ 需人工确认是否为同一实体',items:reps});
          log(`<span class="log-conflict-tag">⚠️ UID冲突（跨分区·内容有差异）</span> uid="${esc(uid)}" 跨 ${parts.length} 个分区`,'conflict',`【原因】同一 UID 的条目分布在不同分区，且内容存在任何差异 ⇒ 上报人工处理\n\n${entryDetailsOf(reps,uf)}`);
        }
      }
    }
    log(`同 UID 检测完成: 仅标记 ${nMark} 组, UID冲突 ${nUidC} 组, 同分区重复 ${nDup} 组, 单条跳过 ${skipOne} 组, 白名单跳过 ${skipWl} 组`,(nUidC+nDup)?'warn':'ok');
  }

  /* ============ 2. 不同 UID（站点冲突） ============ */
  if(uf&&(nf||sf)){
    log(`🔍 ── 站点冲突检测 ──`,'analysis',`条件: 不同 UID + 加权相似度 ≥ ${(NAME_SIMILARITY_THRESHOLD*100).toFixed(0)}%`);
    const cand=rows.filter(function(r){return !S.uidWhitelist.includes(String(r.item[uf]||'').trim());});
    const pairs=new Map();let checked=0;
    for(let i=0;i<cand.length;i++){
      for(let j=i+1;j<cand.length;j++){
        const ua=String(cand[i].item[uf]||'').trim(), ub=String(cand[j].item[uf]||'').trim();
        if(!ua||!ub||ua===ub)continue;   /* 缺 UID 或同 UID —— 同 UID 由上一节处理 */
        checked++;
        const hl=hardLink(cand[i].item,cand[j].item,nf,sf);
        if(!hl.length)continue;   /* 无硬关联 → 直接排除：名字像不等于同一实体 */
        const w=weightedSim(cand[i].item,cand[j].item,nf,sf);
        if(w.score<NAME_SIMILARITY_THRESHOLD)continue;
        if(!pairs.has(cand[i].gi))pairs.set(cand[i].gi,new Set());
        pairs.get(cand[i].gi).add(cand[j].gi);
        if(!pairs.has(cand[j].gi))pairs.set(cand[j].gi,new Set());
        pairs.get(cand[j].gi).add(cand[i].gi);
      }
    }
    /* 互相连通的并成一组（同一实体被拆成好几个号） */
    const seen=new Set();let scc=0;
    for(const [gi,set] of pairs.entries()){
      if(seen.has(gi))continue;
      const group=[gi];const queue=[gi];seen.add(gi);
      while(queue.length){
        const cur=queue.pop();
        (pairs.get(cur)||new Set()).forEach(function(ng){if(!seen.has(ng)){seen.add(ng);group.push(ng);queue.push(ng);}});
      }
      if(group.length<2)continue;
      const items=group.map(function(gg){return rows.find(function(r){return r.gi===gg;});}).filter(Boolean);
      if(items.length<2)continue;
      const un=new Set(items.map(function(r){return String(r.item[uf]||'').trim();}));
      scc++;items.forEach(function(r){sc.add(r.gi);});
      S.issueGroups.siteConflicts.push({uid:'（多号）',domain:'加权相似度',items:items});
      const ev=[];items.forEach(function(x){items.forEach(function(y){if(x!==y)hardLink(x.item,y.item,nf,sf).forEach(function(e){if(ev.indexOf(e)<0)ev.push(e);});});});
      log(`<span class="log-conflict-tag">⚠️ 站点冲突 #${scc}</span> ${items.length}条 / UID ${un.size}个`,'conflict',`【原因】判定为同一实体，但用了 ${un.size} 个不同 UID ⇒ 应归一成一个号\n【硬关联证据】${ev.join(' / ')}\n【UID】${[...un].join('、')}\n\n${entryDetailsOf(items,uf)}`);
    }
    log(`站点冲突检测完成: ${scc} 组（共比对 ${checked} 对）`,scc?'warn':'ok');
  }

  S.crossPartitionSame=crossSame;
  S.conflicts={uid:uc, site:sc};
  S.duplicates=dupSet;
  const totalIssues=new Set([...uc,...sc,...dupSet]).size;
  log(`🔍 ═══ 扫描结束 ═══`,'analysis',`UID冲突条目: ${uc.size}\n站点冲突条目: ${sc.size}\n重复条目: ${dupSet.size}\n受影响总条目: ${totalIssues}\n总数据量: ${rows.length}`);

  runValidation();
}

function startAutoProcessFromSelection(){
  if(S.selection.size===0){toast('请先在主表格中勾选需要处理的数据','wn');return;}
  const selectedGis = S.selection;
  const relevantGroups = [];
  S.issueGroups.uidConflicts.forEach(group=>{
    if(group.items.some(it=>selectedGis.has(it.gi))) relevantGroups.push({type:'uid', group});
  });
  S.issueGroups.siteConflicts.forEach(group=>{
    if(group.items.some(it=>selectedGis.has(it.gi))) relevantGroups.push({type:'site', group});
  });
  S.issueGroups.duplicates.forEach(group=>{
    if(group.items.some(it=>selectedGis.has(it.gi))) relevantGroups.push({type:'dup', group});
  });
  if(relevantGroups.length===0){toast('所选数据中没有可处理项','wn');return;}
  showAutoProcessPreview(relevantGroups);
}





function autoFieldSet(type,uidF){const s=new Set();if(type==='site')return s;if(uidF)s.add(uidF);return s;}

function minUidOf(items,uidF){
  if(!uidF)return '';
  let bestNum=Infinity,best='';
  for(const it of items){
    const raw=String((it.item||it)[uidF]??'').trim();
    if(!raw)continue;
    const n=parseInt(raw,10);
    if(!isNaN(n)&&n>0){if(n<bestNum){bestNum=n;best=raw;}}
    else if(bestNum===Infinity&&(!best||raw<best))best=raw;
  }
  if(!best){const c=items.map(it=>String((it.item||it)[uidF]??'').trim()).filter(Boolean).sort();best=c[0]||'';}
  return best;
}

function beginSelectEdit(sel){
  if(!sel||sel.dataset.editing==='1')return;
  const cur=sel.value, cell=sel.parentNode;
  sel.dataset.editing='1';
  sel.style.display='none';
  const inp=document.createElement('input');
  inp.type='text';inp.className='field-manual';inp.value=cur;
  cell.appendChild(inp);
  inp.focus();inp.select();
  let finished=false;
  const done=commit=>{
    if(finished)return;finished=true;
    const v=commit?inp.value:cur;
    inp.remove();
    sel.style.display='';
    sel.dataset.editing='';
    if(!commit)return;
    let opt=[...sel.options].find(o=>o.value===v);
    if(!opt){opt=document.createElement('option');opt.value=v;sel.appendChild(opt);}
    opt.textContent=trunc(v,30);
    sel.value=v;
    sel.classList.add('field-edited');
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();done(true);}
    else if(e.key==='Escape'){e.preventDefault();done(false);}
  });
  inp.addEventListener('blur',()=>done(true));
}
document.addEventListener('dblclick',e=>{
  const cell=e.target&&e.target.closest?e.target.closest('.sel-cell'):null;
  if(!cell)return;
  const sel=cell.querySelector('select.field-select');
  if(sel){e.preventDefault();beginSelectEdit(sel);}
});

function showAutoProcessPreview(groups){
  let html=`<div style="margin-bottom:12px;color:var(--t2)">共 ${groups.length} 个问题组，请确认处理方案。</div>`;
  groups.forEach(({type, group}, idx)=>{
    const title = type==='uid' ? `UID冲突组 #${idx+1} (UID="${group.uid}")` :
                  type==='site' ? `站点冲突组 #${idx+1} (域名="${group.domain}")` :
                  `重复组 #${idx+1} (分区="${getPartNameByFi(group.items[0].fi)}")`;
    html+=`<div class="preview-card"><div class="preview-card-header"><span class="preview-card-title">${esc(title)}</span></div>`;
    
    const allFields = [...new Set(group.items.flatMap(it=>Object.keys(it.item)))];
    const uidF = detectField(group.items.map(it=>it.item), UID_FIELDS)?.field;
    const autoFields = autoFieldSet(type, uidF);
    

    const showFieldSelector = true;

    html+=`<div class="preview-tbl-wrap"><table><thead><tr>`;
    html+=`<th style="width:40px">处理</th>`;
    html+=`<th style="width:80px">分区</th>`; 
    allFields.forEach(f=>{html+=`<th data-field="${esc(f)}">${esc(f)}</th>`;});
    html+=`</tr>`;

    if(showFieldSelector){
      html+=`<tr class="field-selector-row">`;
      html+=`<td></td><td></td>`; 
      allFields.forEach(f=>{
        if(autoFields.has(f)){
          html+=`<td><span style="color:var(--t3)">自动</span></td>`;
        } else {
          const values = [...new Set(group.items.map(it=>it.item[f]))];
          const defaultVal = (type==='site'&&f===uidF) ? minUidOf(group.items,uidF) : group.items[0].item[f];
          html+=`<td class="sel-cell" title="单击选择，双击手填"><select class="field-select" data-idx="${idx}" data-field="${esc(f)}">`;
          values.forEach(v=>{
            const selected = (String(v) === String(defaultVal)) ? 'selected' : '';
            html+=`<option value="${esc(String(v))}" ${selected}>${esc(trunc(String(v),30))}</option>`;
          });
          html+=`</select></td>`;
        }
      });
      html+=`</tr>`;
    }

    html+=`</thead><tbody>`;
    group.items.forEach((item, i)=>{
      const isKept = (type==='dup' && i===0) || (type==='uid' && i===0) || (type==='site' && i===0);
      html+=`<tr style="${isKept?'opacity:0.6;':''}">`;
      

      const defChk = (type === 'dup') ? ' checked' : '';
      html+=`<td>${isKept?'<span style="color:var(--t3)">-</span>':`<input type="checkbox" class="process-check" data-idx="${idx}" data-gi="${item.gi}"${defChk}>`}</td>`;
      html+=`<td style="font-size:11px">${esc(getPartNameByFi(item.fi))}</td>`;
      allFields.forEach(f=>{
        const val=String(item.item[f]??'');
        html+=`<td title="${esc(val)}">${esc(trunc(val,40))}</td>`;
      });
      html+=`</tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });

  showModal('自动处理预览',html,`<button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" id="confirmAutoProcess">✅ 确认执行</button>`);

let LAST_UID_CHANGES = [];
function executeAutoProcess(groups, checkedByGroup = {}, fieldChoices = {}){
  const snapshot = JSON.parse(JSON.stringify(S.files));
  LAST_UID_CHANGES = [];
  let totalUidUnify = 0, totalUidReassign = 0, totalCheckedDelete = 0, totalFieldUpdate = 0;
  const uidField = detectField(S.files.flatMap(f => f.data), UID_FIELDS)?.field;
  const NO_CHECKED = new Set();
  


  const DEL_OBJS = new Set();
  

  function setUid(it, val){
    const f=S.files[it.fi];
    if(!f||!f.data[it.ii])return false;
    const oldUid=String(f.data[it.ii][uidField]??'').trim();
    if(oldUid===val)return false;
    LAST_UID_CHANGES.push({old:oldUid,now:val,name:String(it.item.name||''),url:String(it.item.url||'')});
    f.data[it.ii][uidField]=val;
    return true;
  }
  function reassignUids(list, fixedUid){
    if(!list||!list.length)return 0;
    if(fixedUid){let n=0;list.forEach(it=>{if(setUid(it,fixedUid))n++;});return n;}
    const used=new Set();
    S.files.forEach(f=>f.data.forEach(x=>{if(x[uidField]!==undefined)used.add(String(x[uidField]).trim());}));
    let num=1,n=0;
    list.forEach(it=>{
      while(used.has(String(num).padStart(4,'0')))num++;
      const s=String(num).padStart(4,'0');
      if(setUid(it,s))n++;
      used.add(s);num++;
    });
    return n;
  }

  groups.forEach(({type, group}, idx) => {
    const fc = fieldChoices[idx] || {};
    const checkedGis = checkedByGroup[idx] || NO_CHECKED;
    
    const toDel = group.items.filter(it => checkedGis.has(it.gi));
    toDel.forEach(it=>{const f=S.files[it.fi];if(f&&f.data[it.ii])DEL_OBJS.add(f.data[it.ii]);});
    totalCheckedDelete += toDel.length;

    if (type === 'dup') {
      const kept = group.items[0];
      if (Object.keys(fc).length > 0) {
        Object.entries(fc).forEach(([field, value]) => {
          if (field !== uidField) {
            const fi = kept.fi, ii = kept.ii;
            if (S.files[fi] && S.files[fi].data[ii]) S.files[fi].data[ii][field] = value;
          }
        });
        totalFieldUpdate++;
      }
      
      totalUidReassign += reassignUids(group.items.filter(it=>!it.isKept&&!checkedGis.has(it.gi)), null);
    } else {
      const autoFields = autoFieldSet(type, uidField);
      

      const updateFields = Object.keys(fc).filter(f => !autoFields.has(f) && f !== uidField);

      group.items.forEach(item => {
        if (checkedGis.has(item.gi)) return;   
        const fi = item.fi, ii = item.ii;
        if (!S.files[fi] || !S.files[fi].data[ii]) return;
        updateFields.forEach(field => {
          S.files[fi].data[ii][field] = fc[field];
        });
        totalFieldUpdate++;
      });

      if (type === 'site') {
        
        const manual = Object.prototype.hasOwnProperty.call(fc, uidField) ? String(fc[uidField]).trim() : '';
        const targetUid = manual || minUidOf(group.items, uidField);
        if (!targetUid) {
          log(`⚠️ 站点冲突组 "${esc(group.domain||'')}" 找不到有效 UID，已跳过统一`,'warn');
        } else {
          totalUidUnify += reassignUids(group.items.filter(it => !checkedGis.has(it.gi)), targetUid);
        }
      } else if (type === 'uid') {
        
        totalUidReassign += reassignUids(group.items.filter(it => !it.isKept && !checkedGis.has(it.gi)), null);
      }
    }
  });

  if(DEL_OBJS.size){
    S.files.forEach(f => { f.data = f.data.filter(it => !DEL_OBJS.has(it)); });
  }
  rebuildOffsets();
  detectConflicts();
  refreshUI();
  saveState();
  const desc = `自动处理: 字段更新${totalFieldUpdate}条, UID统一${totalUidUnify}条, UID重分配${totalUidReassign}条, 勾选删除${totalCheckedDelete}条`;
  addHistory(desc, snapshot);
  toast(`✅ ${esc(desc)}`, 'ok', 5000, () => undoLast(snapshot));
}

function addHistory(desc,snapshot){
  const entry={id:Date.now(),ts:new Date().toISOString(),desc,snapshot};
  S.history.unshift(entry);
  while(S.history.length>50){
    const removed=S.history.pop();
    if(removed) dbDeleteHistory(removed.id);
  }
  dbAddHistory(entry);
}
function undoLast(snapshotOverride){
  const snap=snapshotOverride||(S.history[0]&&S.history[0].snapshot);
  if(!snap){toast('没有可撤销的操作','wn');return;}
  S.files=JSON.parse(JSON.stringify(snap));
  if(!snapshotOverride&&S.history.length){const removed=S.history.shift();dbDeleteHistory(removed.id);}
  rebuildOffsets();detectConflicts();refreshUI();saveState();
  toast('已撤销','ok');
}
function showHistoryPanel(){
  let html='';
  if(!S.history.length) html='<div style="text-align:center;color:var(--t3);padding:40px">暂无操作历史</div>';
  else S.history.forEach(h=>{
    html+=`<div class="preview-item"><div class="pi-hd"><span style="font-size:12px;color:var(--t3)">${new Date(h.ts).toLocaleString()}</span><button class="btn btn-o btn-sm" onclick="undoFromHistory('${h.id}')" title="撤销此步操作">↩️ 撤销</button></div><div style="font-size:13px">${esc(h.desc)}</div></div>`;
  });
  showModal('操作历史',html,'<button class="btn btn-o" onclick="closeModal()">关闭</button>');
}
async function undoFromHistory(id){
  const entry=S.history.find(h=>h.id==id);if(!entry)return;
  undoLast(entry.snapshot);
  const idx=S.history.findIndex(h=>h.id==id);
  const toRemove=S.history.splice(0,idx+1);
  for(const r of toRemove) await dbDeleteHistory(r.id);
  closeModal();showHistoryPanel();
}

function updateStats(){
  const visibleFiles = getFF();
  const t=visibleFiles.reduce((s,f)=>s+f.data.length,0);
  const visibleGis = new Set();
  visibleFiles.forEach(f=>{const fi=S.files.indexOf(f);f.data.forEach((_,ii)=>visibleGis.add(getGI(f,ii)));});
  const uidC = [...S.conflicts.uid].filter(gi=>visibleGis.has(gi)).length;
  const siteC = [...S.conflicts.site].filter(gi=>visibleGis.has(gi)).length;
  const dupC = [...S.duplicates].filter(gi=>visibleGis.has(gi)).length;
  const valC = [...S.validationErrors].filter(gi=>visibleGis.has(gi)).length;
  const uidF=detectField(visibleFiles.flatMap(f=>f.data),UID_FIELDS)?.field;
  const uidSet=new Set();
  if(uidF)visibleFiles.forEach(f=>f.data.forEach(it=>{const u=String(it[uidF]??'').trim();if(u)uidSet.add(u);}));
  const stEl=document.getElementById('statsTotal');
  stEl.textContent=`UID: ${uidSet.size}`;
  stEl.title=`当前视图共 ${t} 条数据，其中有 UID 的 ${uidSet.size} 个（已去重）`;
  document.getElementById('statsConflicts').textContent=`冲突: ${uidC+siteC}`;
  document.getElementById('statsValidation').textContent=`违规: ${valC}`;
}

function matchFileToPartition(filename){const base=filename.replace(/\.[^.]+$/,'').toLowerCase().trim();if(FILE_PARTITION_MAP[base])return{matched:true,partition:FILE_PARTITION_MAP[base],rule:`精确匹配: "${base}" → "${FILE_PARTITION_MAP[base]}"`};const norm=base.replace(/[-_\s]+/g,'');for(const[k,p]of Object.entries(FILE_PARTITION_MAP)){if(k.replace(/[-_\s]+/g,'')===norm)return{matched:true,partition:p,rule:`模糊匹配: "${base}"→"${norm}" ≈ "${k}" → "${p}"`};}return{matched:false,partition:null,rule:`未匹配: "${base}" 无对应映射`};}
async function handleFileSelect(e){const fs=Array.from(e.target.files);e.target.value='';if(fs.length)await processFiles(fs);}
async function processFiles(fileList){
  for(const file of fileList){
    try{
      const text=await readText(file);let data;
      try{data=JSON.parse(text);}catch(pe){toast(`❌ ${esc(file.name)} 不是有效JSON`,'error');continue;}
      const normName=file.name.replace(/\.[^.]+$/,'').trim();
      
      if(data&&typeof data==='object'&&!Array.isArray(data)&&Array.isArray(data.files)){await importBundle(data,normName);continue;}
      if(Array.isArray(data)){await importSingle(normName,data);}
      else if(data&&typeof data==='object'){
        
        const entries=entriesOfData(data);
        if(!entries.length){toast(`❌ ${esc(file.name)} 对象里没有数组字段`,'error');continue;}
        await runImportDiff(entries);
      }
      else{toast(`❌ ${esc(file.name)} 不支持的类型`,'error');}
    }catch(e){toast(`❌ ${esc(file.name)}: ${esc(e.message)}`,'error');}
  }
  rebuildOffsets();await saveState();detectConflicts();refreshUI();
}






function entriesOfData(data){
  return Object.keys(data).filter(k=>Array.isArray(data[k]))
    .map(k=>({key:k,partName:keyToPart(k)||k,items:data[k]}));
}
function countOfPart(partName){
  const p=S.partitions.find(x=>x.name===partName);
  if(!p)return 0;
  return S.files.filter(f=>f.partitionId===p.id).reduce((s,f)=>s+f.data.length,0);
}
/* ============================================================
   导入对比（v2.2 起取代原来的「一键替换 / 勾选分区替换 / 合并导入」）
   规则：
   · 有 UID 的条目：按 UID 配对 → 相同 / 改动（字段级可挑）/ 新增 / 仅我有（可删）
   · 没有 UID 的条目：整个条目比，完全一样才算相同，**只要有一点不一样就当新增**
   · 「仅我有」默认不勾（= 不删），勾了才删
   ============================================================ */
function normVal(v){
  if(v===null||v===undefined)return '';
  if(typeof v==='object'){
    if(Array.isArray(v))return '['+v.map(normVal).join(',')+']';
    const o={};Object.keys(v).sort().forEach(k=>{o[k]=normVal(v[k]);});return JSON.stringify(o);
  }
  return String(v).trim();
}
function dispVal(v){ if(v===null||v===undefined)return ''; if(typeof v==='object')return JSON.stringify(v); return String(v); }
/* 历史脏值：早年代码把对象直接 String() 过，存成了 "[object Object]" 这种字符串。
   它不是真数据，表格和填写框一律当空处理（用户只要打开那条保存一次就自动清掉了）。 */
function isDirtyObjStr(v){ return typeof v==='string'&&/^\s*\[object [A-Za-z]+\]\s*$/.test(v); }
function itemUid(it){ const k=Object.keys(it||{}).find(x=>/^uid$/i.test(x)); return k?String(it[k]??'').trim():''; }
function itemName(it){ const k=Object.keys(it||{}).find(x=>/^name$/i.test(x)); return k?String(it[k]??''):''; }

function buildImportDiff(entries){
  const adds=[],changes=[],only=[]; let same=0;
  entries.forEach(e=>{
    const partName=String(e.partName||e.key||'').trim()||'未分类';
    const items=Array.isArray(e.items)?e.items:[];
    const p=S.partitions.find(x=>x.name===partName);
    const files=p?S.files.filter(f=>f.partitionId===p.id):[];
    const mine=[];
    files.forEach(f=>{const fi=S.files.indexOf(f);f.data.forEach((it,ii)=>mine.push({it,fi,ii}));});
    const mineByUid=new Map(),mineNoUid=[];
    mine.forEach(m=>{const u=itemUid(m.it);if(u)mineByUid.set(u,m);else mineNoUid.push(m);});
    const inByUid=new Set();
    items.forEach(it=>{
      const u=itemUid(it);
      if(u){
        inByUid.add(u);
        const m=mineByUid.get(u);
        if(!m){adds.push({partName,key:e.key,item:it});return;}
        const keys=[...new Set([...Object.keys(m.it||{}),...Object.keys(it||{})])];
        keys.sort((a,b)=>{const ia=NEW_FIELD_ORDER.indexOf(a),ib=NEW_FIELD_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
        const fd=[];
        keys.forEach(k=>{if(normVal(m.it[k])!==normVal(it[k]))fd.push({field:k,old:dispVal(m.it[k]),neu:dispVal(it[k])});});
        if(!fd.length){same++;return;}
        changes.push({partName,key:e.key,item:it,target:m,fields:fd});
        return;
      }
      /* 无 UID：整条比对，有一点不一样就当新增 */
      const nv=normVal(it);
      /* 必须排除已匹配过的（!m.hit）：数据里若有完全重复的条目，
         不排除的话多条导入项会全部命中同一条现有项，剩下的重复项就被误判成「仅我有」。 */
      const hit=mineNoUid.find(m=>!m.hit&&normVal(m.it)===nv);
      if(hit){same++;hit.hit=true;return;}
      adds.push({partName,key:e.key,item:it});
    });
    mine.forEach(m=>{
      const u=itemUid(m.it);
      if(u){ if(!inByUid.has(u))only.push({partName,key:e.key,target:m}); }
      else if(!m.hit)only.push({partName,key:e.key,target:m});
    });
  });
  return {adds,changes,only,same};
}

function collectDiffPick(){
  const d=__di; if(!d)return null;
  const pick={adds:[],changes:[],only:[]};
  const byItem=new Map();
  document.querySelectorAll('.di-fld').forEach(c=>{ if(!c.checked)return; const i=+c.dataset.i,j=+c.dataset.j; if(!byItem.has(i))byItem.set(i,new Set()); byItem.get(i).add(j); });
  let ai=0;
  document.querySelectorAll('.di-add').forEach(c=>{ if(c.checked&&d.adds[ai])pick.adds.push(d.adds[ai]); ai++; });
  document.querySelectorAll('.di-chg').forEach(c=>{
    const i=+c.dataset.i; if(!c.checked||!d.changes[i])return;
    const fs=byItem.get(i)||new Set();
    pick.changes.push({c:d.changes[i],fields:d.changes[i].fields.filter((f,j)=>fs.has(j))});
  });
  let oi=0;
  document.querySelectorAll('.di-only').forEach(c=>{ if(c.checked&&d.only[oi])pick.only.push(d.only[oi]); oi++; });
  return pick;
}
async function applyDiffPick(pick){
  if(!pick)return;
  const snap=JSON.parse(JSON.stringify(S.files));
  const ensureFile=(partName,key)=>{
    let p=S.partitions.find(x=>x.name===partName);
    if(!p){p={name:partName,id:gid()};S.partitions.push(p);}
    let f=S.files.find(x=>x.name===key&&x.partitionId===p.id);
    if(!f){f={name:key,partitionId:p.id,data:[],lastModified:Date.now()};S.files.push(f);}
    return f;
  };
  let na=0,nc=0,no=0;
  pick.adds.forEach(a=>{ensureFile(a.partName,a.key).data.push(JSON.parse(JSON.stringify(a.item)));na++;});
  pick.changes.forEach(ch=>{
    const t=ch.c&&ch.c.target; if(!t)return;
    const f=S.files[t.fi]; if(!f)return;
    const it=f.data[t.ii]; if(!it)return;
    let did=0;
    ch.fields.forEach(fd=>{
      if(Object.prototype.hasOwnProperty.call(ch.c.item,fd.field)){it[fd.field]=ch.c.item[fd.field];}
      else delete it[fd.field];
      did++;
    });
    if(did){nc++;f.lastModified=Date.now();}
  });
  /* 删除：下标从大到小，避免错位 */
  pick.only.map(o=>o.target).sort((a,b)=>(b.fi-a.fi)||(b.ii-a.ii)).forEach(t=>{
    const f=S.files[t.fi]; if(!f)return;
    if(t.ii>=0&&t.ii<f.data.length){f.data.splice(t.ii,1);no++;f.lastModified=Date.now();}
  });
  rebuildOffsets();await saveState();detectConflicts();refreshUI();
  const desc='导入对比：新增 '+na+' / 改动 '+nc+' / 删除 '+no;
  addHistory(desc,snap);
  toast('✅ '+desc,'ok',5000,()=>undoLast(snap));
  log('🔍 导入对比完成','ok',desc+'\n相同跳过 '+(__di?__di.same:0)+' 条');
}
async function runImportDiff(entries){
  if(!entries||!entries.length)return;
  const d=buildImportDiff(entries);
  if(!d.adds.length&&!d.changes.length&&!d.only.length){
    toast('两份数据一致（'+d.same+' 条完全相同），没有可导入的改动','ok');return;
  }
  const pick=await showImportDiffModal(d);
  if(!pick)return;
  await applyDiffPick(pick);
}

async function importSingle(normName,items){

  const entries=[{key:normName,partName:mr.partition||normName,items:items}];
  await runImportDiff(entries);
}

function openEd(fi,ii){
  const item=S.files[fi].data[ii];
  S.editing={fi,ii,orig:item,item:{...item}};
  const bd=document.getElementById('editorBody');
  /* 用数组而非 Set —— 要按 NEW_FIELD_ORDER 排序，让 community 紧跟在 related 后面。
     条目本身没有 community 这个 key 时它是从 S.allFields 补进来的，不排会掉到最末尾。 */
  const keys=[...new Set([...Object.keys(item),...S.allFields])];
  keys.sort((a,b)=>{const ia=NEW_FIELD_ORDER.indexOf(a),ib=NEW_FIELD_ORDER.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  let h='';
  keys.forEach(k=>{
    let v=item[k]??'';
    if(k==='tag'){h+=tagFieldHtml(v);return;}
    /* related / community 是 JSON 字段 —— 必须**按字段名**判定，不能按"当前值的类型"判定：
       条目原本没有这个字段（值为空串）时，按类型判会退化成普通单行 input，
       用户输入的 {"按钮名":"链接"} 会被原样存成字符串，渲染时整串 JSON 当链接显示出来。
       isJSONF 的字段再套一层 parseMaybeJson：历史上已经存坏的字符串，打开时就修回对象并格式化，
       省得"related 有多行、community 没有"这种不一致。 */
    const isJSONF=(k==='related'||k==='community');
    if(isJSONF)v=parseMaybeJson(v);
    if(isDirtyObjStr(v))v='';   /* 历史脏值 "[object Object]" 不要在填写框里出现 */
    const isObj=(typeof v==='object'&&v!==null);
    const isC=isJSONF||isObj;const long=isC||String(v).length>80;
    /* 空对象 / 空数组在填写框里不要留下 "{}" —— 看着似有似无，用户会以为里面已经有东西 */
    const emptyObj=isObj&&(Array.isArray(v)?v.length===0:Object.keys(v).length===0);
    const dv=emptyObj?'':(isObj?JSON.stringify(v,null,2):String(v));
    const hint=(k==='related'||k==='community')?`<div style="font-size:11px;color:var(--t3);margin-top:3px">格式：{"按钮名":"链接"}，如 {"发布页":"https://x.com","备用域名":"https://y.com"}；链接不是 http 开头时，详情页会做成「点击复制」按钮（如QQ群号）</div>`:'';
    h+=`<div class="ed-field"><label>${esc(k)}${isC?' (JSON)':''}</label>${long?`<textarea data-f="${esc(k)}" data-complex="${isC}">${esc(dv)}</textarea>`:`<input type="text" data-f="${esc(k)}" value="${esc(dv)}">`}${hint}</div>`;
  });
  if(S.partitions.length>1){
    const currentPart=S.partitions.find(p=>p.id===S.files[fi].partitionId);
    let partOpts=S.partitions.filter(p=>p.id!==S.files[fi].partitionId).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
    h+=`<div class="ed-field" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--bd)"><label>🔀 移动到其他分区</label><div style="display:flex;gap:8px"><select id="movePartSel" style="flex:1"><option value="">选择目标分区...</option>${partOpts}</select><button class="btn btn-o btn-sm" onclick="moveItemToPartition(${fi},${ii})" title="移动条目到所选分区">移动</button></div><div style="font-size:11px;color:var(--t3);margin-top:4px">当前分区: ${esc(currentPart?.name||'未知')}</div></div>`;
  }
  h+=`<div class="ed-field" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--bd)"><label>➕ 添加新字段</label><div style="display:flex;gap:8px"><input type="text" id="nfN" placeholder="字段名" style="flex:1"><input type="text" id="nfV" placeholder="值" style="flex:1"><button class="btn btn-o btn-sm" onclick="addEF()" title="添加字段">添加</button></div></div>`;
  bd.innerHTML=h;
  paintTagField();
  document.getElementById('editorTitle').textContent='✏️ 编辑数据';
  document.getElementById('editorPanel').classList.add('open');
  document.getElementById('editorBackdrop').classList.add('show');
}
async function moveItemToPartition(fi,ii){
  const sel=document.getElementById('movePartSel');const targetId=sel?.value;
  if(!targetId){toast('请选择目标分区','wn');return;}
  const targetPart=S.partitions.find(p=>p.id===targetId);
  const sourcePart=S.partitions.find(p=>p.id===S.files[fi].partitionId);
  const item=S.files[fi].data[ii];const sourceFileName=S.files[fi].name;
  const targetFile=S.files.find(f=>f.partitionId===targetId&&f.name===sourceFileName);
  if(targetFile){targetFile.data.push({...item});targetFile.lastModified=Date.now();}

/* 把当前工作区拼成 data.json 的形状（分类 key → 条目数组）。
   每条都过一遍 normalizeItem —— 与「导出数据」走同一条路，
   所以 related/community 的分拣（谁进「相关」谁进「社群」）跟导出后完全一致。 */
function currentDataset(){
  const out={};
  S.files.forEach(f=>{
    const pn=(S.partitions.find(p=>p.id===f.partitionId)||{}).name||'未分类';
    const key=partKey(pn);
    (out[key]=out[key]||[]).push(...f.data.map(normalizeItem));
  });
  return JSON.parse(JSON.stringify(out));
}
function previewDetail(fi,ii){
  const f=S.files[fi];const item=f&&f.data[ii];
  if(!item){toast('这条读不到了','wn');return;}
  const pn=(S.partitions.find(p=>p.id===f.partitionId)||{}).name||'未分类';
  const key=partKey(pn);
  const uf=detectField([item],UID_FIELDS)?.field;
  const uid=uf?String(item[uf]??'').trim():'';
  if(!uid){toast('这条没有 UID —— 没有 UID 的条目在站点里也没有详情页','wn',4500);return;}
  /* ?v= 是缓存穿透：iframe 里的 detail.html 单独缓存，不跟着维护页的刷新更新，
     不加这个可能加载到没有预览通道的旧版本。query 必须排在 # 前面。 */
  const url='../../detail.html?v='+Date.now()+'#'+encodeURIComponent(key)+'/'+encodeURIComponent(uid);
  const body=`<div class="pv-tip">`
    +`<div style="margin-bottom:4px"><b>${esc(item.name||'(未命名)')}</b> · UID ${esc(uid)} · 分区 ${esc(pn)}（key: <code>${esc(key)}</code>）</div>`
    +`<div>预览的是<b>当前工作区的数据</b>（含还没导出的改动），走的是和「导出数据」相同的规整流程 —— 与磁盘上的 <code>data.json</code> 无关。</div>`
    +`</div><iframe class="pv-frame" id="pvFrame" src="${url}" loading="lazy"></iframe>`;
  showModal('👁 详情页预览', body,
    `<a class="btn btn-o" href="${url}" target="_blank" rel="noopener">在新标签打开（读磁盘 data.json）</a>`
    +`<button class="btn btn-p" onclick="closeModal()">关闭</button>`);
  /* iframe 里的 detail.html 就绪后，把当前数据推过去让它用内存数据渲染。
     推两次是保险：load 事件负责正常情况，定时器兜住"已经加载完/缓存命中"的情况，
     重复推送是幂等的。数据推达后详情页底部会出现「👁 预览模式」提示条 —— 没出现就是没推达。 */
  const fr=document.getElementById('pvFrame');
  if(!fr)return;
  const push=()=>{
    try{
      const ds=currentDataset();
      const n=Object.keys(ds).reduce((s,k)=>s+ds[k].length,0);
      fr.contentWindow.postMessage({type:'heyue:preview-data',data:ds,count:n},'*');
    }catch(e){}
  };
  fr.addEventListener('load',push);
  setTimeout(push,80);
}






const NEW_FIELD_ORDER=['name','url','related','community','remark','tag','issue','uid','logo'];
function filesOfPart(pid){return S.files.filter(f=>f.partitionId===pid);}

function suggestUid(){
  const items=S.files.flatMap(f=>f.data);
  if(!items.length)return '0001';
  const uf=detectField(items,UID_FIELDS)?.field||'uid';
  const used=new Set();
  items.forEach(it=>{const raw=String(it[uf]??'').trim();if(raw)used.add(raw);});
  for(let n=1;n<=9999;n++){const s=String(n).padStart(4,'0');if(!used.has(s))return s;}
  return '';
}

async function saveNewItem(){
  const ed=S.editing;const pid=ed.partitionId;
  const pn=(S.partitions.find(p=>p.id===pid)||{}).name||'未分类';
  const files=filesOfPart(pid);
  const raw={};
  document.querySelectorAll('#editorBody [data-f]').forEach(el=>{
    const k=el.getAttribute('data-f');const v=el.value;
    if(v===''){raw[k]='';return;}
    if(k==='related'||k==='community'){try{raw[k]=JSON.parse(v);}catch{raw[k]=v;}return;}
    raw[k]=v;
  });
  if(!String(raw.name??'').trim()){toast('name 不能为空','wn');return;}
  

  const ni={};
  NEW_FIELD_ORDER.forEach(k=>{
    if(!(k in raw))return;
    const v=raw[k];
    if(k==='tag'&&!String(v).trim())return;
    if(k==='community'&&(v===''||(v&&typeof v==='object'&&!Object.keys(v).length)))return;
    ni[k]=v;
  });
  Object.keys(raw).forEach(k=>{if(!(k in ni)&&k!=='tag'&&k!=='community')ni[k]=raw[k];});
  const snapshot=JSON.parse(JSON.stringify(S.files));
  
  let target=files[0];
  if(!target){
    target={name:partKey(pn),partitionId:pid,data:[],lastModified:Date.now()};
    S.files.push(target);
  }
  target.data.push(ni);target.lastModified=Date.now();
  rebuildOffsets();await saveState();detectConflicts();closeEditor();refreshUI();
  addHistory(`新建条目 ${target.name}：${ni.name}`,snapshot);
  log(`➕ 新建条目「${ni.name}」→ ${pn}（${target.name}，现 ${target.data.length} 条）`,'ok');
  toast(`✅ 已新建「${ni.name}」→ ${pn}`,'ok');
}

function exportDataJson(selectedOnly){
 try{
  if(selectedOnly&&S.selection.size===0){toast('请先在表格中勾选要导出的数据','wn');return;}
  if(!S.files||!S.files.length){toast('无数据','wn');return;}
  const groups={};               
  const order=[];                
  S.files.forEach(f=>{
    const pn=(S.partitions.find(p=>p.id===f.partitionId)||{}).name||'未分类';
    const key=partKey(pn);
    if(!(key in groups)){groups[key]=[];order.push(key);}
    f.data.forEach((item,ii)=>{
      if(selectedOnly&&!S.selection.has(getGI(f,ii)))return;
      groups[key].push(normalizeItem(item));   
    });
  });
  if(selectedOnly){
    for(const k of [...order]){if(!groups[k].length){delete groups[k];order.splice(order.indexOf(k),1);}}
    if(!order.length){toast('勾选的数据为空','wn');return;}
  }
  const out={};order.forEach(k=>out[k]=groups[k]);
  const name=selectedOnly?`data_selected_${new Date().toISOString().slice(0,10)}.json`:'data.json';
  dlBlob(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),name);
  const total=order.reduce((s,k)=>s+groups[k].length,0);
  log(`📤 导出${selectedOnly?'勾选数据':'data.json'}：${order.length} 个分类 / ${total} 条`,'ok',`分类: ${order.map(k=>`${k}(${groups[k].length})`).join(', ')}`);
  toast(`✅ 已导出 ${order.length} 个分类 / ${total} 条`,'ok');
 }catch(err){
  console.error('[exportDataJson]',err);
  try{log(`❌ 导出失败: ${err&&err.message}`,'error',String((err&&err.stack)||err||''));}catch(_){}
  toast(`❌ 导出失败: ${(err&&err.message)||err}`,'er',8000);
 }
}
async function handleBundleImport(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const t=await readText(f),b=JSON.parse(t);
    await importBundle(b,f.name.replace(/\.[^.]+$/,'').trim());
  }catch(err){toast('导入失败:'+err.message,'er');}
}
async function importBundle(b,fileName){
  try{
    let inParts=[],inFiles=[];
    if(Array.isArray(b)){ 
      inFiles=[{name:fileName,partition:matchFileToPartition(fileName+'.json').partition||'',data:b}];
    }else if(b&&Array.isArray(b.files)){ 
      inParts=Array.isArray(b.partitions)?b.partitions.filter(p=>p&&p.name):[];
      inFiles=b.files.filter(x=>x&&Array.isArray(x.data));
    }else if(b&&typeof b==='object'){ 
      inFiles=Object.entries(b)
        .filter(([,v])=>Array.isArray(v))
        .map(([k,v])=>({name:k,partition:keyToPart(k)||k,data:v}));
      if(!inFiles.length){toast('无效数据：对象里没有数组字段','error');return;}
    }else{toast('无效数据包：未找到 files 数组','error');return;}
    if(!inFiles.length){toast('数据包内无有效数据','error');return;}

    

    const inEntries=inFiles.map(f=>({key:f.name,partName:String(f.partition||'').trim()||keyToPart(f.name)||f.name,items:f.data}));
    /* v2.2：数据包同样走「导入对比」，不再整体替换或盲目追加 */
    readImportedWhitelist(b).forEach(u=>{ if(!S.uidWhitelist.includes(u)) S.uidWhitelist.push(u); });
    await runImportDiff(inEntries);
  }catch(err){toast('导入失败:'+err.message,'er');}
}

function showFreeUids(){
  const mm=document.getElementById('moreMenu');if(mm)mm.classList.remove('open');
  const items=S.files.flatMap(f=>f.data);
  if(!items.length){toast('当前没有数据','wn');return;}
  const uf=detectField(items,UID_FIELDS)?.field;
  if(!uf){toast('未识别到 UID 字段','wn');return;}
  const used=new Set();const odd=[];let max=-1;
  items.forEach(it=>{
    const raw=String(it[uf]??'').trim();
    if(!raw)return;
    used.add(raw);
    if(/^\d+$/.test(raw)){const n=parseInt(raw,10);if(n>max)max=n;}
    else odd.push(raw);
  });
  if(max<0){toast('没有纯数字 UID，无法计算区间','wn');return;}
  const W=Math.max(4,String(max).length);
  const pad=n=>String(n).padStart(W,'0');
  const free=[];
  for(let i=0;i<=max;i++){if(!used.has(pad(i)))free.push(i);}
  const segs=[];
  free.forEach(n=>{const last=segs[segs.length-1];if(last&&n===last.e+1)last.e=n;else segs.push({s:n,e:n});});
  const chips=segs.map(g=>g.s===g.e
    ?`<span class="uid-chip">${pad(g.s)}</span>`
    :`<span class="uid-chip">${pad(g.s)} – ${pad(g.e)}</span>`).join('');
  const body=`<div style="line-height:2;font-size:13px">
    <div>扫描范围：<b>${pad(0)} — ${pad(max)}</b>（共 ${max+1} 个号，基于当前已加载的全部数据）</div>
    <div>已占用：<b>${used.size}</b> 个 UID${odd.length?`，其中 <b>${odd.length}</b> 个不是纯数字，未参与区间扫描`:''}</div>
    <div>空出来：<b style="color:var(--ac)">${free.length}</b> 个</div>
    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;max-height:46vh;overflow:auto">${free.length?chips:'<span style="color:var(--t3)">这个区间内没有空号</span>'}</div>
  </div>`;
  showModal('🔍 空闲 UID 查询',body,'<button class="btn btn-p" onclick="closeModal()">关闭</button>');
}
