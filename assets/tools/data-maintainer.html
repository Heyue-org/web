<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据管理器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0f1117;--bg1:#1a1d27;--bg2:#242836;--bg3:#2d3244;--bg4:#363b50;
  --bd:#2e3348;--bd2:#3a3f55;
  --t1:#e4e6f0;--t2:#9498b0;--t3:#6b7094;
  --ac:#6c8cff;--ac2:#8aa4ff;--acd:rgba(108,140,255,.15);
  --dg:#ff5c6c;--dgd:rgba(255,92,108,.15);
  --wn:#ffb347;--wnd:rgba(255,179,71,.15);
  --ok:#4ecdc4;--okd:rgba(78,205,196,.15);
  --lg:#a78bfa;--lgd:rgba(167,139,250,.15);
  --cf:#ff4444;--cfd:rgba(255,68,68,.12);
  --hl-uid:#ff6b9d;--hl-uid-bg:rgba(255,107,157,.12);
  --hl-site:#c084fc;--hl-site-bg:rgba(192,132,252,.12);
  --hl-dup:#4ecdc4;--hl-dup-bg:rgba(78,205,196,.12);
  --val-err:#ffb347;--val-err-bg:rgba(255,179,71,.1);
  --r:8px;--rl:12px;--sh:0 4px 24px rgba(0,0,0,.3);--tr:.2s ease;
  --sw:260px;--hh:56px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg0);color:var(--t1);font-size:14px;line-height:1.5;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--t1);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:8px 12px;outline:none;transition:border-color var(--tr)}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--t3)}
.app{display:flex;height:100vh}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--bg1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;z-index:50;transition:left .3s ease}
.sidebar-hd{padding:16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.sidebar-hd h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.sidebar-act{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--bd)}
.sec-title{padding:12px 16px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--t3);display:flex;justify-content:space-between;align-items:center}
.p-list{flex:1;overflow-y:auto;padding:4px 8px}
.p-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:var(--r);cursor:pointer;transition:all var(--tr);margin-bottom:2px}
.p-item:hover{background:var(--bg3)}
.p-item.active{background:var(--acd);color:var(--ac)}
.p-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.p-cnt{font-size:11px;color:var(--t3);background:var(--bg2);padding:2px 8px;border-radius:10px;min-width:28px;text-align:center}
.p-item.active .p-cnt{background:var(--ac);color:#fff}
.p-del{opacity:0;margin-left:4px;color:var(--dg);font-size:12px;padding:2px 4px;border-radius:4px;transition:opacity var(--tr)}
.p-item:hover .p-del{opacity:1}
.p-del:hover{background:var(--dgd)}
.eye-btn{margin-left:4px;cursor:pointer;font-size:14px;opacity:.5;transition:opacity var(--tr)}
.eye-btn:hover{opacity:1}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.toolbar{height:var(--hh);min-height:var(--hh);display:flex;align-items:center;padding:0 20px;gap:10px;border-bottom:1px solid var(--bd);background:var(--bg1)}
.sep{width:1px;height:24px;background:var(--bd)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;transition:all var(--tr);white-space:nowrap}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ac2)}
.btn-o{border:1px solid var(--bd);color:var(--t2)}.btn-o:hover{border-color:var(--ac);color:var(--ac);background:var(--acd)}
.btn-d{background:var(--dg);color:#fff}.btn-d:hover{opacity:.85}
.btn-sm{padding:5px 10px;font-size:12px}
.search-box{position:relative;flex:0 1 280px}
.search-box input{width:100%;padding-left:32px}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{font-size:12px;color:var(--t3);padding:4px 10px;background:var(--bg2);border-radius:10px}
.batch-bar{height:48px;background:var(--ac);color:#fff;display:flex;align-items:center;padding:0 20px;gap:12px;font-size:13px;font-weight:600;animation:slideDown .2s ease}
.batch-bar .btn{background:rgba(255,255,255,.2);color:#fff;border:none}
.batch-bar .btn:hover{background:rgba(255,255,255,.3)}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.drop-zone{margin:16px 20px;padding:32px;border:2px dashed var(--bd);border-radius:var(--rl);text-align:center;transition:all var(--tr);cursor:pointer;background:var(--bg1)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--ac);background:var(--acd)}
.drop-zone.compact{padding:12px;margin:8px 20px}
.drop-zone.compact .dz-icon,.drop-zone.compact .dz-hint{display:none}
.dz-icon{font-size:36px;margin-bottom:8px}
.dz-text{color:var(--t2);font-size:14px}
.dz-hint{color:var(--t3);font-size:12px;margin-top:4px}
.file-bar{padding:0 20px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ftag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;background:var(--bg2);color:var(--t2);border:1px solid var(--bd)}
.ftag .fdel{cursor:pointer;opacity:.5;font-size:10px}.ftag .fdel:hover{opacity:1;color:var(--dg)}
.ftag.conflict{border-color:var(--wn);color:var(--wn)}
.ftag.hidden{opacity:.4}
.tbl-wrap{flex:1;overflow:auto;margin:0 20px 16px;border:1px solid var(--bd);border-radius:var(--rl);background:var(--bg1)}
.tbl-wrap table{width:100%;border-collapse:collapse;min-width:600px}
.tbl-wrap thead{position:sticky;top:0;z-index:10}
.tbl-wrap th{background:var(--bg2);padding:10px 14px;text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}
.tbl-wrap th:hover{color:var(--t1)}
.tbl-wrap th.sa::after{content:' ▲';font-size:10px}
.tbl-wrap th.sd::after{content:' ▼';font-size:10px}
.tbl-wrap td{padding:8px 14px;border-bottom:1px solid var(--bd);font-size:13px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tbl-wrap tr:hover td{background:var(--bg3)}
.tbl-wrap tr:last-child td{border-bottom:none}
.tbl-wrap tr.uc td{background:var(--hl-uid-bg)}
.tbl-wrap tr.uc td.uid-c{color:var(--hl-uid);font-weight:600}
.tbl-wrap tr.sc td{background:var(--hl-site-bg)}
.tbl-wrap tr.sc td.site-c{color:var(--hl-site);font-weight:600}
.tbl-wrap tr.dup td{background:var(--hl-dup-bg)}
.tbl-wrap tr.val-err td{background:var(--val-err-bg)}
.cell-act{opacity:0;transition:opacity var(--tr)}
.tbl-wrap tr:hover .cell-act{opacity:1}
.ce-btn{font-size:12px;padding:2px 6px;border-radius:4px;color:var(--ac)}.ce-btn:hover{background:var(--acd)}
.cd-btn{font-size:12px;padding:2px 6px;border-radius:4px;color:var(--dg)}.cd-btn:hover{background:var(--dgd)}
.empty{padding:60px 20px;text-align:center;color:var(--t3)}
.empty .ei{font-size:48px;margin-bottom:12px}
.no-res{padding:40px;text-align:center;color:var(--t3);font-size:14px}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.legend{display:flex;gap:16px;padding:8px 20px;font-size:12px;color:var(--t3)}
.lg-i{display:flex;align-items:center;gap:6px}
.lg-d{width:10px;height:10px;border-radius:50%}
.lg-d.u{background:var(--hl-uid)}.lg-d.s{background:var(--hl-site)}.lg-d.d{background:var(--hl-dup)}.lg-d.v{background:var(--val-err)}
.pg{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 20px;border-top:1px solid var(--bd)}
.pg button{padding:5px 10px;border-radius:var(--r);font-size:12px;color:var(--t2);border:1px solid var(--bd)}
.pg button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.pg button:disabled{opacity:.3;cursor:not-allowed}
.pg button.pa{background:var(--ac);color:#fff;border-color:var(--ac)}
.pg .pi{font-size:12px;color:var(--t3);margin:0 8px}
.log-panel{border-top:1px solid var(--bd);background:var(--bg1);display:flex;flex-direction:column;transition:height .3s ease;overflow:hidden}
.log-panel.open{height:300px}
.log-panel.closed{height:36px}
.log-hd{padding:8px 16px;font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;background:var(--bg2);cursor:pointer;user-select:none}
.log-hd:hover{background:var(--bg3)}
.log-toggle{font-size:10px;color:var(--t3);transition:transform .3s}
.log-panel.open .log-toggle{transform:rotate(90deg)}
.log-panel.closed .log-toggle{transform:rotate(0deg)}
.log-actions{margin-left:auto;display:flex;gap:8px}
.log-bd{flex:1;overflow-y:auto;padding:8px 16px;font-family:'Menlo','Consolas','Courier New',monospace;font-size:12px;line-height:1.7}
.log-entry{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-line{display:flex;gap:10px;align-items:baseline}
.log-time{color:var(--t3);white-space:nowrap;min-width:70px;flex-shrink:0}
.log-tag{font-weight:700;min-width:70px;text-transform:uppercase;flex-shrink:0}
.log-tag.info{color:var(--ac)}.log-tag.ok{color:var(--ok)}.log-tag.warn{color:var(--wn)}.log-tag.error{color:var(--dg)}.log-tag.match{color:var(--lg)}.log-tag.analysis{color:#f97316}.log-tag.conflict{color:var(--cf)}.log-tag.skip{color:var(--t3)}.log-tag.history{color:var(--lg)}
.log-msg{color:var(--t2);word-break:break-all}
.log-msg b{color:var(--t1);font-weight:600}
.log-detail{margin:6px 0 6px 80px;padding:8px 12px;background:var(--bg3);border-radius:6px;font-size:11px;line-height:1.8;border-left:3px solid var(--ac);white-space:pre-wrap;word-break:break-all}
.log-detail.warn{border-left-color:var(--wn)}
.log-detail.error{border-left-color:var(--dg)}
.log-detail.conflict{border-left-color:var(--cf);background:var(--cfd)}
.log-detail.skip{border-left-color:var(--t3);opacity:.8}
.log-json{display:block;margin-top:6px;padding:6px 10px;background:var(--bg0);border-radius:4px;font-size:10px;color:var(--t2);max-height:150px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;border:1px solid var(--bd)}
.log-kv{color:var(--ac);background:var(--acd);padding:1px 5px;border-radius:3px;font-size:11px}
.log-conflict-tag{color:var(--cf);background:var(--cfd);padding:1px 6px;border-radius:3px;font-size:11px;font-weight:700}
.log-skip-tag{color:var(--t3);background:rgba(107,112,148,.15);padding:1px 6px;border-radius:3px;font-size:11px;font-weight:700}
.ed-bd{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:998;opacity:0;pointer-events:none;transition:opacity .3s}
.ed-bd.show{opacity:1;pointer-events:auto}
.ed-panel{position:fixed;right:-520px;top:0;width:520px;height:100vh;background:var(--bg1);border-left:1px solid var(--bd);z-index:999;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.3);transition:right .3s ease}
.ed-panel.open{right:0}
.ed-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd)}
.ed-hd h3{font-size:15px;font-weight:600}
.ed-body{flex:1;overflow-y:auto;padding:20px}
.ed-ft{padding:12px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.ed-field{margin-bottom:14px}
.ed-field label{display:block;font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.ed-field input,.ed-field textarea{width:100%}
.ed-field textarea{min-height:60px;resize:vertical}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
.modal-ov.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg1);border:1px solid var(--bd);border-radius:var(--rl);width:95%;max-width:1200px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--sh);transform:translateY(20px) scale(.97);transition:transform .25s}
.modal-ov.show .modal{transform:translateY(0) scale(1)}
.m-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd)}
.m-hd h3{font-size:16px;font-weight:600}
.m-close{font-size:20px;color:var(--t3);padding:4px 8px;border-radius:var(--r)}.m-close:hover{background:var(--bg3);color:var(--t1)}
.m-bd{padding:20px;overflow-y:auto;flex:1}
.m-ft{padding:12px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{width:100%}
.preview-card{background:var(--bg2);border-radius:var(--r);margin-bottom:16px;border:1px solid var(--bd);overflow:hidden}
.preview-card-header{background:var(--bg3);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
.preview-card-title{font-size:14px;font-weight:600}
.field-toggle-panel{display:flex;flex-wrap:wrap;gap:4px;margin:8px 16px}
.field-toggle-btn{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg0);color:var(--t3);border:1px solid var(--bd);cursor:pointer}
.field-toggle-btn.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.preview-tbl-wrap{overflow:auto;max-height:300px;border:none}
.preview-tbl-wrap table{width:100%;border-collapse:collapse;min-width:800px}
.preview-tbl-wrap th{background:var(--bg2);padding:8px 12px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0;z-index:2}
.preview-tbl-wrap td{padding:6px 12px;border-bottom:1px solid var(--bd);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.preview-tbl-wrap tr:hover td{background:var(--bg3)}
.preview-tbl-wrap tr.selected td{background:var(--acd)}
.preview-tbl-wrap .tag-uid{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;background:var(--hl-uid-bg);color:var(--hl-uid)}
.preview-tbl-wrap .tag-dup{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;background:var(--hl-dup-bg);color:var(--hl-dup)}
.preview-tbl-wrap .tag-site{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;background:var(--hl-site-bg);color:var(--hl-site)}
.diff-old{color:var(--dg);text-decoration:line-through;margin-right:6px}
.diff-new{color:var(--ok);font-weight:600}
.toast-c{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--r);font-size:13px;font-weight:500;box-shadow:var(--sh);animation:tIn .3s ease;max-width:400px;display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--bd);color:var(--t1)}
.toast .undo-btn{color:var(--ac);font-weight:700;cursor:pointer;text-decoration:underline;white-space:nowrap}
.toast .timer{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--t3)}
@keyframes tIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.chk input[type="checkbox"]{width:16px;height:16px;accent-color:var(--ac)}
.menu-toggle{display:none;font-size:20px;padding:4px 8px;margin-right:8px}
@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;box-shadow:4px 0 20px rgba(0,0,0,.5)}
  .sidebar.open{left:0}
  .menu-toggle{display:block}
  .ed-panel{width:100%;right:-100%}
  .toolbar{padding:0 12px;gap:6px}
  .search-box{flex:1;min-width:0}
  .tb-r .btn span{display:none}
  .drop-zone{margin:8px 12px;padding:20px}
  .tbl-wrap{margin:0 12px 12px}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-hd"><h2>数据维护器 v1.7</h2><button class="m-close" onclick="toggleSidebar()" style="display:none" id="sidebarClose" title="关闭侧边栏">✕</button></div>
    <div class="sidebar-act">
      <button class="btn btn-p" onclick="document.getElementById('fileInput').click()" style="width:100%;justify-content:center" title="加载JSON数据文件">📂 加载数据文件</button>
      <input type="file" id="fileInput" multiple accept=".json" style="display:none">
    </div>
    <div class="sec-title">
      <span>数据分区</span>
      <button class="btn btn-o btn-sm" onclick="showAddPartitionModal()" style="padding:2px 8px;font-size:10px" title="新建数据分区">+ 新建</button>
    </div>
    <div class="p-list" id="partitionList"></div>
    <div class="sec-title"><span>系统设置</span></div>
    <div class="p-list" style="flex:0 0 auto;padding-bottom:12px">
      <div class="p-item" onclick="showHistoryPanel()"><span class="p-name">操作历史</span></div>
      <div class="p-item" onclick="showWhitelistModal()"><span class="p-name">域名白名单</span></div>
    </div>
  </div>

  <div class="main">
    <div class="batch-bar" id="batchBar" style="display:none">
      <span>已选择 <b id="batchCount">0</b> 条</span>
      <div style="flex:1"></div>
      <button class="btn btn-sm" onclick="clearSelection()" title="取消所有选择">取消选择</button>
      <button class="btn btn-sm" onclick="batchDelete()" style="background:rgba(255,92,108,.8)" title="批量删除选中条目">批量删除</button>
    </div>

    <div class="toolbar">
      <button class="menu-toggle" onclick="toggleSidebar()" title="菜单">☰</button>
      <div class="search-box"><input type="text" id="searchInput" placeholder="搜索名称、URL、UID..."></div>
      <div class="sep"></div>
      <label class="chk" title="仅显示冲突或违规数据"><input type="checkbox" id="showConflictsOnly"><span>仅异常</span></label>
      <div class="tb-r">
        <span class="badge" id="statsTotal">总计: 0</span>
        <span class="badge" id="statsConflicts">冲突: 0</span>
        <span class="badge" id="statsValidation" style="color:var(--wn)">违规: 0</span>
        <div class="sep"></div>
        <button class="btn btn-p btn-sm" onclick="startAutoProcessFromSelection()" title="仅处理当前勾选的异常数据">自动处理</button>
        <button class="btn btn-o btn-sm" onclick="showAutoProcessHelp()" title="自动处理逻辑说明">❓</button>
        <div class="sep"></div>
        <button class="btn btn-o btn-sm" onclick="exportSourceData()" title="导出原始JSON文件">📥</button>
        <button class="btn btn-o btn-sm" onclick="exportPartitionData()" title="按分区导出数据">📤</button>
        <div class="sep"></div>
        <button class="btn btn-o btn-sm" onclick="exportAllBundle()" title="保存完整工程包">💾</button>
        <button class="btn btn-o btn-sm" onclick="document.getElementById('bundleInput').click()" title="加载完整工程包">📦</button>
        <input type="file" id="bundleInput" accept=".json" style="display:none">
      </div>
    </div>

    <div class="content">

          <button class="btn btn-o btn-sm" onclick="event.stopPropagation();exportLog()" style="padding:2px 8px;font-size:10px" title="导出日志文本">💾 导出日志</button>
          <button class="btn btn-o btn-sm" onclick="event.stopPropagation();clearLog()" style="padding:2px 8px;font-size:10px" title="清空当前日志">清空</button>

<script>
const DEFAULT_PARTITIONS=['GAL','音声/音乐','漫画/插画/本子','综合资源站','GAL情报/入正','轻小说','动漫','MMD','WIKI','二次元导航站','工具','搜索引擎','英灵殿'];
const FILE_PARTITION_MAP={'gal':'GAL','voice_music':'音声/音乐','comic_illustration':'漫画/插画/本子','hub':'综合资源站','gal-info':'GAL情报/入正','ln':'轻小说','anime':'动漫','mmd':'MMD','wiki':'WIKI','acg-nav':'二次元导航站','tools':'工具','search':'搜索引擎','valhalla':'英灵殿'};
const UID_FIELDS=['uid','id','UID','userId','user_id','siteId','site_id','rid','UUID','uuid','编号','标识'];
const URL_FIELDS=['url','URL','link','website','domain','href','site','站点','网址','地址'];
const NAME_FIELDS=['name','Name','title','Title','名称','标题','siteName','site_name','网站名','站名'];
const DB_NAME='DataMaintainerDB';
const DB_VER=4;
const PLATFORM_DOMAINS=['github.com','gitlab.com','gitee.com','bitbucket.org','sourceforge.net','codeberg.org','greasyfork.org','userscripts.org','npmjs.com','pypi.org','crates.io','maven.org','docker.com','hub.docker.com','steamcommunity.com','store.steampowered.com','itch.io','gamejolt.com','discord.com','discord.gg','t.me','telegram.org','twitter.com','x.com','weibo.com','bilibili.com','youtube.com','nicovideo.jp','wikipedia.org','wikia.com','fandom.com','archive.org','pastebin.com','gist.github.com'];
const NAME_SIMILARITY_THRESHOLD=0.35;
let S={
  db:null, partitions:[], files:[], activePartition:'all', page:1, pageSize:50, query:'', sortField:null, sortDir:'asc',
  editing:null, allFields:[], conflicts:{uid:new Set(), site:new Set()}, duplicates:new Set(), validationErrors:new Set(),
  fileOffsets:new Map(), logs:[], selection:new Set(), history:[], domainWhitelist:[], hiddenPartitions:new Set(),
  issueGroups:{uidConflicts:[], siteConflicts:[], duplicates:[]}
};

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('appdata'))db.createObjectStore('appdata',{keyPath:'key'});if(!db.objectStoreNames.contains('history'))db.createObjectStore('history',{keyPath:'id'});};r.onsuccess=e=>{S.db=e.target.result;res(S.db);};r.onerror=e=>rej(e.target.error);});}
function dbSaveAll(data){return new Promise((res,rej)=>{const tx=S.db.transaction('appdata','readwrite');const store=tx.objectStore('appdata');for(const[k,v]of Object.entries(data))store.put({key:k,value:v,ts:Date.now()});tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error);});}
function dbGet(k){return new Promise((res,rej)=>{const tx=S.db.transaction('appdata','readonly');const r=tx.objectStore('appdata').get(k);r.onsuccess=()=>res(r.result?r.result.value:null);r.onerror=e=>rej(e.target.error);});}
function dbAddHistory(entry){return new Promise((res,rej)=>{const tx=S.db.transaction('history','readwrite');tx.objectStore('history').put(entry);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error);});}
function dbGetAllHistory(){return new Promise((res,rej)=>{const tx=S.db.transaction('history','readonly');const r=tx.objectStore('history').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=e=>rej(e.target.error);});}
function dbDeleteHistory(id){return new Promise((res,rej)=>{const tx=S.db.transaction('history','readwrite');tx.objectStore('history').delete(id);tx.oncomplete=()=>res();tx.onerror=e=>rej(e.target.error);});}
async function saveState(){try{await dbSaveAll({partitions:S.partitions,files:S.files,activePartition:S.activePartition,domainWhitelist:S.domainWhitelist,hiddenPartitions:[...S.hiddenPartitions]});}catch(e){log(`存储失败: ${e.message}`,'error');}}
async function loadState(){
  try{
    const p=await dbGet('partitions');const f=await dbGet('files');const a=await dbGet('activePartition');const wl=await dbGet('domainWhitelist');const hp=await dbGet('hiddenPartitions');
    if(p)S.partitions=p;if(f)S.files=f;if(a)S.activePartition=a;if(wl)S.domainWhitelist=wl;if(hp)S.hiddenPartitions=new Set(hp);
    S.history=await dbGetAllHistory();
  }catch(e){log(`加载状态失败: ${e.message}`,'error');}
  DEFAULT_PARTITIONS.forEach(n=>{if(!S.partitions.find(p=>p.name===n))S.partitions.push({name:n,id:gid()});});
}

function gid(){return 'id_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function trunc(s,n=60){if(!s)return'';s=String(s);return s.length>n?s.slice(0,n)+'...':s;}
function readText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>rej(new Error('读取失败'));r.readAsText(f,'UTF-8');});}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function dlBlob(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),100);}
function jsonBlock(obj){return `<span class="log-json">${esc(JSON.stringify(obj,null,2))}</span>`;}
function stripHtml(s){return s.replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");}
function normUrl(u){if(!u)return '';try{return new URL(u).hostname.replace(/^www\./,'');}catch{return u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0];}}
function isPlatformDomain(domain){if(!domain)return false;const d=domain.toLowerCase();for(const pd of PLATFORM_DOMAINS){if(d===pd||d.endsWith('.'+pd))return true;}return false;}
function isWhitelistedDomain(domain){if(!domain)return false;return S.domainWhitelist.some(w=>w.toLowerCase()===domain.toLowerCase());}
function stringSimilarity(a,b){if(!a||!b)return 0;a=String(a).toLowerCase().trim();b=String(b).toLowerCase().trim();if(a===b)return 1;if(a.length<2||b.length<2)return 0;const bigrams=new Map();for(let i=0;i<a.length-1;i++){const bg=a.substring(i,i+2);bigrams.set(bg,(bigrams.get(bg)||0)+1);}let matches=0;for(let i=0;i<b.length-1;i++){const bg=b.substring(i,i+2);const cnt=bigrams.get(bg);if(cnt&&cnt>0){matches++;bigrams.set(bg,cnt-1);}}return(2*matches)/(a.length-1+b.length-1);}
function isSameEntity(a,b,nameField){if(!nameField)return{same:true,reason:'无名称字段，无法区分实体',similarity:-1};const nameA=String(a[nameField]||'').trim();const nameB=String(b[nameField]||'').trim();if(!nameA||!nameB)return{same:true,reason:'名称字段至少一方为空',similarity:-1};const sim=stringSimilarity(nameA,nameB);if(sim>=NAME_SIMILARITY_THRESHOLD)return{same:true,reason:'名称相似度 '+(sim*100).toFixed(1)+'% ≥ 阈值'+(NAME_SIMILARITY_THRESHOLD*100).toFixed(0)+'%',similarity:sim};return{same:false,reason:'名称相似度 '+(sim*100).toFixed(1)+'% < 阈值'+(NAME_SIMILARITY_THRESHOLD*100).toFixed(0)+'%，判定为不同实体',similarity:sim};}
function detectField(items,cands){if(!items.length)return null;const freq=new Map();for(const it of items){for(const k of Object.keys(it)){const lk=k.toLowerCase();const e=freq.get(lk)||{key:k,count:0};e.count++;freq.set(lk,e);}}for(const c of cands){const e=freq.get(c.toLowerCase());if(e)return{field:e.key,count:e.count,total:items.length};}return null;}
function getPartNameByFi(fi){const file=S.files[fi];if(!file)return '未知';const part=S.partitions.find(p=>p.id===file.partitionId);return part?part.name:'未知';}
function rebuildOffsets(){S.fileOffsets=new Map();let off=0;S.files.forEach(f=>{S.fileOffsets.set(f,off);off+=f.data.length;});}
function getGI(file,ii){return(S.fileOffsets.get(file)??0)+ii;}

function toast(m,t='info',d=3000,undoFn=null){
  const c=document.getElementById('toastContainer'),e=document.createElement('div');
  e.className='toast';
  const safeMsg=String(m).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let html=`<span>${safeMsg}</span>`;
  if(undoFn){html+=`<span class="undo-btn">撤销</span><span class="timer">5</span>`;d=5000;}
  e.innerHTML=html;c.appendChild(e);
  let timer=d/1000;const timerEl=e.querySelector('.timer');
  const interval=setInterval(()=>{timer--;if(timerEl)timerEl.textContent=timer;if(timer<=0)clearInterval(interval);},1000);
  if(undoFn){e.querySelector('.undo-btn').onclick=()=>{clearInterval(interval);e.remove();undoFn();};}
  setTimeout(()=>{clearInterval(interval);e.style.opacity='0';e.style.transform='translateY(30px)';e.style.transition='.3s';setTimeout(()=>e.remove(),300);},d);
}

function log(msg,tag='info',detail=null){
  const now=new Date();const time=now.toTimeString().slice(0,8);
  const entry={time,tag,msg,detail,id:Date.now()+Math.random()};
  S.logs.push(entry);if(S.logs.length>2000)S.logs.shift();renderLog();
}
function renderLog(){
  const el=document.getElementById('logBody');const countEl=document.getElementById('logCount');if(!el)return;
  countEl.textContent=S.logs.length;let html='';
  for(const l of S.logs){
    html+=`<div class="log-entry"><div class="log-line"><span class="log-time">${l.time}</span><span class="log-tag ${l.tag}">${l.tag}</span><span class="log-msg">${l.msg}</span></div>`;
    if(l.detail){
      const cls=l.tag==='conflict'?'conflict':(l.tag==='skip'?'skip':(l.tag==='warn'||l.tag==='error'?l.tag:''));
      html+=`<div class="log-detail ${cls}">${l.detail}</div>`;
    }
    html+=`</div>`;
  }
  el.innerHTML=html;el.scrollTop=el.scrollHeight;
}
function clearLog(){S.logs=[];renderLog();}
function resetLog(){S.logs=[];renderLog();}
function toggleLog(){const p=document.getElementById('logPanel');p.classList.toggle('open');p.classList.toggle('closed');}
function exportLog(){
  if(!S.logs.length){toast('日志为空','wn');return;}
  const lines=S.logs.map(l=>{let line=`[${l.time}] [${l.tag.toUpperCase()}] ${stripHtml(l.msg)}`;if(l.detail)line+=`\n--- DETAIL START ---\n${stripHtml(l.detail)}\n--- DETAIL END ---`;return line;});
  const header=['# Data Maintainer Log Export v3.5',`# Generated: ${new Date().toISOString()}`,`# Total Entries: ${S.logs.length}`,'='.repeat(80),''].join('\n');
  dlBlob(new Blob([header+lines.join('\n\n')],{type:'text/plain;charset=utf-8'}),`maintainer_log_${new Date().toISOString().replace(/[:.]/g,'-')}.txt`);
  toast('日志已导出','ok');
}

function runValidation(){
  S.validationErrors.clear();
  let totalChecked=0,totalViolations=0;
  const violationDetails=[];
  S.files.forEach((f,fi)=>{
    f.data.forEach((item,ii)=>{
      totalChecked++;
      const uidField=detectField([item],UID_FIELDS)?.field;
      const urlField=detectField([item],URL_FIELDS)?.field;
      const nameField=detectField([item],NAME_FIELDS)?.field;
      const errors=[];
      if(!nameField || !String(item[nameField]||'').trim()) errors.push('名称缺失');
      if(!urlField || !String(item[urlField]||'').trim()) errors.push('URL缺失');
      if(!uidField || !String(item[uidField]||'').trim()) errors.push('UID缺失');
      if(errors.length>0){
        S.validationErrors.add(getGI(f,ii));
        totalViolations++;
        if(violationDetails.length<10) violationDetails.push(`📄 ${esc(f.name)}[${ii}] (${esc(getPartNameByFi(fi))}): ${errors.join(', ')}`);
      }
    });
  });
  if(totalViolations>0){
    log(`⚠️ 验证违规: ${totalViolations}/${totalChecked} 条缺少核心字段`,'warn',violationDetails.join('\n')+(totalViolations>10?`\n...及其他 ${totalViolations-10} 条违规`:''));
  } else {
    log(`验证通过: 所有条目均包含名称、URL、UID`,'ok');
  }
  updateStats();
}

function detectConflicts(){
  resetLog();
  log(`🔍 ═══ 开始扫描 (v1.7) ═══`,'analysis',
    `总文件数: ${S.files.length}\n总条目数: ${S.files.reduce((s,f)=>s+f.data.length,0)}\n平台域名白名单: ${PLATFORM_DOMAINS.length}个\n名称相似度阈值: ${(NAME_SIMILARITY_THRESHOLD*100).toFixed(0)}%`);

  const uc=new Set(), sc=new Set(), dupSet=new Set();
  S.issueGroups={uidConflicts:[], siteConflicts:[], duplicates:[]};

  const rows=[];
  S.files.forEach((f,fi)=>f.data.forEach((item,ii)=>{rows.push({gi:getGI(f,ii),fi,ii,item,fn:f.name,pid:f.partitionId});}));

  const uidR=detectField(rows.map(r=>r.item),UID_FIELDS);
  const urlR=detectField(rows.map(r=>r.item),URL_FIELDS);
  const nameR=detectField(rows.map(r=>r.item),NAME_FIELDS);

  if(uidR)log(`🔑 UID字段: "${uidR.field}" (${uidR.count}/${uidR.total}, ${(uidR.count/uidR.total*100).toFixed(1)}%)`,'analysis');
  else log(`🔑 UID字段未找到，UID冲突检测跳过`,'warn');
  if(urlR)log(`🌐 URL字段: "${urlR.field}" (${urlR.count}/${urlR.total}, ${(urlR.count/urlR.total*100).toFixed(1)}%)`,'analysis');
  else log(`🌐 URL字段未找到，站点冲突检测跳过`,'warn');
  if(nameR)log(`📛 名称字段: "${nameR.field}" (用于实体相似度判断)`,'analysis');
  else log(`📛 名称字段未找到，实体相似度判断将降级为保守模式`,'warn');

  const uf=uidR?uidR.field:null;
  const sf=urlR?urlR.field:null;
  const nf=nameR?nameR.field:null;

  if(uf){
    log(`🔍 ── UID冲突检测 ──`,'analysis',`条件: 相同"${uf}" + 不同URL域名`);
    const um={};
    rows.forEach(r=>{
      const u=String(r.item[uf]||'').trim();
      if(!u)return;
      if(!um[u])um[u]=[];
      um[u].push({gi:r.gi,fi:r.fi,ii:r.ii,url:sf?normUrl(String(r.item[sf]||'').trim()):'',rawUrl:sf?String(r.item[sf]||'').trim():'',related:r.item['related']||'',fn:r.fn,item:r.item});
    });
    let cc=0,skippedPlatform=0,skippedSimilarity=0,skippedWhitelist=0;
    for(const[uid,entries]of Object.entries(um)){
      if(entries.length<=1)continue;
      const urls=new Set(entries.map(e=>e.url).filter(Boolean));
      if(urls.size<=1)continue;
      const firstDomain=entries[0]?.url;
      if(isWhitelistedDomain(firstDomain)){skippedWhitelist++;continue;}
      const platformUrls=[...urls].filter(u=>isPlatformDomain(u));
      if(platformUrls.length===urls.size){
        skippedPlatform++;
        log(`<span class="log-skip-tag">⏭️ UID冲突跳过 #${uid}</span> 全部为平台域名`,'skip',`【跳过原因】所有${urls.size}个域名均为平台型域名: ${[...urls].join(', ')}`);
        continue;
      }
      const nonPlatformEntries=entries.filter(e=>!isPlatformDomain(e.url));
      if(nonPlatformEntries.length<=1){skippedPlatform++;continue;}
      let hasRealConflict=false;
      for(let i=0;i<nonPlatformEntries.length&&!hasRealConflict;i++){
        for(let j=i+1;j<nonPlatformEntries.length&&!hasRealConflict;j++){
          const check=isSameEntity(nonPlatformEntries[i].item,nonPlatformEntries[j].item,nf);
          if(check.same)hasRealConflict=true;
        }
      }
      if(!hasRealConflict && sf){
        const relatedDomains = nonPlatformEntries.map(e=>{
          const related = String(e.item['related']||'');
          if(!related) return new Set();
          const links = related.split(/[,;，；\s]+/).filter(Boolean);
          const domains = new Set();
          links.forEach(link=>{
            const dom=normUrl(link);
            if(dom) domains.add(dom);
          });
          return domains;
        });
        let commonRelated = false;
        outerLoop: for(let i=0;i<relatedDomains.length;i++){
          for(let j=i+1;j<relatedDomains.length;j++){
            const intersection = [...relatedDomains[i]].filter(d=>relatedDomains[j].has(d));
            if(intersection.length>0){
              commonRelated = true;
              break outerLoop;
            }
          }
        }
        if(commonRelated) hasRealConflict = true;
      }
      if(!hasRealConflict){
        skippedSimilarity++;
        log(`<span class="log-skip-tag">⏭️ UID冲突跳过 #${uid}</span> 名称相似度不足且无共同关联链接`,'skip',`【跳过原因】名称差异较大，且RELATED字段无共同域名，判定为不同实体`);
        continue;
      }
      cc++;
      entries.forEach(e=>uc.add(e.gi));
      S.issueGroups.uidConflicts.push({uid, items: entries});
      const entryDetails=entries.map((e,i)=>{
        return `┌─ 条目 #${i+1}\n│ 来源: ${e.fn}[${e.ii}]\n│ 所属分区: ${getPartNameByFi(e.fi)}\n│ 全局索引: ${e.gi}\n│ ${uf}: "${uid}"\n│ URL原始: "${e.rawUrl}"\n│ URL规范: "${e.url}"\n│ RELATED: "${e.related}"\n│ 完整数据:\n${jsonBlock(e.item)}\n└─`;
      }).join('\n\n');
      log(`<span class="log-conflict-tag">⚠️ UID冲突 #${cc}</span> uid="<b>${esc(uid)}</b>" ${urls.size}个不同域名`,'conflict',`【冲突原因】相同UID但域名不同，且名称相似或RELATED字段有共同链接\n\n【涉及的全部条目及完整数据】\n${entryDetails}`);
    }
    log(`UID冲突检测完成: ${cc}组真实冲突, ${skippedPlatform}组平台域名跳过, ${skippedSimilarity}组低相似度跳过, ${skippedWhitelist}组白名单跳过`,cc?'warn':'ok');
  }

  if(uf&&sf){
    log(`🔍 ── 站点冲突检测 ──`,'analysis',`条件: 相同URL域名 + 不同"${uf}"值`);
    const sm={};
    rows.forEach(r=>{
      const url=normUrl(String(r.item[sf]||'').trim());
      const u=String(r.item[uf]||'').trim();
      if(!url||!u)return;
      if(!sm[url])sm[url]=[];
      sm[url].push({gi:r.gi,fi:r.fi,ii:r.ii,uid:u,related:r.item['related']||'',fn:r.fn,item:r.item});
    });
    let scc=0,skippedPlatform=0,skippedSimilarity=0,skippedWhitelist=0;
    for(const[domain,entries]of Object.entries(sm)){
      if(entries.length<=1)continue;
      const uids=new Set(entries.map(e=>e.uid));
      if(uids.size<=1)continue;
      if(isWhitelistedDomain(domain)){skippedWhitelist++;continue;}
      if(isPlatformDomain(domain)){
        skippedPlatform++;
        log(`<span class="log-skip-tag">站点冲突跳过</span> 域名="<b>${esc(domain)}</b>" (${uids.size}个UID)`,'skip',`【跳过原因】"${domain}" 是平台型域名`);
        continue;
      }
      let hasRealConflict=false;
      let conflictPairInfo='';
      outer:for(let i=0;i<entries.length;i++){
        for(let j=i+1;j<entries.length;j++){
          const check=isSameEntity(entries[i].item,entries[j].item,nf);
          if(check.same){hasRealConflict=true;conflictPairInfo=`触发配对: "${String(entries[i].item[nf]||'')}" vs "${String(entries[j].item[nf]||'')}" (${check.reason})`;break outer;}
        }
      }
      if(!hasRealConflict && sf){
        const relatedDomains = entries.map(e=>{
          const related = String(e.item['related']||'');
          if(!related) return new Set();
          const links = related.split(/[,;，；\s]+/).filter(Boolean);
          const domains = new Set();
          links.forEach(link=>{
            const dom=normUrl(link);
            if(dom) domains.add(dom);
          });
          return domains;
        });
        let commonRelated = false;
        outerLoop2: for(let i=0;i<relatedDomains.length;i++){
          for(let j=i+1;j<relatedDomains.length;j++){
            const intersection = [...relatedDomains[i]].filter(d=>relatedDomains[j].has(d));
            if(intersection.length>0){
              commonRelated = true;
              break outerLoop2;
            }
          }
        }
        if(commonRelated) hasRealConflict = true;
      }
      if(!hasRealConflict){
        skippedSimilarity++;
        log(`<span class="log-skip-tag">⏭️ 站点冲突跳过</span> 域名="<b>${esc(domain)}</b>" (${uids.size}个UID)`,'skip',`【跳过原因】名称差异较大且RELATED无共同链接，判定为同一站点下的不同资源页面`);
        continue;
      }
      scc++;
      entries.forEach(e=>sc.add(e.gi));
      S.issueGroups.siteConflicts.push({domain, items: entries});
      const entryDetails=entries.map((e,i)=>{
        return `┌─ 条目 #${i+1}\n│ 来源: ${e.fn}[${e.ii}]\n│ 所属分区: ${getPartNameByFi(e.fi)}\n│ 全局索引: ${e.gi}\n│ ${uf}: "${e.uid}"\n│ 域名: "${domain}"\n│ RELATED: "${e.related}"\n│ 完整数据:\n${jsonBlock(e.item)}\n└─`;
      }).join('\n\n');
      log(`<span class="log-conflict-tag">⚠️ 站点冲突 #${scc}</span> 域名="<b>${esc(domain)}</b>" ${uids.size}个不同UID`,'conflict',`【冲突原因】相同域名但UID不同，且名称相似或RELATED字段有共同链接\n${conflictPairInfo}\n\n【涉及的全部条目及完整数据】\n${entryDetails}`);
    }
    log(`站点冲突检测完成: ${scc}组真实冲突, ${skippedPlatform}组平台域名跳过, ${skippedSimilarity}组低相似度跳过, ${skippedWhitelist}组白名单跳过`,scc?'warn':'ok');
  }

  log(`🔍 ── 同分区重复检测 ──`,'analysis',`条件: 同一分区内相同UID`);
  const dupMap=new Map();
  rows.forEach(r=>{
    if(!uf)return;
    const uid=String(r.item[uf]||'').trim();
    if(!uid)return;
    const key=`${r.pid}::${uid}`;
    if(!dupMap.has(key))dupMap.set(key,[]);
    dupMap.get(key).push(r);
  });
  let dupGroups=0;
  for(const[key,group]of dupMap.entries()){
    if(group.length<=1) continue;
    // 按非空字段数量降序排序，使字段最全的条目成为保留项
    group.sort((a,b)=>{
      const fa = Object.keys(a.item).filter(k => String(a.item[k]).trim() !== '').length;
      const fb = Object.keys(b.item).filter(k => String(b.item[k]).trim() !== '').length;
      return fb - fa;
    });
    dupGroups++;
    group.forEach(r=>dupSet.add(r.gi));
    S.issueGroups.duplicates.push({partitionId: group[0].pid, key, items: group});
    const kept=group[0];
    const partName=getPartNameByFi(kept.fi);
    const entryDetails=group.map((r,i)=>{
      return `┌─ ${i===0?'保留项 (字段最全)':'重复项'}\n│ 来源: ${r.fn}[${r.ii}]\n│ 所属分区: ${getPartNameByFi(r.fi)}\n│ 全局索引: ${r.gi}\n│ ${uf}: "${String(r.item[uf]||'')}"\n│ 完整数据:\n${jsonBlock(r.item)}\n└─`;
    }).join('\n\n');
    log(`<span class="log-conflict-tag">🗑️ 同分区UID重复 #${dupGroups}</span> 分区="${partName}" UID="${String(kept.item[uf]||'')}" ${group.length}条`,'conflict',`【保留项】${kept.fn}[${kept.ii}] (分区:${getPartNameByFi(kept.fi)}) uid="${String(kept.item[uf]||'')}"\n\n【重复项】\n${group.slice(1).map(r=>`${r.fn}[${r.ii}] (分区:${getPartNameByFi(r.fi)}) uid="${String(r.item[uf]||'')}"`).join('\n')}\n\n完整数据详情:\n${entryDetails}`);
  }
  if(dupGroups===0) log(`同分区重复: 无重复数据`,'ok');
  else log(`同分区重复检测完成: ${dupGroups}组`,'analysis');

  S.conflicts={uid:uc, site:sc};
  S.duplicates=dupSet;
  const totalIssues=new Set([...uc,...sc,...dupSet]).size;
  log(`🔍 ═══ 扫描结束 ═══`,'analysis',`UID冲突条目: ${uc.size}\n站点冲突条目: ${sc.size}\n重复条目: ${dupSet.size}\n受影响总条目: ${totalIssues}\n总数据量: ${rows.length}`);

  runValidation();
}

function startAutoProcessFromSelection(){
  if(S.selection.size===0){toast('请先在主表格中勾选需要处理的数据','wn');return;}
  const selectedGis = S.selection;
  const relevantGroups = [];
  S.issueGroups.uidConflicts.forEach(group=>{
    if(group.items.some(it=>selectedGis.has(it.gi))) relevantGroups.push({type:'uid', group});
  });
  S.issueGroups.siteConflicts.forEach(group=>{
    if(group.items.some(it=>selectedGis.has(it.gi))) relevantGroups.push({type:'site', group});
  });
  S.issueGroups.duplicates.forEach(group=>{
    if(group.items.some(it=>selectedGis.has(it.gi))) relevantGroups.push({type:'dup', group});

  if(relevantGroups.length===0){toast('所选数据中没有可处理项','wn');return;}

      const keyFields = type==='uid' ? ['uid','url'] : ['uid','url'];
      for(const f of allFields){
        if(keyFields.includes(f)) continue;
        const vals = new Set(group.items.map(it=>it.item[f]));
        if(vals.size > 1){ showFieldSelector = true; break; }
      }
    }

    html+=`<div class="preview-tbl-wrap"><table><thead><tr>`;
    html+=`<th style="width:40px">处理</th>`;
    html+=`<th style="width:80px">分区</th>`; 
    allFields.forEach(f=>{html+=`<th data-field="${esc(f)}">${esc(f)}</th>`;});
    html+=`</tr>`;

    if(showFieldSelector){
      html+=`<tr class="field-selector-row">`;
      html+=`<td></td><td></td>`; 
      allFields.forEach(f=>{
        const keyFields = type==='uid' ? ['uid','url'] : (type==='site' ? ['uid','url'] : ['uid']);
        if(keyFields.includes(f)){
          html+=`<td><span style="color:var(--t3)">自动</span></td>`;
        } else {
          const values = [...new Set(group.items.map(it=>it.item[f]))];
          const defaultVal = group.items[0].item[f];
          html+=`<td><select class="field-select" data-field="${esc(f)}">`;
          values.forEach(v=>{
            const selected = (v === defaultVal) ? 'selected' : '';
            html+=`<option value="${esc(String(v))}" ${selected}>${esc(trunc(String(v),30))}</option>`;
          });
          html+=`</select></td>`;
        }
      });
      html+=`</tr>`;
    }

    html+=`</thead><tbody>`;
    group.items.forEach((item, i)=>{
      const isKept = (type==='dup' && i===0) || (type==='uid' && i===0) || (type==='site' && i===0);
      html+=`<tr style="${isKept?'opacity:0.6;':''}">`;
      html+=`<td>${isKept?'<span style="color:var(--t3)">-</span>':`<input type="checkbox" class="process-check" data-gi="${item.gi}" checked>`}</td>`;
      html+=`<td style="font-size:11px">${esc(getPartNameByFi(item.fi))}</td>`;
      allFields.forEach(f=>{
        const val=item.item[f];
        html+=`<td title="${esc(String(val??''))}">${esc(trunc(String(val??''),40))}</td>`;
      });
      html+=`</tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });
  html+=`<div style="margin-top:12px;font-size:12px;color:var(--t3)">说明：首行的灰色条目为系统默认保留的，勾选复选框表示将删除该项，若不勾选将会保留并在下次扫描继续报警；字段选择仅适用于存在差异的冲突组。</div>`;
  showModal('自动处理预览',html,`<button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" id="confirmAutoProcess">✅ 确认执行</button>`);
  
  document.getElementById('confirmAutoProcess').onclick=()=>{
    const checkedGis = new Set(Array.from(document.querySelectorAll('.process-check:checked')).map(cb=>Number(cb.dataset.gi)));
    const fieldChoices = {};
    document.querySelectorAll('.field-select').forEach(sel=>{
      fieldChoices[sel.dataset.field] = sel.value;
    });
    executeAutoProcess(groups, checkedGis, fieldChoices);
    closeModal();
    S.selection.clear();
    updateBatchBar();
  };
}

function executeAutoProcess(groups, checkedGis, fieldChoices = {}){
  const snapshot = JSON.parse(JSON.stringify(S.files));
  let totalUidUnify = 0, totalUidReassign = 0, totalDupDelete = 0, totalFieldUpdate = 0;
  const uidField = detectField(S.files.flatMap(f => f.data), UID_FIELDS)?.field;

  groups.forEach(({type, group}) => {
    if (type === 'dup') {
      const kept = group.items[0];
      const toDelete = group.items.filter(it => !it.isKept && checkedGis.has(it.gi));
      if (Object.keys(fieldChoices).length > 0) {
        Object.entries(fieldChoices).forEach(([field, value]) => {
          if (field !== uidField) {
            const fi = kept.fi, ii = kept.ii;
            if (S.files[fi] && S.files[fi].data[ii]) S.files[fi].data[ii][field] = value;
          }
        });
        totalFieldUpdate++;
      }
      const deleteSet = new Set(toDelete.map(it => it.gi));
      S.files.forEach(f => { f.data = f.data.filter((_, ii) => !deleteSet.has(getGI(f, ii))); });
      totalDupDelete += toDelete.length;
    } else {
      const keyFields = type === 'uid' ? [uidField, 'url'] : [uidField, 'url'];
      const updateFields = Object.keys(fieldChoices).filter(f => !keyFields.includes(f));

      group.items.forEach(item => {
        const fi = item.fi, ii = item.ii;
        if (!S.files[fi] || !S.files[fi].data[ii]) return;
        updateFields.forEach(field => {
          S.files[fi].data[ii][field] = fieldChoices[field];
        });
        totalFieldUpdate++;
      });

      if (type === 'site') {
        let minUidNum = Infinity;
        let minUidStr = '';
        group.items.forEach(it => {
          const num = parseInt(it.item[uidField]) || 0;
          if (num > 0 && num < minUidNum) {
            minUidNum = num;
            minUidStr = String(it.item[uidField]).trim();
          }
        });
        const toChange = group.items.filter(it => !it.isKept && checkedGis.has(it.gi));
        toChange.forEach(it => {
          const fi = it.fi, ii = it.ii;
          if (S.files[fi] && S.files[fi].data[ii]) {
            S.files[fi].data[ii][uidField] = minUidStr;
          }
        });
        totalUidUnify += toChange.length;
      } else if (type === 'uid') {
        const toReassign = group.items.filter(it => !it.isKept && checkedGis.has(it.gi));
        if (toReassign.length > 0) {
          const usedUids = new Set();
          S.files.forEach(f => f.data.forEach(item => {
            if (item[uidField] !== undefined) usedUids.add(String(item[uidField]).trim());
          }));
          let newUidNum = 1;
          toReassign.forEach(it => {
            while (usedUids.has(String(newUidNum).padStart(4, '0'))) {
              newUidNum++;
            }
            const newUidStr = String(newUidNum).padStart(4, '0');
            const fi = it.fi, ii = it.ii;
            if (S.files[fi] && S.files[fi].data[ii]) {
              S.files[fi].data[ii][uidField] = newUidStr;
            }
            usedUids.add(newUidStr);
            newUidNum++;
          });
          totalUidReassign += toReassign.length;
        }
      }
    }
  });

  rebuildOffsets();
  detectConflicts();
  refreshUI();
  saveState();
  const desc = `自动处理: 字段更新${totalFieldUpdate}条, UID统一${totalUidUnify}条, UID重分配${totalUidReassign}条, 删除重复${totalDupDelete}条`;
  addHistory(desc, snapshot);
  toast(`✅ ${esc(desc)}`, 'ok', 5000, () => undoLast(snapshot));
}

function addHistory(desc,snapshot){
  const entry={id:Date.now(),ts:new Date().toISOString(),desc,snapshot};
  S.history.unshift(entry);
  while(S.history.length>50){
    const removed=S.history.pop();
    if(removed) dbDeleteHistory(removed.id);
  }
  dbAddHistory(entry);
}
function undoLast(snapshotOverride){
  const snap=snapshotOverride||(S.history[0]&&S.history[0].snapshot);
  if(!snap){toast('没有可撤销的操作','wn');return;}
  S.files=JSON.parse(JSON.stringify(snap));
  if(!snapshotOverride&&S.history.length){const removed=S.history.shift();dbDeleteHistory(removed.id);}
  rebuildOffsets();detectConflicts();refreshUI();saveState();
  toast('已撤销','ok');
}
function showHistoryPanel(){
  let html='';
  if(!S.history.length) html='<div style="text-align:center;color:var(--t3);padding:40px">暂无操作历史</div>';
  else S.history.forEach(h=>{
    html+=`<div class="preview-item"><div class="pi-hd"><span style="font-size:12px;color:var(--t3)">${new Date(h.ts).toLocaleString()}</span><button class="btn btn-o btn-sm" onclick="undoFromHistory('${h.id}')" title="撤销此步操作">↩️ 撤销</button></div><div style="font-size:13px">${esc(h.desc)}</div></div>`;
  });
  showModal('操作历史',html,'<button class="btn btn-o" onclick="closeModal()">关闭</button>');
}
async function undoFromHistory(id){
  const entry=S.history.find(h=>h.id==id);if(!entry)return;
  undoLast(entry.snapshot);
  const idx=S.history.findIndex(h=>h.id==id);
  const toRemove=S.history.splice(0,idx+1);
  for(const r of toRemove) await dbDeleteHistory(r.id);
  closeModal();showHistoryPanel();
}

function toggleSelect(gi){if(S.selection.has(gi))S.selection.delete(gi);else S.selection.add(gi);updateBatchBar();renderTable();}
function toggleSelectAll(){const rows=getFD();const allSelected=rows.every(r=>S.selection.has(r.gi));if(allSelected)rows.forEach(r=>S.selection.delete(r.gi));else rows.forEach(r=>S.selection.add(r.gi));updateBatchBar();renderTable();}
function clearSelection(){S.selection.clear();updateBatchBar();renderTable();}
function updateBatchBar(){const bar=document.getElementById('batchBar');const cnt=document.getElementById('batchCount');if(S.selection.size>0){bar.style.display='flex';cnt.textContent=S.selection.size;}else{bar.style.display='none';}}
function batchDelete(){
  if(!S.selection.size)return;
  const snapshot=JSON.parse(JSON.stringify(S.files));const count=S.selection.size;
  S.files.forEach(f=>{f.data=f.data.filter((_,ii)=>!S.selection.has(getGI(f,ii)));});
  S.selection.clear();rebuildOffsets();detectConflicts();refreshUI();saveState();updateBatchBar();
  const desc=`批量删除 ${count} 条数据`;
  addHistory(desc,snapshot);

function renderFileBar(){
  const el=document.getElementById('fileStatusBar');
  if(!S.files.length){el.innerHTML='';return;}
  el.innerHTML=S.files.map((f,i)=>{
    const pn=(S.partitions.find(p=>p.id===f.partitionId)||{}).name||'未分类';
    const hidden = S.hiddenPartitions.has(f.partitionId);
    const hc=f.data.some((_,j)=>{const g=getGI(f,j);return S.conflicts.uid.has(g)||S.conflicts.site.has(g)||S.duplicates.has(g)||S.validationErrors.has(g);});
    return `<div class="ftag ${hc?'conflict':''} ${hidden?'hidden':''}">📄 ${esc(f.name)} → ${esc(pn)} (${f.data.length})<span class="fdel" data-rmfile="${i}" title="移除文件">✕</span></div>`;
  }).join('');

function detectAllFields(){const fs=new Set();getFF().forEach(f=>f.data.forEach(item=>Object.keys(item).forEach(k=>fs.add(k))));S.allFields=Array.from(fs);}
function getFF(){
  if(!S.activePartition||S.activePartition==='all'){
    return S.files.filter(f=>!S.hiddenPartitions.has(f.partitionId));
  }
  const p=S.partitions.find(p=>p.name===S.activePartition);
  if(!p) return [];
  if(S.hiddenPartitions.has(p.id)) return [];
  return S.files.filter(f=>f.partitionId===p.id);
}
function getFD(){
  const ff=getFF();let rows=[];
  ff.forEach(f=>{const fi=S.files.indexOf(f);f.data.forEach((item,ii)=>{rows.push({item,fi,ii,gi:getGI(f,ii),fn:f.name});});});
  if(S.query){const q=S.query.toLowerCase();rows=rows.filter(r=>Object.values(r.item).some(v=>String(v).toLowerCase().includes(q)));}
  const onlyErr=document.getElementById('showConflictsOnly')?.checked;
  if(onlyErr){
    rows=rows.filter(r=>S.conflicts.uid.has(r.gi)||S.conflicts.site.has(r.gi)||S.duplicates.has(r.gi)||S.validationErrors.has(r.gi));
  }
  if(S.sortField){rows.sort((a,b)=>{const va=a.item[S.sortField]??'',vb=b.item[S.sortField]??'';const c=typeof va==='number'&&typeof vb==='number'?va-vb:String(va).localeCompare(String(vb),'zh');return S.sortDir==='asc'?c:-c;});}
  return rows;
}
function renderTable(){
  const ct=document.getElementById('tableContainer');const all=getFD();
  if(!all.length){ct.innerHTML=S.files.length===0?'<div class="empty"><div class="ei">📋</div><div>暂无数据，请加载数据文件</div></div>':'<div class="no-res">🔍 没有匹配的数据</div>';document.getElementById('pagination').style.display='none';document.getElementById('conflictLegend').style.display='none';return;}
  const hc=all.some(r=>S.conflicts.uid.has(r.gi)||S.conflicts.site.has(r.gi)||S.duplicates.has(r.gi)||S.validationErrors.has(r.gi));
  document.getElementById('conflictLegend').style.display=hc?'flex':'none';
  const tp=Math.ceil(all.length/S.pageSize);if(S.page>tp)S.page=tp;if(S.page<1)S.page=1;const si=(S.page-1)*S.pageSize,pr=all.slice(si,si+S.pageSize);
  const uf=detectField(all.map(r=>r.item),UID_FIELDS);const sf=detectField(all.map(r=>r.item),URL_FIELDS);const nf=detectField(all.map(r=>r.item),NAME_FIELDS);
  const cols=[...new Set([nf?nf.field:null,uf?uf.field:null,sf?sf.field:null,...S.allFields].filter(Boolean))].slice(0,10);
  const allPageSelected=pr.length>0&&pr.every(r=>S.selection.has(r.gi));
  let h=`<table><thead><tr><th style="width:40px"><input type="checkbox" ${allPageSelected?'checked':''} onclick="toggleSelectAll()" title="全选/取消全选当前页"></th><th style="width:40px">#</th><th style="width:100px">来源</th>`;
  cols.forEach(c=>{const sc=S.sortField===c?(S.sortDir==='asc'?'sa':'sd'):'';h+=`<th class="${sc}" data-sort="${esc(c)}">${esc(c)}</th>`;});

function matchFileToPartition(filename){const base=filename.replace(/\.[^.]+$/,'').toLowerCase().trim();if(FILE_PARTITION_MAP[base])return{matched:true,partition:FILE_PARTITION_MAP[base],rule:`精确匹配: "${base}" → "${FILE_PARTITION_MAP[base]}"`};const norm=base.replace(/[-_\s]+/g,'');for(const[k,p]of Object.entries(FILE_PARTITION_MAP)){if(k.replace(/[-_\s]+/g,'')===norm)return{matched:true,partition:p,rule:`模糊匹配: "${base}"→"${norm}" ≈ "${k}" → "${p}"`};}return{matched:false,partition:null,rule:`未匹配: "${base}" 无对应映射`};}
async function handleFileSelect(e){const fs=Array.from(e.target.files);e.target.value='';if(fs.length)await processFiles(fs);}
async function processFiles(fileList){
  for(const file of fileList){
    try{
      const text=await readText(file);let data;
      try{data=JSON.parse(text);}catch(pe){toast(`❌ ${esc(file.name)} 不是有效JSON`,'error');continue;}
      let items;
      if(Array.isArray(data)){items=data;}
      else if(typeof data==='object'){const ak=Object.keys(data).find(k=>Array.isArray(data[k])&&data[k].length>0);items=ak?data[ak]:[data];}
      else{toast(`❌ ${esc(file.name)} 不支持的类型`,'error');continue;}
      if(!items.length){toast(`⚠️ ${esc(file.name)} 数据为空`,'warn');continue;}
      const normName=file.name.replace(/\.[^.]+$/,'').trim();
      const existIdx=S.files.findIndex(f=>f.name===normName);
      const mr=matchFileToPartition(file.name);
      if(existIdx>=0){
        const ef=S.files[existIdx];const ep=S.partitions.find(p=>p.id===ef.partitionId);const partName=ep?ep.name:mr.partition;
        const action=await showConfirm(`文件"${esc(normName)}"已存在`,'选择操作：',[{text:'🔄 替换',value:'replace'},{text:'➕ 合并',value:'merge'},{text:'取消',value:'cancel'}]);
        if(action==='cancel')continue;
        if(action==='replace'){ef.data=items;ef.lastModified=Date.now();toast(`✅ ${esc(normName)} 已替换`,'ok');}
        else{ef.data=[...ef.data,...items];ef.lastModified=Date.now();toast(`✅ ${esc(normName)} 已合并`,'ok');}
      }else{
        let partName=mr.partition;
        if(!partName){partName=await showNewPartModal(normName);if(!partName)continue;}
        let part=S.partitions.find(p=>p.name===partName);
        if(!part){part={name:partName,id:gid()};S.partitions.push(part);}
        S.files.push({name:normName,partitionId:part.id,data:items,lastModified:Date.now()});
        toast(`✅ ${esc(normName)} → ${esc(partName)}`,'ok');
      }
    }catch(e){toast(`❌ ${esc(file.name)}: ${esc(e.message)}`,'error');}
  }
  rebuildOffsets();await saveState();detectConflicts();refreshUI();
}

function showAddPartitionModal(){showModal('新建分区',`<div class="fg"><label>分区名称</label><input type="text" id="newPartName" placeholder="输入分区名称" style="width:100%"></div>`,`<button class="btn btn-o" id="ap_cancel">取消</button><button class="btn btn-p" id="ap_ok">创建</button>`);document.getElementById('ap_cancel').addEventListener('click',closeModal);document.getElementById('ap_ok').addEventListener('click',()=>{const n=document.getElementById('newPartName').value.trim();if(!n){toast('请输入名称','wn');return;}if(S.partitions.find(p=>p.name===n)){toast('已存在','wn');return;}S.partitions.push({name:n,id:gid()});saveState();refreshUI();closeModal();toast(`"${esc(n)}"已创建`,'ok');});setTimeout(()=>document.getElementById('newPartName')?.focus(),100);}
function toggleSidebar(){const sb=document.getElementById('sidebar');const cl=document.getElementById('sidebarClose');sb.classList.toggle('open');cl.style.display=sb.classList.contains('open')?'block':'none';}

function initDD(){const dz=document.getElementById('dropZone');['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();ev.stopPropagation();dz.classList.add('drag-over');}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();ev.stopPropagation();dz.classList.remove('drag-over');}));dz.addEventListener('drop',e=>{const fs=Array.from(e.dataTransfer.files).filter(f=>f.name.endsWith('.json'));fs.length?processFiles(fs):toast('请拖入JSON','wn');});document.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});document.addEventListener('dragleave',e=>{if(!e.relatedTarget||!document.contains(e.relatedTarget))dz.classList.remove('drag-over');});document.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');});}

function initEvents(){
  document.getElementById('partitionList').addEventListener('click',e=>{
    const eyeBtn=e.target.closest('.eye-btn');
    if(eyeBtn){e.stopPropagation();const pid=eyeBtn.dataset.eye;togglePartitionHidden(pid);return;}
    const d=e.target.closest('[data-delpart]');if(d){e.stopPropagation();delPart(d.dataset.delpart);return;}
    const i=e.target.closest('.p-item');if(i)selPart(i.dataset.part);
  });
  document.getElementById('fileStatusBar').addEventListener('click',e=>{const d=e.target.closest('[data-rmfile]');if(d)rmFile(parseInt(d.dataset.rmfile));});
  document.getElementById('tableContainer').addEventListener('click',e=>{const th=e.target.closest('[data-sort]');if(th){toggleSort(th.dataset.sort);return;}const eb=e.target.closest('[data-edit]');if(eb){const[fi,ii]=eb.dataset.edit.split(',').map(Number);openEd(fi,ii);return;}const db=e.target.closest('[data-del]');if(db){const[fi,ii]=db.dataset.del.split(',').map(Number);delItem(fi,ii);return;}});
  document.getElementById('pagination').addEventListener('click',e=>{const b=e.target.closest('[data-pg]');if(b&&!b.disabled)goPg(parseInt(b.dataset.pg));});
  document.getElementById('searchInput').addEventListener('input',debounce(()=>{S.query=document.getElementById('searchInput').value.trim();S.page=1;renderTable();},200));
  document.getElementById('showConflictsOnly').addEventListener('change',()=>{S.page=1;renderTable();});
  document.getElementById('fileInput').addEventListener('change',handleFileSelect);
  document.getElementById('bundleInput').addEventListener('change',handleBundleImport);
  document.getElementById('editorBackdrop').addEventListener('click',closeEditor);
  document.getElementById('editorClose').addEventListener('click',closeEditor);
  document.getElementById('editorCancel').addEventListener('click',closeEditor);
  document.getElementById('editorSave').addEventListener('click',saveEditor);
  document.getElementById('modalClose').addEventListener('click',closeModal);
  document.getElementById('dropZone').addEventListener('click',()=>document.getElementById('fileInput').click());
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();document.getElementById('searchInput').focus();}if(e.key==='Escape'){closeEditor();closeModal();}});
}

async function init(){
  try{
    await openDB();await loadState();rebuildOffsets();detectConflicts();refreshUI();initDD();initEvents();
    toast('✅ 就绪','ok',2000);
  }catch(e){console.error(e);toast('初始化失败:'+e.message,'er');}
}
init();
</script>
</body>
</html>
