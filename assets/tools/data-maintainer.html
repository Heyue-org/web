const CROSS_REL_MAX = 2;
function crossRelSet(item){
  const s=new Set();
  relUrls(String(item['related']||'')).forEach(l=>{
    const d=normUrl(l).toLowerCase();
    if(d&&!isPlatformDomain(d))s.add(d);
  });
  return s;
}
function crossMainDomain(item, sf){
  const d=sf?normUrl(String(item[sf]||'').trim()).toLowerCase():'';
  return (d&&!isPlatformDomain(d))?d:'';
}
function showCrossPartitionDupes(){
  const mm=document.getElementById('moreMenu');if(mm)mm.classList.remove('open');
  const rows=[];
  S.files.forEach((f,fi)=>f.data.forEach((item,ii)=>rows.push({gi:getGI(f,ii),fi,ii,item,pid:f.partitionId,part:getPartNameByFi(fi)})));
  if(rows.length<2){toast('当前数据不足两条','wn');return;}
  const uf=detectField(rows.map(r=>r.item),UID_FIELDS)?.field;
  const sf=detectField(rows.map(r=>r.item),URL_FIELDS)?.field;
  const nf=detectField(rows.map(r=>r.item),NAME_FIELDS)?.field;
  if(!nf&&!sf){toast('既没有名称字段也没有 URL 字段，无法比对','wn');return;}

  const relSets=rows.map(r=>crossRelSet(r.item));
  const relCnt=new Map();
  relSets.forEach(s=>s.forEach(d=>relCnt.set(d,(relCnt.get(d)||0)+1)));
  const doms=rows.map(r=>crossMainDomain(r.item,sf));

  const scan=(th)=>{
    const out=[];
    for(let i=0;i<rows.length;i++){
      for(let j=i+1;j<rows.length;j++){
        if(rows[i].pid===rows[j].pid)continue;
        /* v2.2：只保留 UID 相同的；UID 不同的已归「站点冲突」，别两处都列 */
        if(uf&&String(a[uf]==null?'':a[uf]).trim()!==String(b[uf]==null?'':b[uf]).trim())continue;
        const a=rows[i].item,b=rows[j].item;
        let sim=0;
        if(nf){
          const na=String(a[nf]||'').trim(), nb=String(b[nf]||'').trim();
          if(na&&nb)sim=stringSimilarity(na,nb);
        }
        const sameDom=(doms[i]&&doms[i]===doms[j])?doms[i]:'';
        let rel='';
        if(!sameDom){
          for(const d of relSets[i]){ if(relSets[j].has(d)&&relCnt.get(d)<=CROSS_REL_MAX){rel=d;break;} }
        }
        if(sim<th&&!sameDom&&!rel)continue;
        out.push({x:rows[i],y:rows[j],sim,sameDom,rel});
      }
    }
    out.sort((p,q)=>{
      if(!!p.sameDom!==!!q.sameDom)return p.sameDom?-1:1;
      return q.sim-p.sim;
    });
    return out;
  };

  let logged=false;
  const render=(th)=>{
    const pairs=scan(th);
    const uidOf=r=>uf?String(r.item[uf]??'').trim():'';
    const sameUidCnt=uf?pairs.filter(p=>{const a=uidOf(p.x),b=uidOf(p.y);return a&&a===b;}).length:0;
    const cell=r=>`<div style="min-width:0;flex:1">
        <div style="font-size:11px;color:var(--t3)">${esc(r.part)}${uf?` · <b style="color:var(--hl-uid)">${esc(uidOf(r)||'—')}</b>`:''}</div>
        <div style="font-size:13px">${esc(trunc(String(nf?r.item[nf]??'':''),28))}</div>
        <div style="font-size:11px;color:var(--t2)">${esc(trunc(String(sf?r.item[sf]??'':''),40))}</div>
      </div>`;
    const rowHtml=p=>{
      const ua=uidOf(p.x),ub=uidOf(p.y),same=uf&&ua&&ua===ub;
      const why=p.sameDom?`同域名 <code>${esc(p.sameDom)}</code>`
        :(p.rel?`共有罕见关联域名 <code>${esc(p.rel)}</code>`
        :`名称相似度 ${(p.sim*100).toFixed(0)}%`);
      return `<div style="border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-bottom:8px">
        <div style="display:flex;gap:10px;align-items:center">${cell(p.x)}<span style="color:var(--t3)">⇄</span>${cell(p.y)}</div>
        <div style="margin-top:6px;font-size:11px;color:var(--t3)">${why} · ${same?'<span style="color:var(--ok)">已共用同一 UID（跨分区同号，正常）</span>':'<span style="color:var(--wn)">UID 不一致 —— 需要合并</span>'}</div>
      </div>`;
    };
    const body=`<div style="font-size:13px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <span>名称相似度阈值</span>
        <select id="crossTh" style="padding:4px 8px">${[0.6,0.7,0.8,0.9].map(v=>`<option value="${v}" ${v===th?'selected':''}>${(v*100).toFixed(0)}%</option>`).join('')}</select>
        <span style="flex:1"></span>
        <span>共 <b style="color:var(--ac)">${pairs.length}</b> 对${uf?`，其中 <b style="color:var(--wn)">${pairs.length-sameUidCnt}</b> 对 UID 不一致`:''}</span>
      </div>
      <div style="color:var(--t3);font-size:12px;margin-bottom:10px">判定：不同分区 +（名称相似度达阈值 / 主域名相同 / 共有罕见关联域名）。同名不同站（各种 Galgame 站）在 70% 附近会有误报，调到 90% 可只看几乎同名的。</div>
      <div style="max-height:50vh;overflow:auto">${pairs.length?pairs.map(rowHtml).join(''):'<div style="color:var(--t3)">这个阈值下没有命中。</div>'}</div>
    </div>`;
    showModal('🧩 跨分区同实体',body,'<button class="btn btn-p" onclick="closeModal()">关闭</button>');
    const sel=document.getElementById('crossTh');
    if(sel)sel.onchange=()=>render(parseFloat(sel.value));
    if(!logged){
      logged=true;
      log(`🧩 跨分区同实体扫描（阈值 ${(th*100).toFixed(0)}%）: ${pairs.length} 对${uf?`，${pairs.length-sameUidCnt} 对 UID 不一致`:''}`,pairs.length?'warn':'ok',
        pairs.map(p=>`${p.x.part}/${nf?String(p.x.item[nf]??''):''}${uf?`(${uidOf(p.x)})`:''}  ⇄  ${p.y.part}/${nf?String(p.y.item[nf]??''):''}${uf?`(${uidOf(p.y)})`:''}  ← ${p.sameDom?'同域名 '+p.sameDom:(p.rel?'关联 '+p.rel:'相似度 '+(p.sim*100).toFixed(0)+'%')}`).join('\n'));
    }
  };
  toast(`正在比对 ${rows.length} 条…`,'ok',1200);
  setTimeout(()=>render(0.7),40);
}

async function autoLoadDataJson(){
  if(S.files.length)return;
  try{
    const res=await fetch('../nav-pages/data.json');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('格式不对');
    log('📥 自动加载 assets/nav-pages/data.json','info');
    const keys=Object.keys(data).filter(k=>Array.isArray(data[k]));
    for(const k of keys){
      const partName=keyToPart(k)||k;
      let part=S.partitions.find(p=>p.name===partName);
      if(!part){part={name:partName,id:gid()};S.partitions.push(part);}
      S.files.push({name:k,partitionId:part.id,data:data[k],lastModified:Date.now()});
    }
    log(`已载入 ${keys.length} 个分类 / ${keys.reduce((s,k)=>s+data[k].length,0)} 条`,'ok');
  }catch(e){
    log(`未能自动加载 data.json（${e.message}）。可直接把 data.json 拖进窗口，或用「导入数据」按钮`,'warn');
  }
}
