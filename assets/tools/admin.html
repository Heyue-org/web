<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="../../assets/css/images/biglogo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评分管理后台</title>
    <meta name="robots" content="noindex">
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --primary: #2563eb; --primary-soft: #eff6ff;
            --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
            --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px;
        }
        .wrap { max-width: 1700px; margin: 0 auto; }

        .statusbar { background: #f1f5f9; border: 1px solid var(--border); color: var(--muted); padding: 9px 16px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px; }
        .statusbar.ok { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
        .statusbar.err { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

        .topbar { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .brand { font-size: 18px; font-weight: 700; }
        .brand span { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
        .grow { flex: 1; min-width: 220px; }

        .btn-on { background: var(--primary-soft); border: 1px solid #bfdbfe; color: #1e40af; }

        input[type=text], input[type=password], select {
            padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 13px; outline: none; background: #fff; color: var(--text); font-family: inherit;
        }
        input:focus, select:focus { border-color: var(--primary); }

        button {
            padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 13px; background: var(--primary); color: #fff;
            transition: opacity .2s; font-family: inherit;
        }
        button:hover { opacity: .88; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-danger-sm { background: var(--danger); padding: 5px 12px; font-size: 12px; white-space: nowrap; }
        .btn-mini { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 3px 8px; font-size: 11px; font-weight: 500; }

        .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
        .tab { background: transparent; color: var(--muted); border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 18px; font-size: 14px; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab:hover { opacity: 1; background: transparent; color: var(--text); }
        .tab.active:hover { color: var(--primary); }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
        .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .toolbar .spacer { flex: 1; }
        .search-input { min-width: 230px; }
        .search-wrap { position: relative; display: inline-flex; align-items: center; }
        .clear-x {
            position: absolute; right: 6px; width: 20px; height: 20px; padding: 0;
            border-radius: 50%; background: #e2e8f0; color: #64748b;
            font-size: 13px; line-height: 1; font-weight: 700; display: none;
        }
        .clear-x:hover { background: #cbd5e1; opacity: 1; }
        .um-meta { margin-bottom: 16px; font-size: 12.5px; display: flex; gap: 22px; flex-wrap: wrap; }
        .um-meta b { color: var(--text); font-weight: 600; }
        .um-meta span { color: var(--muted); margin-right: 5px; }

        .batchbar { background: var(--primary-soft); border: 1px solid #bfdbfe; color: #1e40af; border-radius: 8px; padding: 8px 14px; margin-bottom: 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .batchbar .spacer { flex: 1; }
        .batchbar button.btn-outline { background: #fff; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 16px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--primary); line-height: 1.2; }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .stat-card.danger .stat-value { color: var(--danger); }
        .stat-card.ok .stat-value { color: var(--success); }

        .table-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 11px 14px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); white-space: nowrap; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: var(--primary); }
        th .arrow { font-size: 10px; margin-left: 3px; }
        td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tbody tr.row { cursor: pointer; }
        tbody tr.row:hover { background: #f8fafc; }
        tbody tr.lv-high { background: rgba(239,68,68,.09); }
        tbody tr.lv-high:hover { background: rgba(239,68,68,.15); }
        tbody tr.lv-medium { background: rgba(245,158,11,.10); }
        tbody tr.lv-medium:hover { background: rgba(245,158,11,.16); }
        tr.sel { background: var(--primary-soft) !important; }
        tr.wl td { opacity: .55; }
        td.wrap { white-space: normal; word-break: break-all; }
        .empty { text-align: center; padding: 40px; color: #94a3b8; }
        .cell-sub { display: block; color: #94a3b8; font-size: 11px; margin-top: 2px; }
        code.fp { font-size: 11px; background: #f1f5f9; padding: 2px 5px; border-radius: 3px; }
        .linkish { color: var(--primary); text-decoration: none; border-bottom: 1px dotted var(--primary); cursor: pointer; }
        .linkish:hover { background: var(--primary-soft); }
        .rawkey { color: var(--muted); }

        .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 4px; }
        .tag-cloud { background: #fee2e2; color: #991b1b; }
        .tag-score { background: #dbeafe; color: #1e40af; }
        .tag-valid { background: #d1fae5; color: #065f46; }
        .tag-invalid { background: #fef3c7; color: #92400e; }
        .tag-rerate { background: #fef3c7; color: #92400e; }
        .tag-cluster { background: #ede9fe; color: #5b21b6; }
        .tag-wl { background: #d1fae5; color: #065f46; }

        .risk-badge { display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; }
        .risk-high { background: var(--danger); }
        .risk-medium { background: var(--warning); }
        .risk-low { background: #94a3b8; }

        .pager { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
        .pager button { padding: 6px 14px; font-size: 12px; }
        .pager select { padding: 6px 8px; font-size: 12px; }
        .foot { font-size: 12px; color: var(--muted); margin-top: 12px; }
        .hidden { display: none; }

        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        @media (max-width: 1000px) { .charts { grid-template-columns: 1fr; } }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
        .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
        .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
        .bar-row .lb { width: 42px; color: var(--muted); }
        .bar-row .bar { height: 14px; background: var(--primary); border-radius: 3px; min-width: 2px; }
        .bar-row .vv { color: var(--muted); }

        .user-detail { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 16px; }
        @media (max-width: 1100px) { .user-detail { grid-template-columns: 1fr; } }
        .ud-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
        .ud-box h4 { font-size: 13px; margin-bottom: 10px; }
        .ud-line { font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
        .ud-line:last-child { border-bottom: none; }
        .gap-fast { color: var(--danger); font-weight: 700; }

        .modal { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 200; padding: 24px; }
        .modal.show { display: flex; }
        .modal-box { background: var(--card); border-radius: 14px; max-width: 860px; width: 100%; max-height: 88vh; overflow: auto; }
        .modal-hd { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); }
        .modal-hd h3 { font-size: 15px; flex: 1; }
        .modal-bd { padding: 18px 20px 24px; }
        .close { background: transparent; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 6px; }
        .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; font-size: 13px; }
        .kv dt { color: var(--muted); }
        .kv dd { word-break: break-all; }
        .sec-title { font-size: 13px; font-weight: 700; margin: 18px 0 10px; padding-left: 8px; border-left: 3px solid var(--primary); }
        .rule { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; padding: 7px 0; border-bottom: 1px dashed var(--border); flex-wrap: wrap; }
        .rule .hit { font-weight: 700; min-width: 48px; }
        .rule .hit.y { color: var(--danger); }
        .rule .hit.n { color: var(--muted); }
        .rule .pt { color: var(--muted); min-width: 28px; }
        .rule .desc { color: var(--muted); }
        .sum-line { font-size: 13px; margin-top: 10px; }

        #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px); background: #1e293b; color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 300; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
<div class="wrap">

    <div class="statusbar" id="statusBar">未连接：填好 Worker 地址与管理员密钥后点「连接」</div>

    <div class="topbar"></div>

    <div class="topbar">
        <div class="brand">评分管理后台<span>日志 / 风控 / 用户数据</span></div>
        <input type="text" id="workerUrl" class="grow" value="https://heyue-rating-worker.heyue-rating-api.workers.dev" placeholder="Worker 地址">
        <input type="password" id="adminKey" style="max-width:190px;" value="demo-key-0000" placeholder="管理员密钥">
        <button id="connectBtn">连接</button>
        <button class="btn-outline" id="autoBtn" onclick="toggleAuto()">自动刷新：关</button>
        <button class="btn-outline" onclick="openAudit()">操作记录</button>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="logs">日志</button>
        <button class="tab" data-tab="risk">风控</button>
        <button class="tab" data-tab="users">用户数据</button>
    </div>

    <section id="tab-logs">
        <div class="panel">
            <div class="toolbar">
                <span class="search-wrap">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索 IP / ISP / 指纹 / 站名 / 语言" oninput="toggleClear('searchInput','clearLogs')">
                    <button class="clear-x" id="clearLogs" onclick="clearSearch('searchInput','logs')" title="清除">×</button>
                </span>
                <select id="scoreFilter"><option value="">全部评分</option><option value="5">5 星</option><option value="4">4 星</option><option value="3">3 星</option><option value="2">2 星</option><option value="1">1 星</option></select>
                <select id="fpFilter"><option value="">全部指纹</option><option value="valid">有效指纹</option><option value="invalid">无效指纹</option></select>
                <span class="spacer"></span>
                <button class="btn-outline" onclick="exportCSV()">导出 CSV</button>
                <button class="btn-outline" onclick="exportArchive()">导出归档</button>
                <button class="btn-outline" onclick="reloadLogs()">刷新</button>
            </div>
        </div>
        <div class="batchbar hidden" id="batchBar">
            <span id="batchInfo">已选 0 条</span>
            <span class="spacer"></span>
            <button class="btn-outline" onclick="batchWhitelist()">加入白名单</button>
            <button class="btn-outline" onclick="clearSel()">取消选择</button>
            <button style="background:var(--danger);" onclick="batchDelete()">批量删除</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="sTotal">0</div><div class="stat-label">日志总数</div></div>
            <div class="stat-card ok"><div class="stat-value" id="sValid">0</div><div class="stat-label">指纹有效</div></div>
            <div class="stat-card danger"><div class="stat-value" id="sCloud">0</div><div class="stat-label">云服务商 IP</div></div>
            <div class="stat-card"><div class="stat-value" id="sAvg">0</div><div class="stat-label">平均评分</div></div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr>
                    <th style="width:34px;"><input type="checkbox" id="chkAllLogs" onchange="toggleAll(this,'logs')"></th>
                    <th class="sortable" data-sort="timestamp" data-tb="logs">时间<span class="arrow"></span></th>
                    <th>IP / ISP</th>
                    <th>语言</th>
                    <th>设备指纹</th>
                    <th>评分对象</th>
                    <th class="sortable" data-sort="ratingScore" data-tb="logs">评分<span class="arrow"></span></th>
                    <th style="text-align:right;width:96px;">操作</th>
                </tr></thead>
                <tbody id="logTable"></tbody>
            </table>
        </div>
        <div class="pager" id="pagerLogs"></div>
        <div class="foot" id="logFoot"></div>
    </section>

    <section id="tab-risk" class="hidden">
        <div class="panel">
            <div class="toolbar">
                <select id="timeRange"><option value="24">最近 24 小时</option><option value="72">最近 3 天</option><option value="168">最近 7 天</option><option value="all" selected>全部数据</option></select>
                <select id="riskSort" onchange="changeRiskSort()">
                    <option value="level">排序：风险 高→低</option>
                    <option value="timestamp">排序：时间 新→旧</option>
                    <option value="ratingScore">排序：评分 低→高</option>
                </select>
                <button id="analyzeBtn" onclick="runAnalysis()">开始分析</button>
                <span class="spacer"></span>
                <span style="font-size:12px;color:var(--muted);" id="riskScope"></span>
            </div>
        </div>
        <div class="charts" id="charts">
            <div class="chart-box"><div class="chart-title">评分分布</div><div id="chartBars"></div></div>
            <div class="chart-box"><div class="chart-title">每日评分量趋势</div><div id="chartTrend"></div></div>
        </div>
        <div class="batchbar hidden" id="batchBarRisk">
            <span id="batchInfoRisk">已选 0 条</span>
            <span class="spacer"></span>
            <button class="btn-outline" onclick="batchWhitelist()">加入白名单</button>
            <button class="btn-outline" onclick="clearSel()">取消选择</button>
            <button style="background:var(--danger);" onclick="batchDelete()">批量删除</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="rTotal">-</div><div class="stat-label">分析样本量</div></div>
            <div class="stat-card danger"><div class="stat-value" id="rHigh">-</div><div class="stat-label">高风险记录</div></div>
            <div class="stat-card"><div class="stat-value" id="rCloud">-</div><div class="stat-label">云服务商 IP</div></div>
            <div class="stat-card"><div class="stat-value" id="rRerate">-</div><div class="stat-label">频繁重评</div></div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr>
                    <th style="width:34px;"><input type="checkbox" id="chkAllRisk" onchange="toggleAll(this,'risk')"></th>
                    <th class="sortable" data-sort="timestamp" data-tb="risk">时间<span class="arrow"></span></th>
                    <th>IP / ISP</th>
                    <th>评分对象</th>
                    <th class="sortable" data-sort="ratingScore" data-tb="risk">评分<span class="arrow"></span></th>
                    <th>命中风险标签</th>
                    <th style="text-align:right;width:96px;">操作</th>
                </tr></thead>
                <tbody id="riskTable"></tbody>
            </table>
        </div>
        <div class="pager" id="pagerRisk"></div>
        <div class="foot" id="riskFoot"></div>
    </section>

    <section id="tab-users" class="hidden">
        <div class="panel">
            <div class="toolbar">
                <span class="search-wrap">
                    <input type="text" class="search-input" id="userSearch" placeholder="搜索 指纹 / IP / ISP / 站名" oninput="toggleClear('userSearch','clearUsers')">
                    <button class="clear-x" id="clearUsers" onclick="clearSearch('userSearch','users')" title="清除">×</button>
                </span>
                <span class="spacer"></span>
                <span style="font-size:12px;color:var(--muted);" id="userCount"></span>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr>
                    <th>指纹 Hash</th>
                    <th>IP 数</th>
                    <th class="sortable" data-sort="count" data-tb="users">评分次数<span class="arrow"></span></th>
                    <th>涉及站点</th>
                    <th>平均分</th>
                    <th class="sortable" data-sort="level" data-tb="users">风险<span class="arrow"></span></th>
                    <th class="sortable" data-sort="last" data-tb="users">末次时间<span class="arrow"></span></th>
                    <th style="text-align:right;width:90px;">操作</th>
                </tr></thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
        <div class="pager" id="pagerUsers"></div>

    </section>

</div>

<div class="modal" id="detailModal">
    <div class="modal-box">
        <div class="modal-hd">
            <h3 id="dmTitle">记录详情</h3>
            <button class="close" onclick="closeModal('detailModal')">×</button>
        </div>
        <div class="modal-bd" id="dmBody"></div>
    </div>
</div>

<div class="modal" id="auditModal">
    <div class="modal-box" style="max-width:620px;">
        <div class="modal-hd">
            <h3>操作记录</h3>
            <button class="close" onclick="closeModal('auditModal')">×</button>
        </div>
        <div class="modal-bd" id="auditBody"></div>
    </div>
</div>

<div class="modal" id="userModal">
    <div class="modal-box" style="max-width:980px;">
        <div class="modal-hd">
            <h3 id="umTitle">用户详情</h3>
            <button class="close" onclick="closeModal('userModal')">×</button>
        </div>
        <div class="modal-bd">
            <div class="ud-box um-meta" id="umMeta"></div>
            <div class="user-detail" style="margin-top:0;">
                <div class="ud-box">
                    <h4>历史评分（时间轴）</h4>
                    <div id="umTimeline"></div>
                </div>
                <div>
                    <div class="ud-box" style="margin-bottom:16px;">
                        <h4>关联 IP</h4>
                        <div id="umIps"></div>
                    </div>
                    <div class="ud-box">
                        <h4>关联指纹</h4>
                        <div id="umFps"></div>
                    </div>
                    <div class="ud-box" style="margin-top:16px;">
                        <h4>相似指纹（同设备特征）</h4>
                        <div id="umSimilar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
var CLOUD_RE = /amazon|aws|digitalocean|vultr|linode|alibaba|aliyun|tencent|huawei|oracle|google cloud|azure|microsoft/i;
var UID_MAP = {};
var SITE_ROOT = '../../';
var token = sessionStorage.getItem('admin_token') || '';
var connected = false;
var WORKER_URL = localStorage.getItem('admin_worker_url') || 'https://heyue-rating-worker.heyue-rating-api.workers.dev';

function setStatus(msg, kind){
    var el = document.getElementById('statusBar');
    el.textContent = msg;
    el.className = 'statusbar' + (kind ? ' ' + kind : '');
}

async function request(path, opts, timeoutMs, retries){
    var lastErr = null;
    for (var i = 0; i <= retries; i++) {
        var controller = new AbortController();
        var timer = setTimeout(function(){ controller.abort(); }, timeoutMs);
        try {
            var res = await fetch(WORKER_URL + path, Object.assign({}, opts, { signal: controller.signal }));
            clearTimeout(timer);
            return res;
        } catch (err) {
            clearTimeout(timer);
            lastErr = err;
            if (i < retries) await new Promise(function(r){ setTimeout(r, 800); });
        }
    }
    throw lastErr;
}

function netErrText(err, timeoutMs){
    if (err && err.name === 'AbortError') return '请求超时：' + (timeoutMs / 1000) + ' 秒没回应（已重试 1 次），跨境链路慢或被干扰时常见';
    return '连不上 Worker：' + esc((err && err.message) || '未知错误') + '，检查地址是否正确、网络是否可达';
}

async function loadUidMap(){
    try {
        var res = await fetch(SITE_ROOT + 'assets/nav-pages/data.json', { cache: 'no-store' });
        if (!res.ok) return;
        var d = await res.json();
        var m = {};
        Object.keys(d).forEach(function(cat){
            (d[cat] || []).forEach(function(x){
                var u = String(x.uid || '').trim();

function wlHas(rec){ return WL.ips.indexOf(rec.ip)>=0 || WL.fps.indexOf(rec.fpHash)>=0; }

function analyzeRisks(records){
    var fpCount={}, ipKeys={};
    records.forEach(function(r){
        fpCount[r.fpHash||'unknown'] = (fpCount[r.fpHash||'unknown']||0)+1;
        if(!ipKeys[r.ip]) ipKeys[r.ip]={};
        ipKeys[r.ip][r.ratingKey||'']=1;
    });
    return records.map(function(r){
        var tags=[], score=0, detail=[];
        var isCloud=CLOUD_RE.test(r.isp||'');
        var keyCount=Object.keys(ipKeys[r.ip]||{}).length;
        var singleValid = keyCount===1 && r.fingerprintValid;

        var c1 = isCloud && !singleValid;
        if(c1){ tags.push('cloud'); score+=2; }
        detail.push({name:'云服务商 IP', hit:c1, pt:2, desc: isCloud ? ('ISP 命中云厂商关键词，且不是「单站点+有效指纹」') : 'ISP 未命中云厂商关键词'});

        var c2 = !!(r.isRerate && fpCount[r.fpHash]>=3);
        if(c2){ tags.push('rerate'); score+=3; }
        detail.push({name:'频繁重评', hit:c2, pt:3, desc:'该指纹在本批出现 '+fpCount[r.fpHash]+' 次，需 ≥3 且本条是重评'});

        var c3 = !r.fingerprintValid;
        if(c3){ tags.push('invalid'); score+=2; }
        detail.push({name:'指纹无效', hit:c3, pt:2, desc: c3 ? 'fingerprintValid = false' : '指纹有效'});

        var c4 = keyCount>=3;
        if(c4){ tags.push('cluster'); score+=4; }
        detail.push({name:'聚集攻击', hit:c4, pt:4, desc:'该 IP 共评了 '+keyCount+' 个不同对象，需 ≥3'});

        var level = score>=5?'high':score>=3?'medium':'low';
        var wl = wlHas(r);
        if(wl){ level='low'; tags=[]; }
        return Object.assign({}, r, {tags:tags, score:score, level:level, rules:detail, keyCount:keyCount, fpTotal:fpCount[r.fpHash]||0, wl:wl});
    });
}

function sortArr(arr, st){

        if(typeof va==='string') return va.localeCompare(vb)*st.d;

    });

var TAG_LABELS={cloud:['云服务商','tag-cloud'],rerate:['频繁重评','tag-rerate'],invalid:['指纹无效','tag-invalid'],cluster:['聚集攻击','tag-cluster']};

function runAnalysis(silent){
    var btn=document.getElementById('analyzeBtn');
    if(!silent){ btn.disabled=true; btn.textContent='分析中…'; }
    var range=document.getElementById('timeRange').value;
    var all=LOGS.concat(ARCHIVE);
    var scope=all;
    if(range!=='all'){
        var latest=all.reduce(function(m,r){ var t=new Date(r.timestamp).getTime(); return t>m?t:m; },0);
        var cutoff=latest-parseInt(range,10)*3600*1000;
        scope=all.filter(function(r){ return new Date(r.timestamp).getTime()>=cutoff; });
    }
    riskRows=analyzeRisks(scope);
    sortArr(riskRows, sortState.risk);
    page.risk=1;

    var high=riskRows.filter(function(r){return r.level==='high';}).length;
    var med=riskRows.filter(function(r){return r.level==='medium';}).length;
    var low=riskRows.filter(function(r){return r.level==='low';}).length;
    document.getElementById('rTotal').textContent=scope.length;
    document.getElementById('rHigh').textContent=high;
    document.getElementById('rCloud').textContent=riskRows.filter(function(r){return r.tags.indexOf('cloud')>=0;}).length;
    document.getElementById('rRerate').textContent=riskRows.filter(function(r){return r.tags.indexOf('rerate')>=0;}).length;
    document.getElementById('riskScope').textContent='范围：'+scope.length+' 条（日志 '+LOGS.length+' + 归档 '+ARCHIVE.length+'）';
    document.getElementById('riskFoot').textContent='高风险 '+high+' 条 · 中风险 '+med+' 条 · 低风险 '+low+' 条｜条目底色：红=高风险，橙=中风险，无色=低风险｜白名单：'+WL.ips.length+' IP / '+WL.fps.length+' 指纹';

    renderCharts(scope);
    renderRisk();
    if(!silent){ btn.disabled=false; btn.textContent='开始分析'; toast('分析完成'); }
}

function renderRisk(){
    var tbody=document.getElementById('riskTable');
    var total=riskRows.length, maxP=Math.max(1,Math.ceil(total/size.risk));
    if(page.risk>maxP) page.risk=maxP;
    var slice=riskRows.slice((page.risk-1)*size.risk, page.risk*size.risk);
    if(!slice.length){ tbody.innerHTML='<tr><td colspan="7" class="empty">该时间范围内没有数据</td></tr>'; }
    else {
        tbody.innerHTML=slice.map(function(r){
            var lv=r.level==='high'?' lv-high':r.level==='medium'?' lv-medium':'';
            var tags=r.tags.map(function(t){ var m=TAG_LABELS[t]||[t,'tag-invalid']; return '<span class="tag '+m[1]+'">'+m[0]+'</span>'; }).join('')
                +(r.wl?'<span class="tag tag-wl">已加白</span>':'');

function renderCharts(scope){
    document.getElementById('charts').classList.remove('hidden');
    var dist=[0,0,0,0,0];
    scope.forEach(function(r){ if(r.ratingScore>=1&&r.ratingScore<=5) dist[r.ratingScore-1]++; });
    var max=Math.max.apply(null,dist)||1;
    document.getElementById('chartBars').innerHTML=[5,4,3,2,1].map(function(s){
        var i=s-1, w=Math.round(dist[i]/max*100);
        return '<div class="bar-row"><span class="lb">'+s+' 星</span><span class="bar" style="width:'+w+'%"></span><span class="vv">'+dist[i]+'</span></div>';
    }).join('');

    var byDay={};
    scope.forEach(function(r){ var d=new Date(r.timestamp); var k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); byDay[k]=(byDay[k]||0)+1; });
    var keys=Object.keys(byDay).sort();
    var vals=keys.map(function(k){return byDay[k];});
    var mx=Math.max.apply(null,vals)||1;
    var W=520,H=140,pad=10;
    var pts=vals.map(function(v,i){
        var x=pad+i*((W-2*pad)/Math.max(1,vals.length-1));
        var y=H-pad-(v/mx)*(H-2*pad-14);
        return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    document.getElementById('chartTrend').innerHTML=
      '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;"><polyline points="'+pts+'" fill="none" stroke="#2563eb" stroke-width="2"/>'+
      '<text x="'+pad+'" y="11" font-size="10" fill="#64748b">'+keys[0]+'</text>'+
      '<text x="'+(W-72)+'" y="11" font-size="10" fill="#64748b">'+keys[keys.length-1]+'</text>'+
      '<text x="'+pad+'" y="'+(H-2)+'" font-size="10" fill="#64748b">峰值 '+mx+' 条/天 · 共 '+keys.length+' 天</text></svg>';
}

function buildUsers(){
    var map={};
    var analyzed=analyzeRisks(LOGS.concat(ARCHIVE));
    var levelBy={};
    analyzed.forEach(function(a){ var k=a.fpHash||('ip:'+a.ip); var ord={low:0,medium:1,high:2};
        if(!levelBy[k]||ord[a.level]>ord[levelBy[k]]) levelBy[k]=a.level; });

    LOGS.concat(ARCHIVE).forEach(function(r){
        var k=r.fpHash||('ip:'+r.ip);
        if(!map[k]) map[k]={fp:r.fpHash, ips:{}, count:0, sites:{}, scores:[], last:0, recs:[], dev:r.fingerprint, level:'low'};
        var u=map[k];
        u.count++;
        u.ips[r.ip]=(u.ips[r.ip]||0)+1;
        u.sites[r.ratingKey]=1;
        u.scores.push(r.ratingScore||0);
        var t=new Date(r.timestamp).getTime();
        if(t>u.last) u.last=t;
        u.recs.push(r);
        u.level = levelBy[k] || 'low';
    });
    userRows=Object.keys(map).map(function(k){ var u=map[k];
        u.ipList=Object.keys(u.ips);
        u.siteList=Object.keys(u.sites);
        u.avg=u.scores.length?(u.scores.reduce(function(a,b){return a+b;},0)/u.scores.length):0;
        return u; });
    sortArr(userRows, sortState.users);
    filterUsers();
}
function filterUsers(){
    var kw=document.getElementById('userSearch').value.trim().toLowerCase();

        if(!kw) return true;

        return [u.fp, u.ipList.join(' '), names].join(' ').toLowerCase().indexOf(kw)>=0;
    });
    page.users=1;

function descT(a,b){ return new Date(b.timestamp)-new Date(a.timestamp); }

function buildEntity(ip, fp){
    if(fp) return userRows.filter(function(x){ return x.fp===fp; })[0] || null;
    var recs=LOGS.concat(ARCHIVE).filter(function(r){ return r.ip===ip; }).sort(descT);
    if(!recs.length) return null;
    var fps={}, sites={}, scores=[];
    recs.forEach(function(r){ fps[r.fpHash]=(fps[r.fpHash]||0)+1; sites[r.ratingKey]=1; scores.push(r.ratingScore||0); });
    var an=analyzeRisks(recs), lv='low', ord={low:0,medium:1,high:2};
    an.forEach(function(a){ if(ord[a.level]>ord[lv]) lv=a.level; });
    var ips={}; ips[ip]=recs.length;
    return { fp:null, ip:ip, isIp:true, isp:recs[0].isp, ips:ips, ipList:[ip], recs:recs,
        dev:recs[0].fingerprint, level:lv, count:recs.length, siteList:Object.keys(sites), scores:scores,
        avg:scores.length?scores.reduce(function(a,b){return a+b;},0)/scores.length:0,
        fpList:Object.keys(fps), fpCounts:fps };
}
