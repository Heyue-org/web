<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - 合月亭</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --accent-gold: #fbbf24;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(251, 191, 36, 0.25);
        }
        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --text-main: #1e293b;
            --card-bg: rgba(0, 0, 0, 0.04);
            --card-border: rgba(251, 191, 36, 0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }
        h1 {
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }
        .subtitle {
            opacity: 0.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }

        /* ===== 公告卡片 ===== */
        .notice-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
            line-height: 1.8;
            font-size: 0.92rem;
        }
        .notice-card .badge {
            display: inline-block;
            background: var(--accent-gold);
            color: #0f172a;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 999px;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }
        .notice-card p {
            margin-bottom: 0.6rem;
            opacity: 0.85;
        }
        .notice-card ul {
            list-style: none;
            padding-left: 0;
        }
        .notice-card li {
            position: relative;
            padding-left: 1.4rem;
            margin-bottom: 0.35rem;
            opacity: 0.8;
        }
        .notice-card li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.55em;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-gold);
        }
        .notice-card a {
            color: var(--accent-gold);
            text-decoration: none;
        }
        .notice-card a:hover { text-decoration: underline; }

        .giscus-wrapper {
            width: 100%;
            min-height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回导航首页</a>
        <h1>💬 留言板</h1>
        <p class="subtitle">登录 GitHub 账号即可评论 · 由 Giscus 驱动</p>

        <!-- 公告卡片 -->
        <div class="notice-card">
            <p>评论系统目前处于试运行状态，欢迎在以下场景使用本页面：</p>
            <ul>
                <li>网址失效、标签错误或投诉某网站</li>
                <li>联系我们 / DMCA </li>
                <li>对本站功能或内容有任何建议</li>
                <li>交换友链</li>
            </ul>
            <p>如果无法加载评论请科学上网</p>
        </div>

        <div class="giscus-wrapper">
            <script src="https://giscus.app/client.js"
                    data-repo="Heyue-org/web"
                    data-repo-id="R_kgDOTuIKhg"
                    data-category="Giscus"
                    data-category-id="DIC_kwDOTuIKhs4DDb5z"
                    data-mapping="pathname"
                    data-strict="0"
                    data-reactions-enabled="1"
                    data-emit-metadata="0"
                    data-input-position="top"
                    data-theme="preferred_color_scheme"
                    data-lang="zh-CN"
                    crossorigin="anonymous"
                    async>
            </script>
        </div>
    </div>

    <!-- 主题同步脚本 -->
    <script>
        (function() {
            var THEME_KEY = 'heyue_nav_theme';
            var saved = localStorage.getItem(THEME_KEY);
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
            window.addEventListener('storage', function(e) {
                if (e.key === THEME_KEY && e.newValue) {
                    document.documentElement.setAttribute('data-theme', e.newValue);
                    var iframe = document.querySelector('iframe.giscus-frame');
                    if (iframe) {
                        iframe.contentWindow.postMessage({
                            giscus: { setConfig: { theme: e.newValue === 'dark' ? 'dark_dimmed' : 'light' } }
                        }, 'https://giscus.app');
                    }
                }
            });
        })();
    </script>
</body>
</html>
