        body.light-mode .hero h1 {
            background: linear-gradient(to right, #1e293b, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.light-mode .hero-slogan { color: #d97706; }
        body.light-mode .btn { border-color: #d97706; color: #d97706; background: var(--bg-card); }
        body.light-mode .btn:hover { background: rgba(30,41,59,0.9); box-shadow: 0 0 15px rgba(217,119,6,0.3); }
        body.light-mode .btn-alt { background: var(--bg-card); border-color: #d97706; color: #d97706; }
        body.light-mode .btn-alt:hover { background: rgba(30,41,59,0.9); border-color: #d97706; color: #d97706; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        body.light-mode .section-title { color: #1e293b; }
        body.light-mode .projects-wrapper { background: rgba(255,255,255,0.55); border-color: rgba(0,0,0,0.06); }
        body.light-mode .project-card { background: rgba(255,255,255,0.8); border-color: rgba(0,0,0,0.08); }
        body.light-mode .future-annotations { color: #64748b; }

        body.light-mode footer { border-color: rgba(0,0,0,0.08); color: #334155; }
        body.light-mode .project-main-title { color: #1e293b; }
        body.light-mode .doc-link-box { border-color: #d97706; color: #d97706; background: rgba(217,119,6,0.08); }
        body.light-mode .doc-link-box:hover { background: rgba(217,119,6,0.18); box-shadow: 0 0 12px rgba(217,119,6,0.25); }
        .btn-download {

            gap: 0.6rem;

            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;

        .btn-download:hover {

            box-shadow: 0 0 16px rgba(251,191,36,0.3);
            transform: translateY(-2px);
        }
        body.light-mode .btn-download {
            border-color: #d97706;
            color: #d97706;
            background: rgba(217,119,6,0.08);
        }
        body.light-mode .btn-download:hover {

        }
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(251,191,36,0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;

            z-index: 100;

            backdrop-filter: blur(8px);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;

            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);

            align-items: center;

        .nav-right { display: flex; align-items: center; gap: 0; }
        .nav-link {
            color: var(--text-sub);

            font-weight: 500;
            transition: color 0.3s ease;

            padding: 0 1.2rem;

        .nav-link:hover { color: var(--accent-gold); }
        .nav-v-line {
            width: 1px;
            height: 18px;

            opacity: 0.3;
            flex-shrink: 0;
        }
        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: var(--text-main);
            transition: transform 0.3s ease, color 0.3s ease;
            cursor: pointer;
            background: none;
            border: none;
            margin-left: 1.2rem;

        .icon-btn:hover { color: var(--accent-gold); transform: scale(1.1); }
        .icon-btn svg { width: 26px; height: 26px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 60px;
        }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;

        }
        .hero-slogan {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
        }
        .hero-slogan::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold);

        .hero-actions { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1rem; }
        .btn {
            padding: 0.8rem 2rem;

            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 1rem;

            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            background: var(--bg-card);

        .btn-alt { background: var(--bg-card); border-color: var(--accent-gold); color: var(--accent-gold); }

        .projects-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        .project-card {

        .image-modal {

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(2px);
        }
        .image-modal.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content { position: relative; max-width: 70vw; max-height: 70vh; animation: zoomIn 0.4s ease; }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-image { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
        .modal-close {
            position: absolute;
            top: -50px;
            right: -10px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .modal-close:hover { background: rgba(255,255,255,0.3); transform: scale(1.1) rotate(90deg); }

        /* ===== 移动端适配 ===== */
        @media (max-width: 768px) {
            .logo-text { display: none; }
            .logo { gap: 0; }

            .hero-slogan { font-size: 1.2rem; }
            .hero-actions { flex-direction: column; width: 100%; padding: 0 2rem; }
            .btn { width: 100%; text-align: center; }

            /* 核心修改：让外框贴近屏幕边缘，内框紧凑 */
            .container { padding: 0 0.5rem; }
            .projects-section { padding: 2rem 0 3rem; }
            .projects-wrapper {

                border-radius: 12px;

            .section-title {
                font-size: 1.4rem;
                margin-bottom: 1.2rem;

            .projects-grid { gap: 1rem; }
            .project-card {
                padding: 1rem 0.8rem;
                border-radius: 10px;
            }
            .project-header { margin-bottom: 0.8rem; }
            .project-main-title { font-size: 1.15rem; }

            /* 图片保持横排两列，缩小间距和高度 */
            .images-grid {
                grid-template-columns: repeat(2,1fr);
                gap: 0.6rem;
                margin-bottom: 1rem;
            }
            .future-image { height: 120px; }

            .future-annotations {
                font-size: 0.9rem;
                line-height: 1.6;
            }
            .future-annotations p { margin-bottom: 0.3rem; }

            .doc-links-row {
                flex-direction: column;
                gap: 0.5rem;
                margin-top: 0.6rem;
            }
            .doc-link-box {
                text-align: center;
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }
            .btn-download {
                padding: 0.55rem 1rem;
                font-size: 0.85rem;
                justify-content: center;
            }

            .icon-btn { width: 32px; height: 32px; }
            .icon-btn svg { width: 22px; height: 22px; }
            .nav-v-line { display: none; }
            .nav-link { font-size: 0.9rem; padding: 0 0.8rem; }
            .icon-btn { margin-left: 0.8rem; }
            .modal-content { max-width: 90vw; max-height: 60vh; }
            .text-links { margin-top: 1.5rem; }
        }
    </style>
</head>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const icons = {
            img: document.getElementById('icon-img'),
            moon: document.getElementById('icon-moon'),
            sun: document.getElementById('icon-sun')
        };
        let mode = 0;
        function showIcon(name) {
            Object.values(icons).forEach(i => i.style.display = 'none');
            icons[name].style.display = 'block';
        }
        function applyMode() {
            body.classList.remove('light-mode', 'dark-mode');
            if (mode === 1) body.classList.add('dark-mode');
            if (mode === 2) body.classList.add('light-mode');
            showIcon(mode === 0 ? 'img' : mode === 1 ? 'moon' : 'sun');
        }
        toggleBtn.addEventListener('click', () => { mode = (mode + 1) % 3; applyMode(); });
        applyMode();
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const modalClose = document.getElementById('modalClose');
        document.querySelectorAll('.image-container').forEach(container => {
            container.addEventListener('click', function() {
                modalImg.src = this.getAttribute('data-image');
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });
        modalClose.addEventListener('click', () => { modal.classList.remove('active'); document.body.style.overflow = 'auto'; });
