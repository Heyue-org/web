<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点公告 - 合月亭</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: 50%;
            transform: translateX(-50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(251,191,36,0.1) 0%, rgba(15,23,42,0) 70%);
            z-index: -1; pointer-events: none;
        }
        .top-bar {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            position: sticky; top: 0; z-index: 100;
        }
        .top-bar-inner {
            max-width: 800px; margin: 0 auto;
            display: flex; align-items: center;
        }
        .top-bar-inner .logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text-main);
            font-size: 2.4rem; font-weight: 700;
            letter-spacing: 2px; white-space: nowrap;
        }
        .top-bar-inner .logo img {
            width: 36px; height: 36px; border-radius: 50%;
            object-fit: cover; border: 1px solid var(--accent-gold);
        }
        .top-bar-inner .v-line {
            width: 3px; height: 36px; background: #fff;
            margin: 0 1.5rem; opacity: 0.9;
            flex-shrink: 0; border-radius: 2px;
        }
        .top-bar-inner .page-title {
            font-size: 2.6rem; font-weight: 600;
            color: var(--accent-gold); letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(251,191,36,0.3);
        }
        .divider {
            max-width: 800px; margin: 0 auto; height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            opacity: 0.4;
        }
        .content {
            max-width: 800px; margin: 0 auto;
            padding: 2.5rem 2rem 4rem;
            display: flex; flex-direction: column; gap: 1.5rem;
        }
        .notice-card {
            display: block;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2rem 2.5rem;
            color: var(--text-main);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            position: relative; cursor: pointer; user-select: none;
        }
        .notice-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            border-color: rgba(251,191,36,0.4);
        }
        .notice-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 0.8rem;
        }
        .tag {
            font-size: 0.75rem; padding: 2px 10px;
            border-radius: 4px; font-weight: 600; letter-spacing: 1px;
        }
        .tag.new {
            background: rgba(251,191,36,0.2); color: var(--accent-gold);
            border: 1px solid rgba(251,191,36,0.4);
        }
        .tag.normal {
            background: rgba(148,163,184,0.15); color: var(--text-sub);
            border: 1px solid rgba(148,163,184,0.3);
        }
        .date {
            font-size: 0.85rem; color: var(--text-sub);
            font-family: 'Courier New', monospace;
        }
        .notice-title {
            font-size: 1.3rem; font-weight: 600;
            margin-bottom: 0.6rem;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .notice-title::before {
            content: ''; display: inline-block;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-gold);
            box-shadow: 0 0 8px var(--accent-gold); flex-shrink: 0;
        }
        .notice-summary {
            font-size: 0.95rem; color: var(--text-sub);
            line-height: 1.7; padding-left: 1.4rem;
        }
        .arrow {
            position: absolute; right: 2rem; top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem; color: var(--accent-gold);
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
        }
        .notice-card:hover .arrow {
            opacity: 1; transform: translateY(-50%) translateX(4px);
        }
        .lightbox-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0);
            backdrop-filter: blur(0px);
            z-index: 1000;
            visibility: hidden;
            transition: background 0.35s ease, backdrop-filter 0.35s ease, visibility 0s 0.35s;
        }
        .lightbox-overlay.active {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            visibility: visible;
            transition: background 0.35s ease, backdrop-filter 0.35s ease, visibility 0s 0s;
        }
        .lightbox-panel {
            position: fixed;
            top: 50%; left: 50%;
            width: min(90vw, 800px);
            max-height: 90vh;
            background: #1e293b;
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 18px;
            z-index: 1001;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%) scale(0.85);
            opacity: 0;
            visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.22,1,0.36,1),
                        opacity 0.35s ease,
                        visibility 0s 0.4s;
        }
        .lightbox-panel.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
            transition: transform 0.4s cubic-bezier(0.22,1,0.36,1),
                        opacity 0.35s ease,
                        visibility 0s 0s;
        }
        .lightbox-close {
            position: sticky; top: 1rem; float: right;
            margin: 1rem 1rem 0 0;
            width: 36px; height: 36px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: rgba(15,23,42,0.9);
            color: var(--text-sub); font-size: 1.2rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; z-index: 10;
        }
        .lightbox-close:hover, .lightbox-close:focus-visible {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            transform: rotate(90deg);
            outline: none;
        }
        .lightbox-body {
            padding: 1rem 3.5rem 3.5rem;
        }
        .lb-tag { margin-bottom: 1rem; display: inline-block; }
        .lb-title {
            font-size: 1.8rem; font-weight: 700;
            color: var(--text-main); margin-bottom: 0.5rem;
            line-height: 1.4;
            display: flex; align-items: center; gap: 0.8rem;
        }
        .lb-title::before {
            content: ''; display: inline-block;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold); flex-shrink: 0;
        }
        .lb-date {
            font-size: 0.9rem; color: var(--text-sub);
            font-family: 'Courier New', monospace;
            margin-bottom: 2rem; padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .lb-content {
            font-size: 1.05rem; line-height: 2;
            color: #cbd5e1; white-space: pre-wrap;
        }
        @media (max-width: 600px) {
            .top-bar { padding: 1rem 1.2rem; }
            .top-bar-inner .logo { font-size: 2rem; }
            .top-bar-inner .logo img { width: 30px; height: 30px; }
            .top-bar-inner .v-line { height: 28px; margin: 0 1rem; width: 2px; }
            .top-bar-inner .page-title { font-size: 2.2rem; }
            .content { padding: 2rem 1.2rem 3rem; }
            .notice-card { padding: 1.5rem 1.8rem; }
            .notice-title { font-size: 1.1rem; }
            .notice-summary { font-size: 0.9rem; padding-left: 0; margin-top: 0.3rem; }
            .arrow { display: none; }
            .lightbox-panel { width: 100vw; max-height: 100vh; border-radius: 0; }
            .lightbox-body { padding: 1rem 1.5rem 3rem; }
            .lb-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="logo">
                <img src="assets/css/images/biglogo.png" alt="合月亭">
                合月亭
            </a>
            <div class="v-line"></div>
            <div class="page-title">站点公告</div>
        </div>
    </div>
    <div class="divider"></div>

    <div class="content" id="noticeList">
        <div class="notice-card" tabindex="0" role="button"
             data-tag="🔥 重要" data-tag-class="new" data-date="2026-08-10"
             data-title="绝赞呕吐代码中"
             data-full="由于这是一个新开的项目，很多功能和页面都是能用就端上来了，不过我们会尽快完善。&#10;如果你在使用过程中遇到任何Bug或有改进建议，欢迎前往讨论群755481594反馈，你的每一条意见都是我们优化的动力！">
            <span class="arrow">&rarr;</span>
            <div class="notice-header">
                <span class="tag new">🔥 重要</span>
                <span class="date">2026-08-10</span>
            </div>
            <div class="notice-title">绝赞呕吐代码中</div>
            <div class="notice-summary">由于这是一个新开的项目，很多功能和页面都是能用就端上来了，不过我们会尽快完善</div>
        </div>
    </div>

    <div class="lightbox-overlay" id="lbOverlay"></div>
    <div class="lightbox-panel" id="lbPanel" role="dialog" aria-modal="true" aria-label="公告详情">
        <button class="lightbox-close" id="lbClose" aria-label="关闭">✕</button>
        <div class="lightbox-body" id="lbBody"></div>
    </div>

    <script>
        (() => {
            const overlay  = document.getElementById('lbOverlay');
            const panel    = document.getElementById('lbPanel');
            const body     = document.getElementById('lbBody');
            const closeBtn = document.getElementById('lbClose');
            const list     = document.getElementById('noticeList');

            let isAnimating = false;
            let triggerCard = null;

            list.addEventListener('click', e => {
                const card = e.target.closest('.notice-card');
                if (!card || isAnimating) return;
                openLightbox(card);
            });

            list.addEventListener('keydown', e => {
                if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('notice-card')) {
                    e.preventDefault();
                    if (!isAnimating) openLightbox(e.target);
                }
            });

            function openLightbox(card) {
                isAnimating = true;
                triggerCard = card;

                const tagClass = card.dataset.tagClass || 'normal';
                body.innerHTML =
                    '<span class="tag lb-tag ' + tagClass + '">' + card.dataset.tag + '</span>' +
                    '<div class="lb-title">' + card.dataset.title + '</div>' +
                    '<div class="lb-date">' + card.dataset.date + '</div>' +
                    '<div class="lb-content">' + card.dataset.full + '</div>';

                overlay.classList.add('active');
                panel.classList.add('active');
                document.body.style.overflow = 'hidden';

                setTimeout(() => {
                    isAnimating = false;
                    closeBtn.focus();
                }, 400);
            }

            function closeLightbox() {
                if (isAnimating) return;
                isAnimating = true;

                panel.classList.remove('active');
                overlay.classList.remove('active');

                setTimeout(() => {
                    document.body.style.overflow = '';
                    body.innerHTML = '';
                    isAnimating = false;
                    if (triggerCard) {
                        triggerCard.focus();
                        triggerCard = null;
                    }
                }, 400);
            }

            closeBtn.addEventListener('click', closeLightbox);
            overlay.addEventListener('click', closeLightbox);
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && panel.classList.contains('active')) {
                    closeLightbox();
                }
            });
        })();
    </script>

    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5824bbe371ce4eefbe8027cb86c0d0a6"}'></script>
</body>
</html>
