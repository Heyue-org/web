<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告 - 合月亭</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
            --top-bar-bg: rgba(15, 23, 42, 0.6);
        }
        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent-gold: #d97706;
            --border-color: rgba(0, 0, 0, 0.08);
            --top-bar-bg: rgba(255, 255, 255, 0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: 50%;
            transform: translateX(-50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(251,191,36,0.1) 0%, rgba(15,23,42,0) 70%);
            z-index: -1; pointer-events: none;
        }
        [data-theme="light"] body::before {
            background: radial-gradient(circle, rgba(217,119,6,0.08) 0%, rgba(241,245,249,0) 70%);
        }
        .top-bar {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--top-bar-bg);
            backdrop-filter: blur(5px);
            position: sticky; top: 0; z-index: 100;
            transition: background 0.3s, border-color 0.3s;
        }
        .top-bar-inner {
            max-width: 800px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .top-bar-left {
            display: flex; align-items: center;
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text-main);
            font-size: 2.4rem; font-weight: 700;
            letter-spacing: 2px; white-space: nowrap;
        }
        .logo img {
            width: 36px; height: 36px; border-radius: 50%;
            object-fit: cover; border: 1px solid var(--accent-gold);
        }
        .v-line {
            width: 3px; height: 36px; background: var(--text-main);
            margin: 0 1.5rem; opacity: 0.9;
            flex-shrink: 0; border-radius: 2px;
        }
        .page-title {
            font-size: 2.6rem; font-weight: 600;
            color: var(--accent-gold); letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(251,191,36,0.3);
        }
        .theme-toggle {
            background: none; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer;
            font-size: 1.1rem; line-height: 1; color: var(--text-main);
            transition: all 0.3s;
        }
        .theme-toggle:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .divider {
            max-width: 800px; margin: 0 auto; height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            opacity: 0.4;
        }
        .content {
            max-width: 800px; margin: 0 auto;
            padding: 2.5rem 2rem 4rem;
            display: flex; flex-direction: column; gap: 1.5rem;
        }
        #noticeList {
            display: flex; flex-direction: column; gap: 1.5rem;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            position: relative;
        }
        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 20px;
            padding: 0.3rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .btn.active { border-color: var(--accent-gold); color: var(--accent-gold); }
        .filter-dropdown {
            position: absolute;
            top: 110%;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.8rem;
            display: none;
            flex-wrap: wrap;
            gap: 0.5rem;
            z-index: 10;
            max-width: 320px;
        }
        .filter-dropdown.show { display: flex; }
        .tag-option {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 20px;
            padding: 0.2rem 0.8rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tag-option:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .tag-option.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(251,191,36,0.1); }
        .notice-card {
            display: block;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1rem 1.5rem;
            color: var(--text-main);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s, background 0.3s;
            position: relative; cursor: pointer; user-select: none;
        }
        .notice-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            border-color: rgba(251,191,36,0.4);
        }
        [data-theme="light"] .notice-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .notice-card.expanded-mode {
            cursor: default;
            user-select: text;
        }
        .notice-card.expanded-mode:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--border-color);
        }
        .notice-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 0.2rem;
        }
        .tag {
            font-size: 0.75rem; padding: 2px 10px;
            border-radius: 4px; font-weight: 600; letter-spacing: 1px;
            background: rgba(251,191,36,0.2); color: var(--accent-gold);
            border: 1px solid rgba(251,191,36,0.4);
        }
        .date {
            font-size: 0.85rem; color: var(--text-sub);
            font-family: 'Courier New', monospace;
        }
        .notice-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            display: flex; align-items: center; gap: 0.6rem;
            line-height: 1.3;
        }
        .notice-title::before {
            content: ''; display: inline-block;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-gold);
            box-shadow: 0 0 8px var(--accent-gold); flex-shrink: 0;
        }
        .notice-summary {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.5;
            padding-left: 1.2rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .notice-full-content {
            display: none;
            margin-top: 0.5rem;
            padding: 0.5rem 0;
            border-top: 1px dashed var(--border-color);
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-wrap;
        }
        .notice-full-content.show { display: block; }
        .notice-full-content a {
            color: var(--accent-gold);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .arrow {
            position: absolute; right: 1.2rem; top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem; color: var(--accent-gold);
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        .notice-card:hover .arrow {
            opacity: 1; transform: translateY(-50%) translateX(4px);
        }
        .lightbox-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0);
            backdrop-filter: blur(0px);
            z-index: 1000;
            visibility: hidden;
            transition: background 0.35s ease, backdrop-filter 0.35s ease, visibility 0s 0.35s;
        }
        .lightbox-overlay.active {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            visibility: visible;
            transition: background 0.35s ease, backdrop-filter 0.35s ease, visibility 0s 0s;
        }
        .lightbox-panel {
            position: fixed;
            top: 50%; left: 50%;
            width: min(90vw, 800px);
            max-height: 90vh;
            background: #1e293b;
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 18px;
            z-index: 1001;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%) scale(0.85);
            opacity: 0;
            visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.22,1,0.36,1),
                        opacity 0.35s ease,
                        visibility 0s 0.4s;
        }
        .lightbox-panel.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
            transition: transform 0.4s cubic-bezier(0.22,1,0.36,1),
                        opacity 0.35s ease,
                        visibility 0s 0s;
        }
        .lightbox-close {
            position: sticky; top: 1rem; float: right;
            margin: 1rem 1rem 0 0;
            width: 36px; height: 36px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: rgba(15,23,42,0.9);
            color: var(--text-sub); font-size: 1.2rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; z-index: 10;
        }
        .lightbox-close:hover, .lightbox-close:focus-visible {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            transform: rotate(90deg);
            outline: none;
        }
        .lightbox-body {
            padding: 1rem 3.5rem 3.5rem;
        }
        .lb-tag { margin-bottom: 1rem; display: inline-block; }
        .lb-title {
            font-size: 1.8rem; font-weight: 700;
            color: var(--text-main); margin-bottom: 0.5rem;
            line-height: 1.4;
            display: flex; align-items: center; gap: 0.8rem;
        }
        .lb-title::before {
            content: ''; display: inline-block;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold); flex-shrink: 0;
        }
        .lb-date {
            font-size: 0.9rem; color: var(--text-sub);
            font-family: 'Courier New', monospace;
            margin-bottom: 2rem; padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .lb-content {
            font-size: 1.05rem; line-height: 2;
            color: #cbd5e1; white-space: pre-wrap;
        }
        .lb-content a {
            color: var(--accent-gold);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: opacity 0.2s;
        }
        .lb-content a:hover {
            opacity: 0.8;
        }
        @media (max-width: 600px) {
            .top-bar { padding: 1rem 1.2rem; }
            .logo { font-size: 2rem; }
            .logo img { width: 30px; height: 30px; }
            .v-line { height: 28px; margin: 0 1rem; width: 2px; }
            .page-title { font-size: 2.2rem; }
            .content { padding: 2rem 1.2rem 3rem; }
            #noticeList { gap: 1rem; }
            .notice-card { padding: 0.8rem 1rem; }
            .notice-title { font-size: 1rem; }
            .notice-summary { font-size: 0.85rem; padding-left: 0; margin-top: 0.3rem; }
            .arrow { display: none; }
            .lightbox-panel { width: 100vw; max-height: 100vh; border-radius: 0; }
            .lightbox-body { padding: 1rem 1.5rem 3rem; }
            .lb-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <div class="top-bar-left">
                <a href="index.html" class="logo">
                    <img src="assets/css/images/biglogo.png" alt="合月亭">
                    合月亭
                </a>
                <div class="v-line"></div>
                <div class="page-title">公告</div>
            </div>
            <button class="theme-toggle" id="themeToggle" title="切换日/夜模式">🌙</button>
        </div>
    </div>
    <div class="divider"></div>
    <div class="content">
        <div class="controls-row" id="controlsRow">
            <button class="btn" id="sortToggleBtn">时间: 最新在前</button>
            <button class="btn" id="filterBtn">筛选</button>
            <button class="btn" id="expandAllBtn" style="margin-left:auto;">全部展开</button>
            <div class="filter-dropdown" id="filterDropdown"></div>
        </div>
        <div id="noticeList"></div>
    </div>
    <div class="lightbox-overlay" id="lbOverlay"></div>
    <div class="lightbox-panel" id="lbPanel" role="dialog" aria-modal="true" aria-label="公告详情">
        <button class="lightbox-close" id="lbClose" aria-label="关闭">✕</button>
        <div class="lightbox-body" id="lbBody"></div>
    </div>
    <script>
        (() => {
            const overlay = document.getElementById('lbOverlay');
            const panel = document.getElementById('lbPanel');
            const body = document.getElementById('lbBody');
            const closeBtn = document.getElementById('lbClose');
            const list = document.getElementById('noticeList');
            const expandAllBtn = document.getElementById('expandAllBtn');
            const sortToggleBtn = document.getElementById('sortToggleBtn');
            const filterBtn = document.getElementById('filterBtn');
            const filterDropdown = document.getElementById('filterDropdown');
            const themeToggle = document.getElementById('themeToggle');

            let notices = [];
            let filteredNotices = [];
            let expandedAll = false;
            let sortDesc = true;
            let currentTag = '全部';
            let isAnimating = false;
            let triggerCard = null;

            const THEME_KEY = 'heyue_notice_theme';
            const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
            applyTheme(savedTheme);
            themeToggle.addEventListener('click', () => {
                applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            });
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
                localStorage.setItem(THEME_KEY, theme);
            }

            async function loadNotices() {
                try {
                    const res = await fetch('assets/news/notices.json', { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    notices = data;
                    buildTagFilter();
                    applyFiltersAndSort();
                    renderNotices();
                } catch (e) {
                    console.error('公告加载失败:', e);
                    list.innerHTML = '<div style="color:var(--danger);text-align:center;padding:2rem;">公告加载失败，请检查 JSON 文件</div>';
                }
            }

            function sortNotices(arr) {
                return arr.slice().sort((a, b) => {
                    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
                    if (sortDesc) return (b.date || '').localeCompare(a.date || '');
                    else return (a.date || '').localeCompare(b.date || '');
                });
            }

            function autoTitle(full) {
                if (!full) return '';
                const clean = full.replace(/\n+/g, ' ').trim();
                const firstBreak = clean.search(/[。！？!?]/);
                let title = firstBreak > 0 ? clean.slice(0, firstBreak + 1) : clean.slice(0, 50);
                return title.length > 50 ? title.slice(0, 50) + '…' : title;
            }

            function autoSummary(full, title) {
                if (!full) return '';
                let clean = full.replace(/\n+/g, ' ').trim();
                if (title && clean.startsWith(title)) clean = clean.slice(title.length).trim();
                clean = clean.replace(/^[，。！？、\s]+/, '');
                return clean.length > 80 ? clean.slice(0, 80) + '…' : clean;
            }

            function buildTagFilter() {
                const tags = new Set(notices.map(n => n.tag || '公告'));
                let html = '<button class="tag-option active" data-tag="全部">全部</button>';
                tags.forEach(tag => {
                    html += `<button class="tag-option" data-tag="${tag}">${tag}</button>`;
                });
                filterDropdown.innerHTML = html;
                filterDropdown.querySelectorAll('.tag-option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentTag = btn.dataset.tag;
                        filterDropdown.querySelectorAll('.tag-option').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        filterDropdown.classList.remove('show');
                        applyFiltersAndSort();
                        renderNotices();
                    });
                });
            }

            function applyFiltersAndSort() {
                let result = notices;
                if (currentTag !== '全部') {
                    result = result.filter(n => (n.tag || '公告') === currentTag);
                }
                filteredNotices = sortNotices(result);
            }

            function renderNotices() {
                if (filteredNotices.length === 0) {
                    list.innerHTML = '<div style="color:var(--text-sub);text-align:center;padding:2rem;">暂无公告</div>';
                    return;
                }
                list.innerHTML = filteredNotices.map((n, index) => {
                    const title = n.title && n.title.trim() ? n.title : autoTitle(n.full);
                    const summary = n.summary && n.summary.trim() ? n.summary : autoSummary(n.full, title);
                    const fullContent = n.full || '';
                    const pinnedAttr = n.pinned ? ' data-pinned="true"' : '';
                    return `
                    <div class="notice-card" tabindex="0" role="button" ${pinnedAttr}
                         data-index="${index}"
                         data-tag="${n.tag || '公告'}" data-date="${n.date || ''}"
                         data-title="${title}" data-full="${escapeHtml(fullContent)}">
                        <span class="arrow">&rarr;</span>
                        <div class="notice-header">
                            <span class="tag">${n.tag || '公告'}</span>
                            <span class="date">${n.date || ''}</span>
                        </div>
                        <div class="notice-title">${title}</div>
                        <div class="notice-summary">${summary}</div>
                        <div class="notice-full-content"></div>
                    </div>`;
                }).join('');
                attachCardEvents();
                updateExpandAllButton();
            }

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function attachCardEvents() {
                list.querySelectorAll('.notice-card').forEach(card => {
                    card.addEventListener('click', e => {
                        if (card.classList.contains('expanded-mode')) return;
                        if (e.target.closest('.notice-full-content')) return;
                        if (isAnimating) return;
                        openLightbox(card);
                    });
                    card.addEventListener('keydown', e => {
                        if ((e.key === 'Enter' || e.key === ' ') && !card.classList.contains('expanded-mode') && !e.target.closest('.notice-full-content')) {
                            e.preventDefault();
                            if (!isAnimating) openLightbox(card);
                        }
                    });
                });
            }

            function openLightbox(card) {
                isAnimating = true;
                triggerCard = card;
                const idx = card.dataset.index;
                const notice = filteredNotices[idx];
                if (!notice) return;
                const title = notice.title && notice.title.trim() ? notice.title : autoTitle(notice.full);
                const date = notice.date || '';
                const full = notice.full || '';
                body.innerHTML =
                    '<span class="tag lb-tag">' + (notice.tag || '公告') + '</span>' +
                    '<div class="lb-title">' + title + '</div>' +
                    '<div class="lb-date">' + date + '</div>' +
                    '<div class="lb-content">' + formatLinks(full) + '</div>';
                overlay.classList.add('active');
                panel.classList.add('active');
                document.body.style.overflow = 'hidden';
                setTimeout(() => {
                    isAnimating = false;
                    closeBtn.focus();
                }, 400);
            }

            function formatLinks(text) {
                const urlRegex = /(https?:\/\/[^\s<]+)/g;
                return text.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
            }

            function closeLightbox() {
                if (isAnimating) return;
                isAnimating = true;
                panel.classList.remove('active');
                overlay.classList.remove('active');
                setTimeout(() => {
                    document.body.style.overflow = '';
                    body.innerHTML = '';
                    isAnimating = false;
                    if (triggerCard) {
                        triggerCard.focus();
                        triggerCard = null;
                    }
                }, 400);
            }

            closeBtn.addEventListener('click', closeLightbox);
            overlay.addEventListener('click', closeLightbox);
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && panel.classList.contains('active')) closeLightbox();
            });

            function toggleExpandAll() {
                expandedAll = !expandedAll;
                expandAllBtn.textContent = expandedAll ? '全部收起' : '全部展开';
                list.querySelectorAll('.notice-card').forEach(card => {
                    card.classList.toggle('expanded-mode', expandedAll);
                    const fullDiv = card.querySelector('.notice-full-content');
                    const summaryDiv = card.querySelector('.notice-summary');
                    if (expandedAll) {
                        const idx = card.dataset.index;
                        const notice = filteredNotices[idx];
                        fullDiv.innerHTML = formatLinks(notice.full || '');
                        fullDiv.classList.add('show');
                        summaryDiv.style.display = 'none';
                    } else {
                        fullDiv.innerHTML = '';
                        fullDiv.classList.remove('show');
                        summaryDiv.style.display = '';
                    }
                });
            }
            expandAllBtn.addEventListener('click', toggleExpandAll);

            function updateExpandAllButton() {
                expandAllBtn.textContent = expandedAll ? '全部收起' : '全部展开';
            }

            sortToggleBtn.addEventListener('click', () => {
                sortDesc = !sortDesc;
                sortToggleBtn.textContent = sortDesc ? '时间: 最新在前' : '时间: 最旧在前';
                applyFiltersAndSort();
                renderNotices();
            });

            filterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                filterDropdown.classList.toggle('show');
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#filterBtn') && !e.target.closest('#filterDropdown')) {
                    filterDropdown.classList.remove('show');
                }
            });

            loadNotices();
        })();
    </script>
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5824bbe371ce4eefbe8027cb86c0d0a6"}'></script>
</body>
