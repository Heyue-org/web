<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合月亭 Wiki · HWF V1.1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Microsoft YaHei','PingFang SC',sans-serif; font-size:18px; background:#f8fafc; color:#334155; line-height:1.7; height:100vh; overflow:hidden; display:flex; }

        :root {
            --bg-color: #f8fafc; --sidebar-bg: #fff; --text-main: #334155;
            --text-sub: #64748b; --accent-color: #d97706; --border-color: #e2e8f0;
            --hover-bg: #f1f5f9; --code-bg: #f1f5f9; --danger: #ef4444; --success: #22c55e;
        }

        .sidebar { width:280px; background:var(--sidebar-bg); border-right:1px solid var(--border-color); display:flex; flex-direction:column; height:100%; transition:transform .3s; z-index:100; flex-shrink:0; }
        .sidebar-header { padding:1.2rem 1.5rem; border-bottom:1px solid var(--border-color); font-weight:700; font-size:1.2rem; color:var(--accent-color); display:flex; align-items:baseline; gap:0.15rem; }
        .sidebar-header .brand { flex:0 0 auto; line-height:1.4; }
        .sidebar-header .version-tag { display:none; font-size:50%; color:var(--text-sub); font-weight:normal; opacity:0.7; white-space:nowrap; flex-shrink:0; line-height:1.4; }
        .sidebar-content { flex:1; overflow-y:auto; padding:.5rem 0; }
        .toc-list { list-style:none; }
        .toc-page-link { padding-left:0; display:flex; justify-content:space-between; align-items:center; cursor:pointer; color:var(--text-main); font-weight:600; transition:background-color .15s,color .15s,border-color .15s; border-left:4px solid transparent; user-select:none; white-space:nowrap; min-width:0; }
        .toc-page-link:hover { background:var(--hover-bg); color:var(--accent-color); }
        .toc-page-link.active { background:rgba(217,119,6,.08); color:var(--accent-color); border-left-color:var(--accent-color); }
        .link-text { flex:1; min-width:0; white-space:nowrap; overflow:visible; text-overflow:clip; padding:.7rem .8rem .7rem .4rem; }
        .edit-mode .link-text { overflow:visible; max-width:none; }
        .expand-arrow { font-size:.6rem; margin-right:1.5rem; padding:12px 8px 12px 20px; cursor:pointer; opacity:.6; transition:all .3s; display:inline-block; line-height:1; flex-shrink:0; }
        .expand-arrow:hover { opacity:1; }
        .expand-arrow.open { transform:rotate(90deg); opacity:1; }
        .sub-menu { display:none; background:rgba(0,0,0,.02); padding-bottom:.5rem; }
        .sub-menu.visible { display:block; }
        .toc-link { display:block; padding:.4rem 1.5rem .4rem 2.5rem; text-decoration:none; color:var(--text-sub); font-size:.9rem; transition:background-color .15s,color .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .toc-link:hover { color:var(--accent-color); background:var(--hover-bg); }
        .sidebar-edit-actions { padding:.8rem 1rem; border-top:1px solid var(--border-color); }
        .btn-add-page { width:100%; padding:.5rem; border:1px dashed var(--accent-color); background:none; color:var(--accent-color); border-radius:6px; cursor:pointer; font-size:.85rem; font-weight:600; transition:all .2s; }
        .btn-add-page:hover { background:rgba(217,119,6,.08); }
        .edit-mode .toc-page-link { padding-right:.2rem; }
        .btn-delete-page { background:none; border:none; color:var(--danger); cursor:pointer; font-size:.8rem; padding:.3rem .5rem; border-radius:4px; flex-shrink:0; display:none; pointer-events:none; flex:0 0 auto; }
        .edit-mode .btn-delete-page { display:inline-block; pointer-events:auto; opacity:.6; }
        .btn-delete-page:hover { opacity:1; background:rgba(239,68,68,.1); }

        .main-content { flex:1; overflow-y:auto; padding:3rem 4rem; scroll-behavior:smooth; background:var(--bg-color); min-width:0; }
        .content-wrapper { max-width:1400px; margin:0 auto; background:#fff; padding:3rem; border-radius:12px; box-shadow:0 4px 6px -1px rgba(0,0,0,.05); min-height:80vh; contain:layout paint; }
        .wiki-page { display:none; animation:fadeIn .25s ease; contain:content; }
        .wiki-page.active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        h1, h2, h3, h4, h5, h6, p, div, section, blockquote, ul, ol, li { margin:0; padding:0; }
        ul, ol { padding-left:1.5em; }
        h1 { font-size:2.2rem; border-bottom:2px solid var(--border-color); padding-bottom:1rem; }
        h2 { font-size:1.6rem; }
        h3 { font-size:1.3rem; }
        p { text-align:justify; }
        code { background:var(--code-bg); padding:.15rem .4rem; border-radius:4px; font-family:monospace; color:#d97706; font-size:.9em; }
        pre { background:#1e293b; color:#e2e8f0; padding:1.2rem; border-radius:8px; overflow-x:auto; margin-bottom:1.2rem; position:relative; }
        .copy-btn {
            position:absolute; top:8px; right:8px; background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:4px; padding:4px 8px; font-size:.7rem; cursor:pointer; transition:all .2s; z-index:10;
        }
        .copy-btn:hover { background:rgba(255,255,255,.3); }
        .copy-btn.copied { background:var(--success); border-color:var(--success); }
        img { max-width:100%; border-radius:8px; margin:0; display:block; }
        .page-body-display img { cursor:zoom-in; }
        .editable-body img { cursor:pointer; }
        .img-selected { outline:2px solid var(--accent-color); outline-offset:2px; }

        table {
            width:100%;
            border-collapse:collapse;
            margin:1.5rem 0;
            font-size:.95em;
            background:#fff;
        }
        th, td {
            border:1px solid var(--border-color);
            padding:.65rem .8rem;
            text-align:left;
            vertical-align:top;
        }
        th {
            background:#f8fafc;
            font-weight:700;
        }
        tr:hover td {
            background:var(--hover-bg);
        }

        .meta-bar { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; font-size:.82rem; color:var(--text-sub); margin-bottom:2rem; padding-top:.5rem; }
        .meta-author-tag { display:inline-flex; align-items:center; gap:.3rem; background:rgba(217,119,6,.1); color:var(--accent-color); padding:.15rem .7rem; border-radius:20px; font-weight:600; font-size:.78rem; }

        .author-tags-editor { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; }
        .author-tag { display:inline-flex; align-items:center; gap:.3rem; background:rgba(217,119,6,.12); color:var(--accent-color); padding:.15rem .5rem .15rem .7rem; border-radius:20px; font-size:.78rem; font-weight:600; white-space:nowrap; animation:tagIn .2s ease; }
        @keyframes tagIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
        .author-tag .tag-remove { background:none; border:none; cursor:pointer; color:var(--accent-color); font-size:.7rem; padding:0 .2rem; border-radius:50%; line-height:1; opacity:.6; transition:all .15s; }
        .author-tag .tag-remove:hover { opacity:1; background:rgba(217,119,6,.2); }
        .author-input-row { display:flex; align-items:center; gap:.3rem; position:relative; }
        .author-text-input { border:1px solid var(--border-color); border-radius:6px; padding:.2rem .5rem; font-size:.8rem; outline:none; font-family:inherit; width:130px; transition:border-color .2s; }
        .author-text-input:focus { border-color:var(--accent-color); }
        .member-suggestions { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--border-color); border-radius:6px; box-shadow:0 4px 12px rgba(0,0,0,.1); z-index:60; max-height:160px; overflow-y:auto; display:none; }
        .member-suggestions.show { display:block; }
        .member-suggestion-item { padding:.4rem .7rem; font-size:.82rem; cursor:pointer; transition:background .15s; }
        .member-suggestion-item:hover,.member-suggestion-item.highlighted { background:var(--hover-bg); color:var(--accent-color); }
        .member-suggestion-item.used { opacity:.4; pointer-events:none; }

        .editor-toolbar { display:none; position:sticky; top:0; z-index:50; background:#fff; border:1px solid var(--border-color); border-radius:10px; padding:.4rem .6rem; margin-bottom:1.5rem; gap:.2rem; flex-wrap:wrap; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.06); }
        .editor-toolbar.show { display:flex; }
        .toolbar-btn { background:none; border:1px solid transparent; border-radius:4px; padding:.3rem .6rem; cursor:pointer; font-size:.85rem; color:var(--text-main); transition:all .15s; font-weight:600; line-height:1; }
        .toolbar-btn:hover { background:var(--hover-bg); border-color:var(--border-color); }
        .toolbar-btn.active { background:var(--accent-color); border-color:var(--accent-color); color:#fff; }
        .toolbar-sep { width:1px; height:20px; background:var(--border-color); margin:0 .3rem; }
        .toolbar-label { font-size:.75rem; color:var(--text-sub); margin-left:auto; }
        .toolbar-select { border:1px solid var(--border-color); border-radius:4px; padding:.22rem .3rem; font-size:.8rem; color:var(--text-main); background:#fff; cursor:pointer; outline:none; font-family:inherit; max-width:104px; }
        .toolbar-select:hover { border-color:var(--accent-color); }
        .toolbar-select option { font-size:.85rem; }
        .color-picker-wrap { display:inline-flex; align-items:center; gap:.2rem; position:relative; }
        .color-picker-wrap input[type=color] { width:24px; height:24px; border:1px solid var(--border-color); border-radius:4px; cursor:pointer; padding:0; background:none; }
        .color-picker-wrap .color-label { font-size:.75rem; font-weight:600; color:var(--text-main); }
        .editable-title { outline:none; border-bottom:2px dashed var(--accent-color); cursor:text; min-width:100px; }
        .editable-body { outline:none; min-height:200px; border:1px dashed var(--border-color); border-radius:8px; padding:1rem; margin-top:.5rem; cursor:text; }
        .editable-body:focus { border-color:var(--accent-color); }
        .editable-body img { display:block; max-width:100%; }
        .editable-body a { color:var(--accent-color); text-decoration:underline; cursor:pointer; }

        .top-controls { display:flex; align-items:center; gap:.8rem; margin-bottom:1.5rem; flex-wrap:wrap; }
        .mode-toggle { padding:.5rem 1.2rem; border-radius:6px; font-size:.85rem; font-weight:700; cursor:pointer; border:1px solid var(--border-color); background:#fff; color:var(--text-main); transition:all .2s; }
        .mode-toggle.editing { background:var(--accent-color); color:#fff; border-color:var(--accent-color); }
        .btn-save { padding:.5rem 1.2rem; border-radius:6px; font-size:.85rem; font-weight:700; cursor:pointer; border:none; background:var(--success); color:#fff; transition:all .2s; display:none; }
        .btn-save:hover { opacity:.9; }
        .btn-save.show { display:inline-block; }
        .btn-export { padding:.5rem 1.2rem; border-radius:6px; font-size:.85rem; font-weight:600; cursor:pointer; border:1px solid var(--border-color); background:#fff; color:var(--text-sub); transition:all .2s; margin-left:auto; }
        .btn-export:hover { border-color:var(--accent-color); color:var(--accent-color); }
        .btn-manage-members { padding:.5rem 1rem; border-radius:6px; font-size:.8rem; font-weight:600; cursor:pointer; border:1px solid var(--border-color); background:#fff; color:var(--text-sub); transition:all .2s; display:none; }
        .btn-manage-members.show { display:inline-block; }
        .btn-manage-members:hover { border-color:var(--accent-color); color:var(--accent-color); }
        .save-toast { position:fixed; bottom:2rem; right:2rem; background:var(--success); color:#fff; padding:.8rem 1.5rem; border-radius:8px; font-weight:600; font-size:.9rem; transform:translateY(100px); opacity:0; transition:all .3s; z-index:999; }
        .save-toast.show { transform:translateY(0); opacity:1; }

        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:500; justify-content:center; align-items:center; }
        .modal-overlay.show { display:flex; }
        .modal-box { background:#fff; border-radius:12px; padding:2rem; max-width:480px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.15); animation:modalIn .25s ease; }
        @keyframes modalIn { from{opacity:0;transform:scale(.95) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
        .modal-box h3 { margin-bottom:1rem; font-size:1.1rem; }
        .modal-box p { margin-bottom:1.5rem; font-size:.9rem; color:var(--text-sub); }
        .modal-actions { display:flex; gap:.8rem; justify-content:flex-end; }
        .modal-btn { padding:.5rem 1.2rem; border-radius:6px; font-size:.85rem; font-weight:600; cursor:pointer; border:1px solid var(--border-color); background:#fff; color:var(--text-main); transition:all .2s; }
        .modal-btn:hover { background:var(--hover-bg); }
        .modal-btn.primary { background:var(--accent-color); color:#fff; border-color:var(--accent-color); }
        .modal-btn.primary:hover { opacity:.9; }
        .member-manager .modal-box { max-width:520px; }
        .member-list { list-style:none; margin-bottom:1rem; max-height:250px; overflow-y:auto; }
        .member-list li { display:flex; align-items:center; gap:.5rem; padding:.5rem .8rem; border-radius:6px; transition:background .2s; }
        .member-list li:hover { background:var(--hover-bg); }
        .member-list li .member-name { flex:1; font-size:.9rem; }
        .member-list li .member-name-input { flex:1; font-size:.9rem; padding:.2rem .5rem; border:1px solid var(--accent-color); border-radius:4px; outline:none; font-family:inherit; }
        .member-list li button { background:none; border:none; cursor:pointer; font-size:.8rem; padding:.2rem .4rem; border-radius:4px; }
        .member-list li .btn-rename { color:var(--accent-color); }
        .member-list li .btn-rename:hover { background:rgba(217,119,6,.1); }
        .member-list li .btn-del-member { color:var(--danger); }
        .member-list li .btn-del-member:hover { background:rgba(239,68,68,.1); }
        .member-list li .btn-confirm-rename { color:var(--success); }
        .member-list li .btn-confirm-rename:hover { background:rgba(34,197,94,.1); }
        .add-member-row { display:flex; gap:.5rem; }
        .add-member-row input { flex:1; padding:.4rem .7rem; border:1px solid var(--border-color); border-radius:6px; font-size:.85rem; outline:none; font-family:inherit; }
        .add-member-row input:focus { border-color:var(--accent-color); }
        .add-member-row button { padding:.4rem 1rem; border-radius:6px; border:none; background:var(--accent-color); color:#fff; font-size:.85rem; font-weight:600; cursor:pointer; }
        .add-member-row button:hover { opacity:.9; }

        #linkModal .modal-box input[type="text"] {
            width:100%; padding:.4rem .6rem; border:1px solid var(--border-color); border-radius:4px; font-size:.9rem; font-family:inherit; box-sizing:border-box;
        }
        #linkModal .modal-box input:focus { border-color:var(--accent-color); outline:none; }
        #linkModal .modal-box label { display:block; font-weight:600; margin-bottom:.2rem; font-size:.85rem; color:var(--text-sub); }

        .img-toolbar { position:fixed; display:none; z-index:300; background:#fff; border:1px solid var(--border-color); border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.15); padding:.35rem .5rem; gap:.15rem; flex-wrap:wrap; align-items:center; max-width:90vw; }
        .img-toolbar .toolbar-btn { font-size:.75rem; padding:.25rem .5rem; }

        .img-lightbox { display:none; position:fixed; inset:0; background:rgba(15,23,42,.85); z-index:1000; justify-content:center; align-items:center; cursor:zoom-out; }
        .img-lightbox.show { display:flex; }
        .img-lightbox img { max-width:90vw; max-height:88vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); animation:lbZoom .28s cubic-bezier(.2,.8,.3,1); cursor:default; }
        @keyframes lbZoom { from{opacity:0;transform:scale(.55)} to{opacity:1;transform:scale(1)} }
        .lightbox-close { position:absolute; top:1.2rem; right:1.5rem; background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.35); width:40px; height:40px; border-radius:50%; font-size:1.1rem; cursor:pointer; transition:all .2s; z-index:1001; }
        .lightbox-close:hover { background:rgba(255,255,255,.28); transform:rotate(90deg); }

        .konami-hint { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); font-size:.7rem; color:var(--border-color); pointer-events:none; user-select:none; opacity:0; transition:opacity 1s; z-index:1; }
        .konami-hint.flash { opacity:1; }

        .mobile-menu-btn { display:none; position:fixed; top:1rem; left:1rem; z-index:200; background:var(--accent-color); color:white; border:none; padding:.5rem .8rem; border-radius:4px; cursor:pointer; font-size:1rem; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:99; }
        .sidebar-overlay.active { display:block; }
        @media(max-width:768px) {
            body { flex-direction:column; overflow:auto; height:auto; }
            .sidebar { position:fixed; left:-280px; top:0; bottom:0; box-shadow:2px 0 10px rgba(0,0,0,.1); height:100vh; }
            .sidebar.active { transform:translateX(280px); }
            .main-content { padding:1rem; padding-top:4rem; }
            .content-wrapper { padding:1.5rem; min-height:auto; }
            .mobile-menu-btn { display:block; }
            h1 { font-size:1.6rem; }
            .editor-toolbar { position:static; }
        }
    </style>
</head>
<body>

<button class="mobile-menu-btn" id="mobileMenuBtn">☰ 目录</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <span class="brand">📚 合月亭 Wiki</span>
        <span class="version-tag" id="versionTag">HWF V1.1</span>
    </div>
    <div class="sidebar-content"><ul class="toc-list" id="tocList"></ul></div>
    <div class="sidebar-edit-actions" id="sidebarEditActions" style="display:none;">
        <button class="btn-add-page" id="btnAddPage">＋ 新增分区页面</button>
    </div>
</aside>

<main class="main-content" id="mainContent" aria-live="polite">
    <div class="content-wrapper">
        <div class="top-controls" id="topControls" style="display:none;">
            <button class="mode-toggle" id="modeToggle" title="切换编辑/预览模式">✏️ 编辑模式</button>
            <button class="btn-save" id="btnSave" title="保存当前页面 (Ctrl+S)">💾 保存</button>
            <button class="btn-manage-members" id="btnManageMembers" title="编辑部成员管理">👥 编辑部成员列表</button>
            <button class="btn-export" id="btnExportJson" title="导出数据为 JSON 文件">📤 导出JSON</button>
            <button class="btn-export" id="btnImportJson" title="从 JSON 文件导入数据">📥 导入JSON</button>
            <input type="file" id="importJsonInput" accept=".json,application/json" style="display:none;">
        </div>
        <div class="editor-toolbar" id="editorToolbar">
            <button class="toolbar-btn" data-cmd="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
            <button class="toolbar-btn" data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
            <button class="toolbar-btn" data-cmd="underline" title="下划线 (Ctrl+U)"><u>U</u></button>
            <button class="toolbar-btn" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
            <div class="toolbar-sep"></div>
            <select class="toolbar-select" id="fontSizeSelect" title="字体大小">
                <option value="">字号</option>
                <option value="1">极小</option>
                <option value="2">较小</option>
                <option value="3">小</option>
                <option value="4">标准</option>
                <option value="5">大</option>
                <option value="6">特大</option>
                <option value="7">超大</option>
            </select>
            <select class="toolbar-select" id="fontFamilySelect" title="字体">
                <option value="">字体</option>
                <option value="SimSun" style="font-family:'SimSun'">宋体</option>
                <option value="SimHei" style="font-family:'SimHei'">黑体</option>
                <option value="Microsoft YaHei" style="font-family:'Microsoft YaHei'">微软雅黑</option>
                <option value="KaiTi" style="font-family:'KaiTi'">楷体</option>
                <option value="FangSong" style="font-family:'FangSong'">仿宋</option>
                <option value="Arial" style="font-family:Arial">Arial</option>
                <option value="Georgia" style="font-family:Georgia">Georgia</option>
                <option value="Consolas" style="font-family:Consolas">Consolas</option>
            </select>
            <div class="toolbar-sep"></div>
            <button class="toolbar-btn" data-cmd="h2" title="二级标题">H2</button>
            <button class="toolbar-btn" data-cmd="h3" title="三级标题">H3</button>
            <button class="toolbar-btn" data-cmd="insertSection" title="选中文字设为章节，再点取消">§ 章节</button>
            <div class="toolbar-sep"></div>
            <div class="color-picker-wrap" title="选中文字后点击色块应用颜色">
                <span class="color-label">A</span>
                <input type="color" id="textColorPicker" value="#d97706" title="文字颜色">
            </div>
            <div class="color-picker-wrap" title="选中文字后点击色块应用背景高亮">
                <span class="color-label">▨</span>
                <input type="color" id="hiliteColorPicker" value="#fde68a" title="背景高亮色">
            </div>
            <div class="toolbar-sep"></div>
            <button class="toolbar-btn" data-cmd="justifyLeft" title="左对齐">⇤ 左</button>
            <button class="toolbar-btn" data-cmd="justifyCenter" title="居中对齐">⇔ 中</button>
            <button class="toolbar-btn" data-cmd="justifyRight" title="右对齐">⇥ 右</button>
            <div class="toolbar-sep"></div>
            <button class="toolbar-btn" data-cmd="blockquote" title="引用块">❝ 引用</button>
            <div class="toolbar-sep"></div>
            <button class="toolbar-btn" data-cmd="insertImage" title="插入图片 (输入URL)，插入后点击图片可调尺寸">图片</button>
            <button class="toolbar-btn" data-cmd="table" title="插入表格">⊞ 表格</button>
            <button class="toolbar-btn" data-cmd="createLink" title="插入或编辑链接">🔗 链接</button>
            <button class="toolbar-btn" data-cmd="code" title="行内代码">&lt;/&gt;</button>
            <button class="toolbar-btn" data-cmd="pre" title="代码块">Pre</button>
            <div class="toolbar-sep"></div>

<script>
(() => {
    'use strict';

    const FRAMEWORK = {
        name: 'Heyue Wiki Framework',
        version: 'V1.1',
        short: 'HWF'
    };

    const PAGES_KEY = 'heyue_wiki_pages_v10';
    const MEMBERS_KEY = 'heyue_wiki_members_v10';
    const DATA_URL = 'WIKI-data.json';

    let pages=[], members=[];
    let isEditMode=false, currentPageId=null, hasUnsavedChanges=false;
    let editorUnlocked=false;
    let toastTimer=0;
    let activeImg=null;

    const $ = id => document.getElementById(id);
    const dom = {
        tocList: $('tocList'), pagesContainer: $('pagesContainer'), mainContent: $('mainContent'),
        topControls: $('topControls'), modeToggle: $('modeToggle'), btnSave: $('btnSave'),
        btnManageMembers: $('btnManageMembers'), editorToolbar: $('editorToolbar'),
        sidebarEditActions: $('sidebarEditActions'), contentWrapper: document.querySelector('.content-wrapper'),
        saveToast: $('saveToast'), saveConfirmModal: $('saveConfirmModal'), memberModal: $('memberModal')
    };

    function setVersionTag() {
        const tag = document.getElementById('versionTag');
        if (tag) {
            tag.textContent = `${FRAMEWORK.short} ${FRAMEWORK.version}`;
        }
    }

    function toggleVersionTag(show) {
        const tag = document.getElementById('versionTag');
        if (tag) {
            tag.style.display = show ? 'inline-block' : 'none';
        }
    }

    function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
    function formatTime(iso){if(!iso)return'—';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
    function getAuthors(pg){if(Array.isArray(pg.authors))return pg.authors;if(pg.author)return[pg.author];return[];}

    const ALLOWED_TAGS = new Set([
        'P','DIV','BR','B','STRONG','I','EM','U','S','STRIKE','DEL',
        'H1','H2','H3','H4','H5','H6','BLOCKQUOTE','UL','OL','LI','HR',
        'CODE','PRE','A','IMG','FONT','SPAN','SECTION',
        'TABLE','THEAD','TBODY','TFOOT','TR','TH','TD'
    ]);
    const ALLOWED_STYLES = new Set(['color','background-color','text-align','font-size','font-family','width','height','max-width']);

    function stripComments(root){
        const w=document.createTreeWalker(root,NodeFilter.SHOW_COMMENT);
        const list=[];while(w.nextNode())list.push(w.currentNode);
        list.forEach(c=>{if(c.parentNode)c.parentNode.removeChild(c);});
    }

    function normalizeDivs(root){
        const BLOCK_RE=/^(DIV|P|SECTION|UL|OL|TABLE|BLOCKQUOTE|PRE|HR|H[1-6])$/;
        let divs=[...root.querySelectorAll('div')];
        for(const d of divs){
            if(!d.isConnected)continue;
            const hasBlock=[...d.children].some(c=>BLOCK_RE.test(c.tagName));
            if(hasBlock){
                const parent=d.parentNode;
                while(d.firstChild)parent.insertBefore(d.firstChild,d);
                parent.removeChild(d);
            }
        }
        root.querySelectorAll('div').forEach(d=>{
            if(!d.isConnected)return;
            const p=document.createElement('p');
            const st=d.getAttribute('style');
            if(st)p.setAttribute('style',st);
            while(d.firstChild)p.appendChild(d.firstChild);
            d.replaceWith(p);
        });
    }

    function cleanEmptyBlocks(root){
        for(let pass=0;pass<2;pass++){
            const els=[...root.querySelectorAll('p,div')];
            for(const el of els){
                if(!el.isConnected)continue;
                if(el.querySelector('img,table,section,ul,ol,pre,blockquote,hr,iframe'))continue;
                if(!el.textContent.replace(/[\u00a0\s]/g,'').length)el.remove();
            }
        }
    }

    function sanitizeNode(root){
        stripComments(root);
        const els=[...root.querySelectorAll('*')];
        for(const el of els){
            if(!ALLOWED_TAGS.has(el.tagName)){
                const parent=el.parentNode;
                while(el.firstChild)parent.insertBefore(el.firstChild,el);
                parent.removeChild(el);
                continue;
            }
            for(const attr of[...el.attributes]){
                const name=attr.name.toLowerCase();
                const keepAttr = name==='style'

                    ||(el.tagName==='A'&&(name==='href'||name==='title'))
                    ||(el.tagName==='IMG'&&(name==='src'||name==='alt'||name==='width'||name==='height'))
                    ||(el.tagName==='SECTION'&&name==='id')
                    ||(el.tagName==='FONT'&&(name==='size'||name==='face'||name==='color'))
                    ||((el.tagName==='TD'||el.tagName==='TH')&&(name==='colspan'||name==='rowspan'));
                if(!keepAttr)el.removeAttribute(attr.name);
            }
            if(el.tagName==='A'&&/^\s*javascript:/i.test(el.getAttribute('href')||''))el.removeAttribute('href');
            if(el.tagName==='IMG'&&/^\s*javascript:/i.test(el.getAttribute('src')||''))el.removeAttribute('src');
            if(el.getAttribute('style')){
                const kept=[];
                for(const part of el.getAttribute('style').split(';')){
                    const i=part.indexOf(':');
                    if(i<0)continue;
                    const prop=part.slice(0,i).trim().toLowerCase();
                    const val=part.slice(i+1).trim();
                    if(ALLOWED_STYLES.has(prop)&&val)kept.push(prop+':'+val);
                }
                if(kept.length)el.setAttribute('style',kept.join(';'));
                else el.removeAttribute('style');
            }
        }
        return root.innerHTML;
    }

    function normalizeContent(html){
        const tmp=document.createElement('div');
        tmp.innerHTML=html;
        stripComments(tmp);
        normalizeDivs(tmp);
        cleanEmptyBlocks(tmp);
        return sanitizeNode(tmp);
    }

    function pasteAsText(e){
        e.preventDefault();
        const body=document.querySelector('.editable-body');if(!body)return;
        const cd=e.clipboardData||window.clipboardData;
        const text=cd.getData('text/plain');
        const html=cd.getData('text/html');
        let insert;
        if(html){
            insert=normalizeContent(html);
        }else{
            insert=text.split(/\r?\n/).map(l=>'<p>'+(esc(l)||'<br>')+'</p>').join('');
        }
        document.execCommand('insertHTML',false,insert);
        hasUnsavedChanges=true;
    }

    function extractSubs(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        const subs = [];
        tmp.querySelectorAll('section[id]').forEach(sec => {
            const h = sec.querySelector('h2,h3');
            if (h) subs.push({ id: sec.id, label: h.textContent.trim() });
        });
        tmp.querySelectorAll('h2[id],h3[id]').forEach(h => {
            if (!tmp.querySelector(`section[id="${h.id}"]`)) {
                subs.push({ id: h.id, label: h.textContent.trim() });
            }
        });
        return subs;
    }

    function stripContentComments(pgList){
        pgList.forEach(pg=>{
            if(typeof pg.content==='string')pg.content=pg.content.replace(/<!--([\s\S]*?)-->/g,'');
        });
    }

    async function loadData(){
        try {
            const res = await fetch(DATA_URL, { cache: 'no-store' });
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data.pages)) pages = data.pages;
                if (Array.isArray(data.members)) members = data.members;
                stripContentComments(pages);
                if (pages.length) localStorage.setItem(PAGES_KEY, JSON.stringify(pages));
                if (members.length) localStorage.setItem(MEMBERS_KEY, JSON.stringify(members));
                return;
            }
        } catch (e) {
            console.warn('无法从服务器加载最新数据，将尝试读取本地缓存', e);
        }
        try {
            const lp = localStorage.getItem(PAGES_KEY);
            const lm = localStorage.getItem(MEMBERS_KEY);
            if (lp) pages = JSON.parse(lp);
            if (lm) members = JSON.parse(lm);
        } catch (e) {}
    }

    function savePagesData(){localStorage.setItem(PAGES_KEY,JSON.stringify(pages));showToast();}
    function saveMembersData(){localStorage.setItem(MEMBERS_KEY,JSON.stringify(members));}
    function showToast(msg){const t=dom.saveToast;t.textContent=msg||'✅ 已保存';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000);}

    function renderAuthorsDisplay(authors){
        if(!authors.length)return'<span class="meta-author-tag">✍️ 匿名</span>';
        return authors.map(a=>`<span class="meta-author-tag">✍️ ${esc(a)}</span>`).join(' ');
    }

    function buildPageHTML(pg,isActive=false){
        return`<div id="${pg.id}" class="wiki-page${isActive?' active':''}" data-page-id="${pg.id}">
            <h1 class="page-title-display">${esc(pg.title)}</h1>
            <div class="meta-bar"><span class="meta-time">🕐 ${formatTime(pg.updated)}</span>${renderAuthorsDisplay(getAuthors(pg))}</div>
            <div class="page-body-display">${pg.content}</div>
        </div>`;
    }
    function buildTocItemHTML(pg,{isActive=false,deletable=true,idx=0}={}){
        const subHtml=pg.hasSub&&pg.subs?.length?`<div class="sub-menu" data-submenu="${pg.id}">${pg.subs.map(s=>`<a href="#${s.id}" class="toc-link" data-anchor="${s.id}" data-parent="${pg.id}">${esc(s.label)}</a>`).join('')}</div>`:'';
        const arrow=pg.hasSub?`<span class="expand-arrow" data-arrow="${pg.id}">▶</span>`:'';
        const del=deletable?`<button class="btn-delete-page" data-del-idx="${idx}" title="删除此分区">✕</button>`:'';
        return`<li class="toc-item"><div class="toc-page-link${isActive?' active':''}"><span class="link-text" data-nav="${pg.id}">${esc(pg.title)}</span>${arrow}${del}</div>${subHtml}</li>`;
    }

    function renderSidebar(){
        dom.tocList.innerHTML=pages.map((pg,idx)=>buildTocItemHTML(pg,{isActive:pg.id===currentPageId,idx})).join('');
    }

    function renderPages(){
        dom.pagesContainer.innerHTML=pages.map(pg=>buildPageHTML(pg,pg.id===currentPageId)).join('');
        if (!isEditMode) {
            document.querySelectorAll('.wiki-page.active .page-body-display img').forEach(img => {
                img.style.cursor = 'pointer';
                img.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openLightbox(this);
                });
            });
        }
        document.querySelectorAll('pre code').forEach(block => {
            const pre = block.parentElement;
            if (pre && !pre.querySelector('.copy-btn')) {
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = '复制';
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const code = block.textContent;
                    navigator.clipboard.writeText(code).then(() => {
                        this.textContent = '已复制';
                        this.classList.add('copied');
                        setTimeout(() => { this.textContent = '复制'; this.classList.remove('copied'); }, 2000);
                    }).catch(() => {
                        const area = document.createElement('textarea');
                        area.value = code;
                        document.body.appendChild(area);
                        area.select();
                        document.execCommand('copy');
                        area.remove();
                        this.textContent = '已复制';
                        this.classList.add('copied');
                        setTimeout(() => { this.textContent = '复制'; this.classList.remove('copied'); }, 2000);
                    });
                });
                pre.style.position = 'relative';
                pre.appendChild(btn);
            }
        });
    }

    function switchPage(pageId){
        if(!pageId)return;
        currentPageId=pageId;
        const activePage=dom.pagesContainer.querySelector('.wiki-page.active');
        const nextPage=$(pageId);
        if(activePage&&activePage!==nextPage)activePage.classList.remove('active');
        if(nextPage)nextPage.classList.add('active');
        const activeNav=dom.tocList.querySelector('.toc-page-link.active');
        const safeId = window.CSS?.escape ? CSS.escape(pageId) : pageId.replace(/[^\w-]/g,'');
        const nextNav=dom.tocList.querySelector(`[data-nav="${safeId}"]`)?.closest('.toc-page-link');
        if(activeNav&&activeNav!==nextNav)activeNav.classList.remove('active');
        if(nextNav)nextNav.classList.add('active');
        dom.mainContent.scrollTop=0;
        if(window.innerWidth<=768)toggleSidebar(false);
        if(isEditMode)requestAnimationFrame(enterEditModeForCurrentPage);
        if (!isEditMode) {
            document.querySelectorAll('.wiki-page.active .page-body-display img').forEach(img => {
                img.style.cursor = 'pointer';
                img.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openLightbox(this);
                });
            });
            renderPages();
        }
    }

    const KONAMI_SEQ = [
        'ArrowUp','ArrowUp','ArrowDown','ArrowDown',
        'ArrowLeft','ArrowRight','ArrowLeft','ArrowRight',
        'KeyB','KeyA'
    ];
    const KEY_FALLBACK = {
        'ArrowUp':['ArrowUp','Up','↑'],
        'ArrowDown':['ArrowDown','Down','↓'],
        'ArrowLeft':['ArrowLeft','Left','←'],
        'ArrowRight':['ArrowRight','Right','→'],
        'KeyB':['KeyB','b','B'],
        'KeyA':['KeyA','a','A']
    };
    let konamiIdx = 0;

    function matchKey(expectedCode, e) {
        if (e.code === expectedCode) return true;
        const fallbacks = KEY_FALLBACK[expectedCode];
        if (fallbacks && fallbacks.includes(e.key)) return true;
        return false;
    }

    window.addEventListener('keydown', function konamiListener(e) {
        if (editorUnlocked) return;
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        if (matchKey(KONAMI_SEQ[konamiIdx], e)) {
            konamiIdx++;
            if (konamiIdx === KONAMI_SEQ.length) {
                unlockEditor();
                konamiIdx = 0;
            }
        } else {
            konamiIdx = matchKey(KONAMI_SEQ[0], e) ? 1 : 0;
        }
    });

    function unlockEditor() {
        editorUnlocked = true;
        document.getElementById('topControls').style.display = 'flex';
        const hint = document.getElementById('konamiHint');
        if(hint){
            hint.textContent = '🔓 编辑器已解锁';
            hint.classList.add('flash');
            setTimeout(() => hint.classList.remove('flash'), 2000);
        }
        showToast('🎮 编辑器已解锁');
        toggleVersionTag(true);
    }

    function toggleEditMode(){
        if(!isEditMode){
            isEditMode=true;hasUnsavedChanges=false;
            document.getElementById('modeToggle').textContent='👁 预览模式';
            document.getElementById('modeToggle').classList.add('editing');
            document.getElementById('btnSave').classList.add('show');
            document.getElementById('btnManageMembers').classList.add('show');
            document.getElementById('editorToolbar').classList.add('show');
            document.getElementById('sidebarEditActions').style.display='block';
            document.body.classList.add('edit-mode');
            enterEditModeForCurrentPage();
        }else{
            if(hasUnsavedChanges)document.getElementById('saveConfirmModal').classList.add('show');
            else doExitEditMode();
        }
    }

    function doExitEditMode(){
        isEditMode=false;hasUnsavedChanges=false;
        hideImgToolbar();
        document.getElementById('modeToggle').textContent='✏️ 编辑模式';
        document.getElementById('modeToggle').classList.remove('editing');
        document.getElementById('btnSave').classList.remove('show');
        document.getElementById('btnManageMembers').classList.remove('show');
        document.getElementById('editorToolbar').classList.remove('show');
        document.getElementById('sidebarEditActions').style.display='none';
        document.body.classList.remove('edit-mode');
        renderPages();
        if(currentPageId)document.getElementById(currentPageId)?.classList.add('active');
        document.querySelectorAll('.wiki-page.active .page-body-display img').forEach(img => {
            img.style.cursor = 'pointer';
            img.addEventListener('click', function(e) {
                e.stopPropagation();
                openLightbox(this);
            });
        });
    }

    function getEditableBody(){return document.querySelector('.editable-body');}

    function buildAuthorTagsEditor(currentAuthors){
        const tags=currentAuthors.map(a=>`<span class="author-tag" data-author="${esc(a)}">${esc(a)}<button class="tag-remove" data-remove="${esc(a)}" title="移除署名">✕</button></span>`).join('');
        return`<div class="author-tags-editor" id="authorTagsEditor">
            <span style="font-size:.82rem;color:var(--text-sub);margin-right:.2rem;">✍️</span>
            ${tags}
            <div class="author-input-row">
                <input type="text" class="author-text-input" id="authorTextInput" placeholder="输入或选择成员..." autocomplete="off" title="输入名字回车添加，或从下拉列表选择">
                <div class="member-suggestions" id="memberSuggestions"></div>
            </div>
        </div>`;
    }

    function enterEditModeForCurrentPage(){
        if(!isEditMode||!currentPageId)return;
        const pageEl=document.getElementById(currentPageId);
        const pg=pages.find(p=>p.id===currentPageId);
        if(!pageEl||!pg)return;
        const currentAuthors=getAuthors(pg);
        pageEl.querySelector('.page-title-display').innerHTML=`<div class="editable-title" contenteditable="true" spellcheck="false">${esc(pg.title)}</div>`;
        pageEl.querySelector('.meta-bar').innerHTML=`<span class="meta-time">🕐 ${formatTime(pg.updated)}</span>${buildAuthorTagsEditor(currentAuthors)}`;
        pageEl.querySelector('.page-body-display').innerHTML=`<div class="editable-body" contenteditable="true" spellcheck="false">${pg.content}</div>`;
        pageEl.querySelector('.editable-title').addEventListener('input',()=>{hasUnsavedChanges=true;});
        const bodyEl=pageEl.querySelector('.editable-body');
        bodyEl.addEventListener('input',()=>{hasUnsavedChanges=true;});
        bodyEl.addEventListener('paste',e=>{pasteAsText(e);});
        bodyEl.addEventListener('dblclick', function(e) {
            const img = e.target.closest('img');
            if (img) {
                e.preventDefault();
                const currentW = img.width || img.naturalWidth || 300;
                const currentH = img.height || img.naturalHeight || 200;
                const w = prompt('输入图片宽度（像素或百分比，如 300 或 50%）', currentW);
                if (w !== null && w.trim() !== '') {
                    const h = prompt('输入图片高度（像素或百分比，留空自动）', currentH);
                    img.style.width = w.trim();
                    if (h !== null && h.trim() !== '') {
                        img.style.height = h.trim();
                    } else {
                        img.style.height = 'auto';
                    }
                    hasUnsavedChanges = true;
                }
            }
        });
        bodyEl.addEventListener('click', function(e) {
            const img = e.target.closest('img');
            if (img) { e.preventDefault(); e.stopPropagation(); showImgToolbar(img); return; }
        });
        bindAuthorTagsEvents();
    }

    function bindAuthorTagsEvents(){
        const editor=document.getElementById('authorTagsEditor');
        const textInput=document.getElementById('authorTextInput');
        const suggestions=document.getElementById('memberSuggestions');
        if(!editor||!textInput||!suggestions)return;
        let highlightIdx=-1;

        editor.addEventListener('click',e=>{
            const rb=e.target.closest('.tag-remove');
            if(rb){rb.closest('.author-tag')?.remove();hasUnsavedChanges=true;updateSug();}
        });

        function getCurrentTags(){return[...editor.querySelectorAll('.author-tag')].map(t=>t.dataset.author);}

        function showSuggestions(q){
            const existing=getCurrentTags();
            const filtered=members.filter(m=>!q||m.name.toLowerCase().includes(q.toLowerCase()));
            if(!filtered.length){suggestions.classList.remove('show');return;}
            suggestions.innerHTML=filtered.map((m,i)=>{
                const used=existing.includes(m.name);
                return`<div class="member-suggestion-item${used?' used':''}${i===highlightIdx?' highlighted':''}" data-name="${esc(m.name)}">${esc(m.name)}${used?' ✓':''}</div>`;
            }).join('');
            suggestions.classList.add('show');
        }
        function updateSug(){if(suggestions.classList.contains('show'))showSuggestions(textInput.value.trim());}

        function addTag(name){
            if(!name.trim())return;
            if(getCurrentTags().includes(name.trim()))return;

    function toggleSectionOnSelection(){

        if(!sel.rangeCount||sel.isCollapsed){alert('请先用鼠标选中要设为章节的文字');return;}
        const range=sel.getRangeAt(0);
        const container=range.commonAncestorContainer;
        const node=container.nodeType===1?container:container.parentElement;
        const existing=node?.closest('section');
        if(existing){
            const parent=existing.parentNode;
            existing.querySelectorAll('h2,h3').forEach(h=>{const p=document.createElement('p');p.textContent=h.textContent;h.replaceWith(p);});
            while(existing.firstChild)parent.insertBefore(existing.firstChild,existing);
            parent.removeChild(existing);
        }else{
            const text=range.toString().trim();
            if(!text){alert('选中内容为空');return;}
            const section=document.createElement('section');section.id='sec-'+Date.now();
            const h2=document.createElement('h2');h2.textContent=text;section.appendChild(h2);
            range.deleteContents();range.insertNode(section);

    function getLinkInfoFromSelection() {
        const sel = window.getSelection();
        if (!sel.rangeCount) return null;
        
        const range = sel.getRangeAt(0);
        let a = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
        a = a?.closest?.('a');
        
        if (!a) {
            const common = range.commonAncestorContainer;
            const el = common.nodeType === Node.ELEMENT_NODE ? common : common.parentElement;
            a = el?.closest?.('a');
        }
        
        if (a) {
            return { title: a.textContent, href: a.getAttribute('href') || '', element: a };
        } else {
            const text = sel.toString().trim();
            return { title: text, href: '', element: null };
        }
    }

    function insertOrEditLink(title, href) {
        if (!title.trim()) { alert('标题不能为空'); return; }
        
        // 恢复之前保存的光标位置
        const body = document.querySelector('.editable-body');
        if (body && savedEditorRange) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedEditorRange);
        }

        const sel = window.getSelection();
        if (!sel.rangeCount) {
            alert('请先点击编辑区域或选中一些文字');
            return;
        }
        
        const range = sel.getRangeAt(0);
        let a = null;
        let node = range.startContainer;
        if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
        a = node?.closest?.('a');
        
        if (!a) {
            const common = range.commonAncestorContainer;
            const el = common.nodeType === Node.ELEMENT_NODE ? common : common.parentElement;
            a = el?.closest?.('a');
        }
        
        if (a) {
            // 编辑现有链接
            const newA = document.createElement('a');
            newA.href = href || '#';
            newA.textContent = title;
            a.replaceWith(newA);
            
            const newRange = document.createRange();
            newRange.selectNodeContents(newA);
            sel.removeAllRanges();
            sel.addRange(newRange);
        } else {
            // 插入新链接
            let selectedText = sel.toString().trim();
            if (!selectedText) {
                selectedText = title;
            }
            const linkHtml = `<a href="${esc(href || '#')}">${esc(selectedText)}</a>`;
            document.execCommand('insertHTML', false, linkHtml);
        }
        hasUnsavedChanges = true;
    }

    // 全局变量用于保存编辑器失去焦点前的 Range
    let savedEditorRange = null;
    document.addEventListener('selectionchange', function(){
        const body = document.querySelector('.editable-body');
        const sel = window.getSelection();
        if(body && sel && sel.rangeCount && body.contains(sel.anchorNode)){
            savedEditorRange = sel.getRangeAt(0).cloneRange();
        }
    });

    document.getElementById('editorToolbar').addEventListener('click', function(e) {
        const btn = e.target.closest('.toolbar-btn');
        if (!btn) return;
        if (!btn.dataset.cmd) return;
        
        const body = document.querySelector('.editable-body');
        if (!body) { alert('未找到可编辑区域'); return; }
        
        // 对于不需要弹窗的命令，先聚焦以确保 execCommand 生效
        if (btn.dataset.cmd !== 'createLink') {
            body.focus();
            // 如果有保存的Range且当前没有有效选区，尝试恢复
            const sel = window.getSelection();
            if (savedEditorRange && (!sel.rangeCount || sel.isCollapsed)) {
                 sel.removeAllRanges();
                 sel.addRange(savedEditorRange);
            }
        }

        const cmd = btn.dataset.cmd;
        switch(cmd) {
            case 'bold': document.execCommand('bold'); break;
            case 'italic': document.execCommand('italic'); break;
            case 'underline': document.execCommand('underline'); break;
            case 'strikeThrough': document.execCommand('strikeThrough'); break;
            case 'h2': document.execCommand('formatBlock', false, 'h2'); break;
            case 'h3': document.execCommand('formatBlock', false, 'h3'); break;
            case 'blockquote': {
                if (!window.getSelection().isCollapsed) {
                    document.execCommand('formatBlock', false, 'blockquote');
                } else {
                    document.execCommand('insertHTML', false, '<blockquote><br></blockquote>');
                }
                break;
            }
            case 'justifyLeft': document.execCommand('justifyLeft'); break;
            case 'justifyCenter': document.execCommand('justifyCenter'); break;
            case 'justifyRight': document.execCommand('justifyRight'); break;
            case 'insertUnorderedList': document.execCommand('insertUnorderedList'); break;
            case 'removeFormat': document.execCommand('removeFormat'); break;
            case 'code': {
                const s = window.getSelection();
                document.execCommand('insertHTML', false, '<code>' + esc(s.toString() || '代码') + '</code>');
                break;
            }
            case 'pre': document.execCommand('insertHTML', false, '<pre>// code\n</pre><p></p>'); break;
            case 'insertImage': {
                const u = prompt('图片URL：', 'https://');
                if (u && u !== 'https://') document.execCommand('insertHTML', false, `<img src="${esc(u)}" alt=""><p></p>`);
                break;
            }
            case 'table': {
                const r = parseInt(prompt('表格行数（第一行为表头）：','3'),10);
                const c = parseInt(prompt('表格列数：','3'),10);
                if (!r || !c || r < 1 || c < 1 || r > 50 || c > 20) { alert('请输入有效的行列数（行≤50，列≤20）'); break; }
                let html = '<table>';
                for (let i = 0; i < r; i++) {
                    html += '<tr>';
                    for (let j = 0; j < c; j++) {
                        html += i === 0 ? '<th>表头</th>' : '<td><br></td>';
                    }
                    html += '</tr>';
                }
                html += '</table><p></p>';
                document.execCommand('insertHTML', false, html);
                break;
            }
            case 'createLink': {
                // 链接命令不立即 focus body，以免 selection 丢失
                // 而是直接从 savedEditorRange 或当前 selection 获取信息
                const info = getLinkInfoFromSelection();
                openLinkModal(info?.title || '', info?.href || '');
                break;
            }
            case 'insertSection': toggleSectionOnSelection(); break;
            case 'clean': cleanCurrentBody(); break;
        }
        if (cmd !== 'clean' && cmd !== 'createLink') {
            hasUnsavedChanges = true;
        }
    });

    function syncFormatState(){
        if(!isEditMode)return;

        let fs='',ff='';
        try{fs=document.queryCommandValue('fontSize')||'';}catch(e){}
        try{ff=document.queryCommandValue('fontName')||'';}catch(e){}
        const fsSel=document.getElementById('fontSizeSelect');

            if(!matched)ffSel.value='';
        }
    }

    document.getElementById('sidebarOverlay').addEventListener('click',()=>toggleSidebar(false));

    $('modeToggle').addEventListener('click',toggleEditMode);
    dom.btnSave.addEventListener('click',saveCurrentPage);
    document.addEventListener('keydown',e=>{
        if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&isEditMode){e.preventDefault();saveCurrentPage();return;}
        if(e.key==='Escape'){
            if($('imgLightbox').classList.contains('show'))closeLightbox();
            else if($('imgToolbar').style.display!=='none')hideImgToolbar();
            else if($('memberModal').classList.contains('show'))$('memberModal').classList.remove('show');
            else if($('saveConfirmModal').classList.contains('show'))$('saveConfirmModal').classList.remove('show');
            else if(document.getElementById('linkModal')?.classList.contains('show'))closeLinkModal();
            else if(window.innerWidth<=768)toggleSidebar(false);
        }
    });

    window.addEventListener('beforeunload', (e) => {
        if (isEditMode) {
            e.preventDefault();
            e.returnValue = '当前处于编辑模式，刷新可能导致数据丢失，请编辑员确保数据已成功保存或导出';
            return e.returnValue;
        }
    });

    (async()=>{
        await loadData();renderSidebar();renderPages();switchPage(pages[0]?.id||'page-intro');
        if(!pages.length){dom.pagesContainer.innerHTML='<div class="wiki-page active"><h1>暂无内容</h1><p>请导入 WIKI-data.json 或在编辑模式中新增页面。</p></div>';}
        toggleVersionTag(false);
    })();

    setVersionTag();

    function buildDataJSON(){
        if(isEditMode)commitCurrentEdits(false);
        return JSON.stringify({_exportedAt:new Date().toISOString(),members,pages},null,2);
    }
})();
</script>
</body>
</html>
