<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合月亭 Wiki</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-main: #334155;
            --text-sub: #64748b;
            --accent-color: #d97706; 
            --border-color: #e2e8f0;
            --hover-bg: #f1f5f9;
            --code-bg: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .toc-list { list-style: none; }
        .toc-item { position: relative; }

        .toc-page-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            user-select: none;
        }

        .toc-page-link:hover {
            background-color: var(--hover-bg);
            color: var(--accent-color);
        }
        .toc-page-link.active {
            background-color: rgba(217, 119, 6, 0.08);
            color: var(--accent-color);
            border-left-color: var(--accent-color);
        }

        .link-text {
            flex: 1;
            padding: 0.8rem 1.5rem;
        }

        .expand-arrow {
            font-size: 0.6rem;
            margin-right: 1.5rem;
            padding: 12px 8px 12px 20px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.3s ease;
            display: inline-block;
            line-height: 1;
        }

        .expand-arrow:hover {
            opacity: 1;
        }

        .expand-arrow.open {
            transform: rotate(90deg);
            opacity: 1;
        }

        .sub-menu {
            display: none; 
            background-color: rgba(0,0,0,0.02);
            padding-bottom: 0.5rem;
        }
        .sub-menu.visible { display: block; }

        .toc-link {
            display: block;
            padding: 0.5rem 1.5rem 0.5rem 2.5rem;
            text-decoration: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .toc-link:hover { color: var(--accent-color); }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 3rem 4rem;
            scroll-behavior: smooth;
            background-color: var(--bg-color);
        }

        .content-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            min-height: 80vh;
        }

        .wiki-page { display: none; animation: fadeIn 0.4s ease; }
        .wiki-page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 2.5rem; margin-bottom: 1rem; color: var(--text-main); border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; }
        h2 { font-size: 1.8rem; margin-top: 2.5rem; margin-bottom: 1rem; color: var(--text-main); }
        h3 { font-size: 1.4rem; margin-top: 2rem; margin-bottom: 0.8rem; color: var(--text-main); }
        p { margin-bottom: 1.2rem; text-align: justify; }
        
        code { background: var(--code-bg); padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; color: #d97706; font-size: 0.9em; }
        pre { background: #1e293b; color: #e2e8f0; padding: 1.5rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1.5rem; }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 200;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
            .sidebar.active { transform: translateX(280px); }
            .main-content { padding: 1rem; }
            .content-wrapper { padding: 1.5rem; }
            .mobile-menu-btn { display: block; }
        }
    </style>
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "5824bbe371ce4eefbe8027cb86c0d0a6"}'></script>
</head>
<body>

    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰ 目录</button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>📚 合月亭 Wiki</span>
        </div>
        <div class="sidebar-content">
            <ul class="toc-list">
                <li class="toc-item">
                    <div class="toc-page-link active" onclick="switchPage('page-intro', this)">
                        <span class="link-text">项目简介</span>
                    </div>
                </li>

                <li class="toc-item">
                    <div class="toc-page-link" data-page="page-start">
                        <span class="link-text" onclick="handleTextClick('page-start', this)">AAA</span>
                        <span class="expand-arrow" onclick="handleArrowClick(event, 'menu-start', this)">▶</span>
                    </div>
                    <div class="sub-menu" id="menu-start">
                        <a href="#install" class="toc-link" onclick="handleSubClick()">111</a>
                        <a href="#config" class="toc-link" onclick="handleSubClick()">222</a>
                        <a href="#run" class="toc-link" onclick="handleSubClick()">333</a>
                    </div>
                </li>

                <li class="toc-item">
                    <div class="toc-page-link" data-page="page-core">
                        <span class="link-text" onclick="handleTextClick('page-core', this)">BBB</span>
                        <span class="expand-arrow" onclick="handleArrowClick(event, 'menu-core', this)">▶</span>
                    </div>
                    <div class="sub-menu" id="menu-core">
                        <a href="#feature-map" class="toc-link" onclick="handleSubClick()">111</a>
                        <a href="#feature-guide" class="toc-link" onclick="handleSubClick()">222</a>
                        <a href="#feature-api" class="toc-link" onclick="handleSubClick()">333</a>
                    </div>
                </li>

                <li class="toc-item">
                    <div class="toc-page-link" onclick="switchPage('page-faq', this)">
                        <span class="link-text">常见问题 (FAQ)</span>
                    </div>
                </li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <div class="content-wrapper">
            
            <div id="page-intro" class="wiki-page active">
                <section id="intro">
                    <h1>合月亭 Wiki </h1>
                    <p>虽然做了这个页面，但是我暂时也不知道应该写什么……</p>
                </section>
            </div>

            <div id="page-start" class="wiki-page">
                <h1>AAA</h1>
                <p>阿巴巴</p>
                </section>
            </div>

            <div id="page-core" class="wiki-page">
                <h1>BBB</h1>
                <p>阿巴阿巴</p>
                </section>
            </div>

            <div id="page-faq" class="wiki-page">
                <h1>常见问题 (FAQ)</h1>
                <section id="faq">
                    <h3>Q: 阿巴阿巴？</h3>
                    <p>A: 歪比巴卜。</p>
                </section>
            </div>

        </div>
    </main>

    <script>
        function handleTextClick(pageId, textElement) {
            const parentLink = textElement.closest('.toc-page-link');
            switchPage(pageId, parentLink);
            
            const subMenu = parentLink.parentElement.querySelector('.sub-menu');
            const arrow = parentLink.querySelector('.expand-arrow');
            
            if (subMenu && !subMenu.classList.contains('visible')) {
                subMenu.classList.add('visible');
                if (arrow) arrow.classList.add('open');
            }
        }

        function handleArrowClick(event, menuId, arrowElement) {
            event.stopPropagation();
            const subMenu = document.getElementById(menuId);
            subMenu.classList.toggle('visible');
            arrowElement.classList.toggle('open');
        }

        function switchPage(pageId, element) {
            document.querySelectorAll('.wiki-page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');

            setActiveLink(element);

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
            }
            
            document.querySelector('.main-content').scrollTop = 0;
        }

        function setActiveLink(element) {
            document.querySelectorAll('.toc-page-link').forEach(link => {
                link.classList.remove('active');
            });
            element.classList.add('active');
        }

        function handleSubClick() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }
    </script>
</body>
</html>
