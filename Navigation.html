<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <link rel="icon" type="image/png" href="assets/css/images/biglogo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACG资源站点导航 - 合月亭</title>
    <meta name="description" content="合月亭 ACG 资源站点导航，分类收录免费二次元资源网站，涵盖动漫、漫画、游戏、轻小说、音乐、壁纸等，持续整理更新。">
    <meta name="keywords" content="ACG资源导航,二次元网站收录,动漫资源站,漫画网站,游戏资源,合月亭">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
            --danger: #f87171;
            --excellent: #34d399;
            --top-bar-bg: rgba(15, 23, 42, 0.6);
            --input-bg: rgba(30, 41, 59, 0.8);
            --sidebar-w: 220px;
            /* 顶栏吸顶后的实际高度，由 JS 实测写入；这里是首帧渲染的兜底值 */
            --topbar-h: 60px;
        }
        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent-gold: #d97706;
            --border-color: rgba(0, 0, 0, 0.08);
            --danger: #dc2626;
            --excellent: #059669;
            --top-bar-bg: rgba(255, 255, 255, 0.7);
            --input-bg: rgba(255, 255, 255, 0.9);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* 注意：这里千万不能给 body 设 overflow-x:hidden —— 那会把 body 变成滚动容器，
           而真正滚动的是 viewport，sticky 相对它永远算不出偏移，侧栏就会跟着页面一起滑走。
           clip 同样能裁掉横向溢出，但不会创建滚动容器，sticky 才能正常生效。 */
        html { overflow-x: hidden; width: 100%; }
        body { overflow-x: clip; width: 100%; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: 50%;
            transform: translateX(-50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(251,191,36,0.1) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
            transition: background 0.3s;
        }
        [data-theme="light"] body::before {
            background: radial-gradient(circle, rgba(217,119,6,0.08) 0%, transparent 70%);
        }
        .top-bar {
            /* 上下 1rem → 0.833rem（缩短六分之一） */
            padding: 0.833rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--top-bar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.3s, border-color 0.3s;
            flex-shrink: 0;
            /* 吸顶：用 sticky 而不是 fixed —— 不脱离 flex 流，下面的内容不用补 padding-top */
            position: sticky; top: 0;
            z-index: 200;
        }
        .top-bar-inner {
            /* 去掉 1400 居中，和靠左的侧栏对齐；顶栏本身有 2rem 内边距，不会真贴死边缘 */
            margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text-main);
            font-size: 1.8rem; font-weight: 700; letter-spacing: 2px;
            white-space: nowrap; transition: color 0.3s;
        }
        .logo img {
            width: 32px; height: 32px; border-radius: 50%;
            object-fit: cover; border: 1px solid var(--accent-gold);
        }
        .v-line {
            width: 3px; height: 32px; background: var(--text-main);
            margin: 0 1.2rem; opacity: 0.9; flex-shrink: 0;
            border-radius: 2px; transition: background 0.3s;
        }
        .page-title {
            /* 现在是 h1（SEO），h1 自带 margin-block 会把顶栏撑高，必须清零 */
            margin: 0;
            font-size: 1.8rem; font-weight: 600; color: var(--accent-gold);
            letter-spacing: 2px; white-space: nowrap;
            text-shadow: 0 0 10px rgba(251,191,36,0.3);
            transition: color 0.3s, text-shadow 0.3s;
        }
        .theme-toggle {
            background: none; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer;
            font-size: 1.1rem; line-height: 1; color: var(--text-main);
            transition: all 0.3s; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .theme-toggle:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .mobile-sticky-tabs {
            display: none;
            position: sticky;
            /* 顶栏吸顶在 top:0，移动端这排分类 tab 要贴在它下面 */
            top: var(--topbar-h);
            z-index: 199;
            background: var(--top-bar-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0;
            transition: background 0.3s, border-color 0.3s;
        }
        .mobile-tabs-scroll {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 0.8rem;
            gap: 0.5rem;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .mobile-tabs-scroll::-webkit-scrollbar { display: none; }
        .mobile-tab-item {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-sub);
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
        }
        .mobile-tab-item.active {
            background: var(--accent-gold);
            color: #0f172a;
            border-color: var(--accent-gold);
            font-weight: 700;
        }
        [data-theme="light"] .mobile-tab-item.active { color: #fff; }
        .mobile-tab-item:not(.active):hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .layout {
            /* 原来 max-width:1400px + margin:0 auto 会把整块内容居中，
               屏幕比 1400px 宽时左右各空一大段，侧栏就被推离屏幕边缘了。
               这里改成靠左铺开，宽度上限交给 .main-content 自己管。 */
            display: flex; flex: 1; max-width: none;
            margin: 0; width: 100%;
        }
        .sidebar {
            width: var(--sidebar-w); flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 0;
            /* sticky 要能粘住，元素必须比包含块矮、留出余量。所以：
               align-self:flex-start —— 高度跟内容走，别被 flex 的 stretch 拉成和正文一样长（那样余量为 0，直接失效）；
               max-height —— 卡住上限，内容超高时才压缩。
               两个一起才有余量可粘。 */
            align-self: flex-start;
            max-height: calc(100vh - var(--topbar-h));
            overflow-y: auto;
            /* 滚动条只隐藏不禁用：内容超高时照样能滚（不会丢分类），只是看不到滑块 */
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: sticky; top: var(--topbar-h);
            transition: border-color 0.3s;
        }
        .sidebar::-webkit-scrollbar { display: none; }
        .sidebar-section-label {
            padding: 0.6rem 1.5rem 0.4rem;
            /* 分组标签「— 资源站 —」在侧栏里居中 */
            text-align: center;
            /* letter-spacing:3px 会在最后一个字右边多出 3px 空隙，居中时字会偏左 1.5px，
               右边内距减掉这 3px 才算真正居中（左右内距差 = letter-spacing） */
            padding-right: calc(1.5rem - 3px);
            font-size: 0.75rem; font-weight: 600;
            color: var(--text-sub); letter-spacing: 3px;
            text-transform: uppercase; transition: color 0.3s;
        }
        .sidebar-link {
            display: block; padding: 0.55rem 1.5rem;
            font-size: 0.95rem; color: var(--text-main);
            text-decoration: none; transition: all 0.2s;
            border-left: 3px solid transparent; cursor: pointer;
        }
        .sidebar-link:hover {
            background: rgba(251,191,36,0.08);
            color: var(--accent-gold);
        }
        .sidebar-link.active {
            border-left-color: var(--accent-gold);
            background: rgba(251,191,36,0.12);
            color: var(--accent-gold);
            font-weight: 600;
        }
        .main-content {
            /* 侧栏贴左之后正文仍要有宽度上限，否则超宽屏上卡片会被拉得过长 */
            flex: 1; min-width: 0; max-width: 1400px;
            /* 上 1.5rem → 1.25rem（缩短六分之一）：这段就是「分区名称上方的空位」，
               再按用户要求整体上移 10px → 0.625rem */
            padding: 0.625rem 2rem 4rem;
        }
        /* 排布（按用户指定）：分区名 + 搜索框并排；
           「共 N 个站点」落在分区名下面，「+」标签按钮落在搜索框下面 */
        .content-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(200px, 1.5fr);
            grid-template-areas:
                "title  search"
                "count  tagbtn";
            align-items: center;
            column-gap: 1rem; row-gap: 0.4rem;
            margin-bottom: 0.833rem;
        }
        .current-category {
            grid-area: title; min-width: 0;
            font-size: 1.4rem; font-weight: 700;
            color: var(--accent-gold); letter-spacing: 1px;
        }
        .site-count { grid-area: count; color: var(--text-sub); font-size: 0.85rem; }
        .search-box {
            grid-area: search; width: 100%; min-width: 0;
            padding: 0.6rem 1rem;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-main);
            font-size: 0.9rem; outline: none; transition: all 0.3s;
        }
        .search-box:focus { border-color: var(--accent-gold); }

        /* ── 标签筛选 ────────────────────────────────────────── */
        .tag-wrap { grid-area: tagbtn; justify-self: end; position: relative; }
        .tag-add-btn {
            width: 30px; height: 30px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-main); font-size: 1.1rem; line-height: 1;
            cursor: pointer; padding: 0; user-select: none;
            transition: all 0.25s;
        }
        .tag-add-btn:hover, .tag-add-btn.active {
            border-color: var(--accent-gold); color: var(--accent-gold);
            background: rgba(251,191,36,0.12);
        }
        /* 有生效的标签时按钮上挂一个小点，收起弹层也能看出来 */
        .tag-add-btn.has-tags::after {
            content: ''; position: absolute; top: -2px; right: -2px;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-gold);
        }
        .tag-pop {
            position: absolute; top: calc(100% + 6px); right: 0;
            z-index: 60; display: none;
            min-width: 190px; max-width: 300px; max-height: 280px;
            overflow-y: auto; padding: 0.4rem;
            background: var(--bg-card); backdrop-filter: blur(4px);
            border: 1px solid var(--border-color); border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.28);
        }
        .tag-pop.open { display: block; }
        .tag-pop-item {
            display: flex; align-items: center; gap: 0.35rem;
            padding: 0.2rem 0.25rem 0.2rem 0.45rem; border-radius: 6px;
        }
        .tag-pop-item:hover { background: rgba(128,128,128,0.12); }
        .tag-pop-name {
            flex: 1; min-width: 0; font-size: 0.82rem; color: var(--text-main);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .tag-pop-n { font-size: 0.72rem; color: var(--text-sub); flex-shrink: 0; }
        .tag-pop-op {
            width: 22px; height: 22px; flex-shrink: 0; padding: 0;
            border-radius: 50%; border: 1px solid var(--border-color);
            background: transparent; color: var(--text-sub);
            font-size: 0.9rem; line-height: 1; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .tag-pop-op:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .tag-pop-op.minus:hover { border-color: var(--danger); color: var(--danger); }
        .tag-pop-op.on { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(251,191,36,0.18); font-weight: 700; }
        .tag-pop-op.minus.on { border-color: var(--danger); color: var(--danger); background: rgba(248,113,113,0.18); }
        .tag-pop-empty { padding: 0.4rem; font-size: 0.78rem; color: var(--text-sub); text-align: center; line-height: 1.5; }

        /* 已选标签：点一下移除 */
        .tag-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 0.833rem; }
        .tag-chips:empty { display: none; }
        .tag-chip {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.15rem 0.5rem; border-radius: 999px;
            font-size: 0.78rem; line-height: 1.5; cursor: pointer; user-select: none;
            background: rgba(251,191,36,0.12); border: 1px solid var(--accent-gold);
            color: var(--accent-gold); transition: all 0.2s;
        }
        .tag-chip.neg { background: rgba(248,113,113,0.12); border-color: var(--danger); color: var(--danger); }
        .tag-chip .op { font-weight: 700; }
        .tag-chip .x { opacity: 0.55; }
        .tag-chip:hover .x { opacity: 1; }
        .toolbar {
            display: flex; gap: 1rem; align-items: center;
            flex-wrap: wrap; margin-bottom: 1.5rem;
        }
        .sort-select {
            padding: 0.6rem 1rem; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 8px;
            color: var(--text-main); font-size: 0.9rem;
            outline: none; cursor: pointer; transition: all 0.3s;
        }
        .grid-toggle-btn {
            /* 以前是 display:none（老 bug：按钮在 DOM 里、JS 也在跑，就是看不见）。
               现在它是「3列/4列」切换，放在排序下拉右边，要显示出来。
               移动端媒体查询里仍然是 display:none !important（那边固定 2 列，切了没意义）。 */
            display: inline-flex;
            align-items: center; justify-content: center;
            padding: 0.55rem 0.8rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; white-space: nowrap;
            transition: all 0.3s; user-select: none;
            flex-shrink: 0;
        }
        .grid-toggle-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .grid-toggle-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(251,191,36,0.1); }
        .grid {
            /* 必须 minmax(0,1fr)：1fr 的最小尺寸是 auto，长站名会把所在列顶宽，
               同一行卡片就变成宽窄不一了。站名放大后这个问题才暴露出来。 */
            /* align-items:start —— 卡片高度只跟着自己的内容走，不填充行高。
               之前用 grid-auto-rows:1fr 强行把所有行拉成等高，结果内容短的卡片底部被垫出一大截空白
               （留白要么落在中间、要么落在按钮下面，怎么都不对）。现在底部直接贴着内容收口。 */
            /* 默认 4 列（从实验文件合并过来），3 列由 .cols-3 覆盖 */
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            /* align-items:stretch —— 同一行内所有卡片都拉到该行最高的那张（被文本撑得最大的那张）一样高。
               注意只做「行内」等高：grid 默认就是每行各自算，不要再加 grid-auto-rows:1fr，
               那个会把所有行也拉成同一高度，内容少的整行底部会垫出一大截空白。 */
            align-items: stretch;
            /* 4 列更密，间距也收一档 */
            gap: 0.7rem 0.8rem;
        }
        /* 3 列模式（点工具栏那个「3列/4列」按钮）：列数变 3，
           卡片也一起回到宽松尺寸 —— 4 列那套小字号、窄内距是配密排的，
           拿来放 3 列会显得卡片里空荡荡。这里把合并前 3 列的取值原样搬回来。 */
        .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.9rem 1rem; }
        .grid.cols-3 .site-card { padding-left: 1.26rem; padding-right: 1.26rem; gap: 0.45rem; }
        .grid.cols-3 .site-name { font-size: 1.35rem; }
        .grid.cols-3 .links-panel { padding: 0.4rem 0; }
        .grid.cols-3 .rating-row { padding-top: 0.4rem; }
        .site-card {
            position: relative; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 11px;
            /* 卡片本体按 0.9 缩放（1.2/1.4rem → 1.08/1.26rem） */
            /* 4 列下卡片更窄，左右内边距收一档；内部 gap 也收（压高度） */
            padding: 0.25rem 1rem; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s, background 0.3s;
            display: flex; flex-direction: column; gap: 0.3rem;
        }
        .site-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            border-color: rgba(251,191,36,0.4);
        }
        [data-theme="light"] .site-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .site-name-row {
            /* stretch 而不是 center：让 logo 纵向撑满「站名+UID」这块的高度，
               这样它上下就只差卡片上侧、下方虚线那几像素了（center 会让它上下各空一块） */
            display: flex; align-items: stretch; gap: 0.85rem;
            padding-right: 3rem; overflow: hidden;
            /* 站名整体下移。上方间距要略大于下方（gap 0.45rem）才视觉齐平 ——
               站名 1.35rem + line-height 1.25，字形上下各带约 2.4px 的行内留白，
               会把「文字到卡片顶」撑大、「文字到下一行」撑小，所以这里多给一点找平。
               卡片高度不能变，这笔高度在 .detail-row 上等量扣回。 */
            margin-top: 0.35rem;
        }
        /* 站名 + UID 竖着装在右边一整块里，左边留给 logo */
        .head-text {
            display: flex; flex-direction: column; gap: 0.1rem;
            min-width: 0; flex: 1;
        }
        .site-logo {
            /* 22px → 40px → 48px。高度交给 stretch 撑满，不写死，
               这样以后改站名字号 / UID 行高，logo 会跟着长，不用手动同步。 */
            width: 48px; height: auto; border-radius: 6px;
            object-fit: cover; flex-shrink: 0;
            border: 1px solid var(--border-color);
        }
        .site-name {
            /* 原始 1.05rem × 1.5 = 1.575rem，再按用户要求往回收几像素；4 列下再收一档 */
            font-size: 1.15rem; font-weight: 700; color: var(--text-main);
            line-height: 1.25;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .links-toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.5rem; padding: 0.2rem 0;
        }
        .links-toggle {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.8rem; color: var(--accent-gold);
            cursor: pointer; user-select: none; flex-shrink: 0;
        }
        .links-toggle:hover { opacity: 0.8; }
        .links-toggle .arrow { transition: transform 0.3s; font-size: 0.7rem; }
        .links-toggle.open .arrow { transform: rotate(90deg); }
        .uid-inline {
            font-size: 0.72rem; color: var(--text-sub);
            font-family: 'Fira Code', 'Consolas', monospace;
            letter-spacing: 0.5px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        .uid-inline .uid-val { color: var(--accent-gold); }
        .links-panel {
            display: none; flex-direction: column; gap: 0.3rem;

        [data-theme="light"] .detail-btn:hover { color: var(--accent-gold); }

        <script>
    (() => {
        var API_BASE = 'https://heyue-rating-worker.heyue-rating-api.workers.dev';
        var THEME_KEY = 'heyue_nav_theme';
        var RATED_KEY = 'heyue_rated_keys';
        var htmlEl = document.documentElement;
        var themeBtn = document.getElementById('themeToggle');
        function applyTheme(theme) {
            htmlEl.setAttribute('data-theme', theme);
            themeBtn.textContent = theme === 'dark' ? '🌙' : '☀️';
            localStorage.setItem(THEME_KEY, theme);
        }
        var saved = localStorage.getItem(THEME_KEY);
        if (saved) applyTheme(saved);
        themeBtn.addEventListener('click', function() {
            applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebarOverlay');
        var menuBtn = document.getElementById('mobileMenuBtn');
        function toggleSidebar(open) {
            sidebar.classList.toggle('open', open);
            overlay.classList.toggle('active', open);
        }
        menuBtn.addEventListener('click', function() { toggleSidebar(true); });
        overlay.addEventListener('click', function() { toggleSidebar(false); });
        var mobileTabsScroll = document.getElementById('mobileTabsScroll');
        var sidebarLinks = document.querySelectorAll('.sidebar-link[data-cat]');
        function buildMobileTabs() {
            mobileTabsScroll.innerHTML = '';
            sidebarLinks.forEach(function(link) {
                var tab = document.createElement('a');
                tab.className = 'mobile-tab-item';
                tab.textContent = link.dataset.label;
                tab.dataset.cat = link.dataset.cat;
                tab.dataset.label = link.dataset.label;
                if (link.classList.contains('active')) tab.classList.add('active');
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.mobile-tab-item').forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    sidebarLinks.forEach(function(l) { l.classList.remove('active'); });
                    var matchedLink = document.querySelector('.sidebar-link[data-cat="' + link.dataset.cat + '"]');
                    if (matchedLink) matchedLink.classList.add('active');
                    currentCat = link.dataset.cat;
                    loadCategory(currentCat, link.dataset.label);
                });
                mobileTabsScroll.appendChild(tab);
            });
        }
        buildMobileTabs();
        function syncMobileTabsActive(cat) {
            document.querySelectorAll('.mobile-tab-item').forEach(function(t) {
                t.classList.toggle('active', t.dataset.cat === cat);
            });
            var activeTab = mobileTabsScroll.querySelector('.mobile-tab-item.active');
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
        var GRID_COLS_KEY = 'heyue_nav_grid_cols';
        var gridToggleBtn = document.getElementById('gridToggleBtn');
        var cardContainer = document.getElementById('cardContainer');
        

        var savedCols = parseInt(localStorage.getItem(GRID_COLS_KEY));
        var currentCols = savedCols === 3 ? 3 : 4;
        function applyGridCols(cols) {
            currentCols = cols;
            localStorage.setItem(GRID_COLS_KEY, cols);
            if (cols === 3) {
                cardContainer.classList.add('cols-3');
                gridToggleBtn.textContent = '3列';
                gridToggleBtn.classList.add('active');
            } else {
                cardContainer.classList.remove('cols-3');
                gridToggleBtn.textContent = '4列';
                gridToggleBtn.classList.remove('active');
            }
            gridToggleBtn.title = '每行卡片数：' + cols + ' 列（点击切换为 ' + (cols === 3 ? 4 : 3) + ' 列）';
        }
        applyGridCols(currentCols);
        gridToggleBtn.addEventListener('click', function() {
            applyGridCols(currentCols === 4 ? 3 : 4);
        });
        
        var DATA_URL = 'assets/nav-pages/data.json';
        var globalData = null;      
        var globalCache = {};       
        var dataPromise = null;
        function loadData() {
            if (!dataPromise) {
                dataPromise = fetch(DATA_URL)
                    .then(function(res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function(json) {
                        if (!json || typeof json !== 'object' || Array.isArray(json)) {
                            throw new Error('data.json 顶层应是 {分类: [条目...]} 对象');
                        }
                        globalData = json;
                        buildCache();
                        
                        reshuffleRandom();
                    })
                    .catch(function(e) { dataPromise = null; throw e; });
            }
            return dataPromise;
        }
        function labelOf(cat) {
            var link = document.querySelector('.sidebar-link[data-cat="' + cat + '"]');
            return link ? link.dataset.label : cat;
        }
        function buildCache() {
            globalCache = {};
            Object.keys(globalData).forEach(function(cat) {
                if (!Array.isArray(globalData[cat])) return;
                var label = labelOf(cat);
                globalCache[cat] = prepareSites(globalData[cat].map(function(item) {
                    return Object.assign({}, item, { _category: label, _cat: cat, _rand: Math.random() });
                }));
            });
        }
        var allSites = [];
        var isGlobalSearch = false;
        var currentCat = '';
        var currentLabel = '';
        var ratingCache = {};
        var ratedKeys = {};
        try { ratedKeys = JSON.parse(localStorage.getItem(RATED_KEY) || '{}'); } catch(e) { ratedKeys = {}; }
        function saveRatedKey(key, score) {
            ratedKeys[key] = score;
            localStorage.setItem(RATED_KEY, JSON.stringify(ratedKeys));
        }
        function getRatingKey(site) {
            if (site.uid && site.uid.trim()) return 'uid:' + site.uid.trim();
            return 'site:' + (site.name || '') + '_' + (site.url || '').replace(/\s+/g, '_');
        }
        function getPinyin(str) {
            if (!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }
        
        function parseLinkPairs(field) {
            var pairs = [];
            if (!field) return pairs;
            if (Array.isArray(field)) {
                field.forEach(function(x) { pairs.push([null, String(x)]); });
            } else if (typeof field === 'object') {
                Object.keys(field).forEach(function(k) { pairs.push([k, String(field[k])]); });
            } else {
                String(field).split(/[,;，；]+/).forEach(function(x) { pairs.push([null, x.trim()]); });
            }
            return pairs.map(function(p) {
                var label = p[0], val = String(p[1] || '').trim().replace(/^["']+|["']+$/g, '');
                if (label === null) {
                    
                    if (val.indexOf('|') >= 0) { label = val.slice(0, val.indexOf('|')).trim(); val = val.slice(val.indexOf('|') + 1).trim(); }
                    else label = '';
                }
                return { label: label, url: val };
            }).filter(function(p) { return p.url; });
        }
        





        function siteTags(s) {
            var v = s && s.tag;
            if (!v) return [];
            if (Array.isArray(v)) return v.map(function(t) { return String(t).trim(); }).filter(Boolean);
            return String(v).split(/[|｜]/).map(function(t) { return t.trim(); }).filter(Boolean);
        }
        function attrEsc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function txtEsc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function siteSearchBlob(s) {
            var blob = [s.name, s.url, s.remark, s.issue, s.uid].concat(siteTags(s));
            ['related', 'community'].forEach(function(k) {
                parseLinkPairs(s[k]).forEach(function(p) { blob.push(p.label, p.url); });
            });
            return blob.join(' ');
        }
        function prepareSites(data) {
            for (var i = 0; i < data.length; i++) {
                if (!data[i]._sortName) {
                    data[i]._sortName = getPinyin(data[i].name);
                }
                if (!data[i]._search) {
                    data[i]._search = siteSearchBlob(data[i]).toLowerCase();
                }
            }
            return data;
        }
        function fetchRatingsBatch(keys) {
            var uncached = keys.filter(function(k) { return !ratingCache[k]; });
            if (uncached.length === 0) return Promise.resolve();
            return fetch(API_BASE + '/ratings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keys: uncached })
            })
            .then(function(res) { return res.ok ? res.json() : {}; })
            .then(function(data) {
                for (var k in data) {
                    if (data.hasOwnProperty(k)) ratingCache[k] = data[k];
                }
            })
            .catch(function(e) { console.warn('batch rating fetch failed:', e); });
        }
        function submitRating(key, score, starsEl, infoEl) {
            var fingerprint = {
                screen: screen.width + 'x' + screen.height,
                userAgent: navigator.userAgent,
                memory: navigator.deviceMemory || 0,
                cores: navigator.hardwareConcurrency || 0,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
            fetch(API_BASE + '/rate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key, score: score, fingerprint: fingerprint })
            })
            .then(function(res) { if (!res.ok) throw new Error('fail'); return res.json(); })
            .then(function(data) {
                ratingCache[key] = data;
                saveRatedKey(key, score);
                updateRatingDisplay(starsEl, infoEl, data, score);
            })
            .catch(function(e) { console.warn('rating submit failed:', e); });
        }
        function updateRatingDisplay(starsEl, infoEl, data, userScore) {
            var key = starsEl.getAttribute('data-key');
            var myScore = userScore || ratedKeys[key] || 0;
            var avgRounded = data ? Math.round(data.score) : 0;
            var starSpans = starsEl.querySelectorAll('.star');
            for (var i = 0; i < starSpans.length; i++) {
                if (i < myScore) starSpans[i].classList.add('active');
                else starSpans[i].classList.remove('active');
            }
            if (myScore && data) {
                infoEl.innerHTML = '你的评分: ' + myScore + '★ | 均分: <span class="score-val">' + data.score + '</span> (' + data.count + ')';
            } else if (data) {
                infoEl.innerHTML = '<span class="score-val">' + data.score + '</span> (' + data.count + ')';
            } else {
                infoEl.textContent = '暂无评分';
            }
        }
        function buildRatingHtml(site) {
            var key = getRatingKey(site);
            var stars = '';
            for (var i = 1; i <= 5; i++) stars += '<span class="star" data-val="' + i + '">\u2605</span>';
            return '<div class="rating-row" data-rating-key="' + key + '">'
                + '<span class="rating-label">评分</span>'
                + '<div class="stars" data-key="' + key + '">' + stars + '</div>'
                + '<span class="rating-info">加载中...</span></div>';
        }
        function bindRatingEvents() {
            var allStars = document.querySelectorAll('.stars[data-key]');
            var keysToFetch = [];
            for (var idx = 0; idx < allStars.length; idx++) {
                var key = allStars[idx].getAttribute('data-key');
                if (!ratingCache[key]) keysToFetch.push(key);
            }
            for (var idx2 = 0; idx2 < allStars.length; idx2++) {
                (function(starsEl) {
                    var key = starsEl.getAttribute('data-key');
                    var infoEl = starsEl.nextElementSibling;
                    var starSpans = starsEl.querySelectorAll('.star');
                    if (ratingCache[key]) {
                        updateRatingDisplay(starsEl, infoEl, ratingCache[key]);
                    } else if (ratedKeys[key]) {
                        updateRatingDisplay(starsEl, infoEl, null);
                    }
                    for (var j = 0; j < starSpans.length; j++) {
                        (function(star) {
                            star.addEventListener('mouseenter', function() {
                                var val = parseInt(star.getAttribute('data-val'));
                                for (var k = 0; k < starSpans.length; k++) {
                                    if (k < val) starSpans[k].classList.add('active');
                                    else starSpans[k].classList.remove('active');
                                }
                            });
                            star.addEventListener('click', function() {
                                var val = parseInt(star.getAttribute('data-val'));
                                submitRating(key, val, starsEl, infoEl);
                            });
                        })(starSpans[j]);
                    }
                    starsEl.addEventListener('mouseleave', function() {
                        var cached = ratingCache[key];
                        var myScore = ratedKeys[key] || 0;
                        var displayScore = myScore || (cached ? Math.round(cached.score) : 0);
                        for (var k = 0; k < starSpans.length; k++) {
                            if (k < displayScore) starSpans[k].classList.add('active');
                            else starSpans[k].classList.remove('active');
                        }
                    });
                })(allStars[idx2]);
            }
            if (keysToFetch.length > 0) {
                fetchRatingsBatch(keysToFetch).then(function() {
                    for (var i = 0; i < allStars.length; i++) {
                        var k = allStars[i].getAttribute('data-key');
                        if (ratingCache[k]) {
                            updateRatingDisplay(allStars[i], allStars[i].nextElementSibling, ratingCache[k]);
                        }
                    }
                });
            }
        }
        function renderCards(sites) {
            var container = document.getElementById('cardContainer');
            var countEl = document.getElementById('siteCount');
            countEl.textContent = '共 ' + sites.length + ' 个站点';
            if (sites.length === 0) { container.innerHTML = '<div class="loading">未找到匹配的站点</div>'; return; }
            container.innerHTML = sites.map(function(s) {
                var siteName = s.name || '未命名站点';
                var primaryUrl = s.url || '';
                var logoHtml = '';
                if (s.logo && s.logo.trim()) {
                    logoHtml = '<img class="site-logo" src="' + s.logo.trim() + '" alt="" onerror="this.style.display=\'none\'">';
                }
                var urlLink = primaryUrl
                    ? '<a href="' + primaryUrl + '" target="_blank" rel="noopener">' + primaryUrl + '</a>' : '—';
                var problemHtml = s.issue
                    ? '<span class="meta-value problem">' + s.issue + '</span>'
                    : '<span style="color:var(--text-sub)">暂无</span>';
                var uidInlineHtml = '';
                var detailHtml = '';
                if (s.uid && String(s.uid).trim()) {
                    uidInlineHtml = '<span class="uid-inline">UID: <span class="uid-val">' + s.uid.trim() + '</span></span>';
                    var hash = s._cat
                        ? encodeURIComponent(s._cat) + '/' + encodeURIComponent(String(s.uid).trim())
                        : encodeURIComponent(String(s.uid).trim());
                    detailHtml = '<a class="detail-btn" href="detail.html#' + hash + '" target="_blank" rel="noopener" title="打开站点详情页">详情页</a>';
                }
                var categoryTag = isGlobalSearch && s._category
                    ? '<span style="position:absolute;top:0;left:0;background:rgba(251,191,36,0.15);color:var(--accent-gold);font-size:0.65rem;font-weight:600;padding:2px 8px;border-radius:10px 0 8px 0;letter-spacing:0.5px;">' + s._category + '</span>'
                    : '';
                return '<div class="site-card">'
                    + categoryTag
                    + '<div class="site-name-row">' + logoHtml
                    + '<div class="head-text">'
                    + '<div class="site-name" title="' + siteName + '">' + siteName + '</div>'
                    + '<div class="uid-detail">' + uidInlineHtml + '</div>'
                    + '</div></div>'
                    + '<div class="links-panel show">'
                    + '<div class="link-row"><span class="link-label">网址</span>' + urlLink + '</div>'
                    + '</div>'
                    + '<div class="meta-row">'
                    + '<div class="meta-item"><div class="meta-value">' + (s.remark || '—') + '</div></div>'
                    + '<div class="meta-item"><div class="meta-value">' + problemHtml + '</div></div>'
                    + '</div>'
                    + buildRatingHtml(s)
                    + (detailHtml ? '<div class="detail-row">' + detailHtml + '</div>' : '')
                    + '</div>';
            }).join('');
            bindRatingEvents();
        }
        

        function applySort(list, mode) {
            if (mode === 'name') list.sort(function(a, b) { return a._sortName.localeCompare(b._sortName); });
            else if (mode === 'random') list.sort(function(a, b) { return (a._rand || 0) - (b._rand || 0); });
            return list;
        }
        
        function reshuffleRandom() {
            Object.keys(globalCache).forEach(function(cat) {
                (globalCache[cat] || []).forEach(function(s) { s._rand = Math.random(); });
            });
            allSites.forEach(function(s) { s._rand = Math.random(); });
        }
        

        function tagMatch(s) {
            var keys = Object.keys(activeTags);
            if (!keys.length) return true;
            var mine = siteTags(s);
            for (var i = 0; i < keys.length; i++) {
                var want = activeTags[keys[i]] > 0;
                var has = mine.indexOf(keys[i]) >= 0;
                if (want !== has) return false;
            }
            return true;
        }
        function filterAndSort() {
            var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            var sortMode = document.getElementById('sortSelect').value;
            var titleEl = document.getElementById('categoryTitle');
            var hasTags = Object.keys(activeTags).length > 0;
            if (hasTags) {
                


                isGlobalSearch = false;
                titleEl.textContent = currentLabel + (keyword ? ' · 🏷 标签 + 搜索' : ' · 🏷 标签筛选');
                var scoped = allSites.filter(function(s) {
                    if (!tagMatch(s)) return false;
                    if (!keyword) return true;
                    return (s._search || '').toLowerCase().includes(keyword);
                });
                applySort(scoped, sortMode);
                renderCards(scoped);
            } else if (keyword) {
                
                isGlobalSearch = true;
                titleEl.textContent = '🔍 全局搜索结果';
                var allData = Object.values(globalCache).flat();
                var filtered = allData.filter(function(s) {
                    return ((s._search || '') + ' ' + (s._category || '')).toLowerCase().includes(keyword);
                });
                applySort(filtered, sortMode);
                renderCards(filtered);
            } else {
                isGlobalSearch = false;
                titleEl.textContent = currentLabel;
                var plain = allSites.slice();
                applySort(plain, sortMode);
                renderCards(plain);
            }
        }
        document.getElementById('searchInput').addEventListener('input', filterAndSort);
        document.getElementById('sortSelect').addEventListener('change', function () {
            if (this.value === 'random') reshuffleRandom();
            filterAndSort();
        });

        
        

        var activeTags = Object.create(null);   
        var tagAddBtn = document.getElementById('tagAddBtn');
        var tagPop = document.getElementById('tagPop');
        var tagChips = document.getElementById('tagChips');

        


        function allTagCounts() {
            var m = Object.create(null);
            (allSites || []).forEach(function(s) {
                siteTags(s).forEach(function(t) { m[t] = (m[t] || 0) + 1; });
            });
            return Object.keys(m).map(function(t) { return { tag: t, n: m[t] }; })
                .sort(function(a, b) { return b.n - a.n || a.tag.localeCompare(b.tag, 'zh'); });
        }

        




        function renderTagPop() {
            if (!tagPop) return;
            var list = allTagCounts();
            if (!list.length) {
                

                tagPop.innerHTML = '<div class="tag-pop-empty">本分区没有标签<br>'
                    + '<span style="font-size:0.72rem">（标签只在当前分区里找）<br>'
                    + '若你确定数据里有 tag，请 <b>Ctrl+F5 强制刷新</b><br>'
                    + '（多半是浏览器还在用缓存的旧 data.json）</span></div>';
                return;
            }
            tagPop.innerHTML = list.map(function(it) {
                var st = activeTags[it.tag];
                return '<div class="tag-pop-item">'
                    + '<span class="tag-pop-name" title="' + attrEsc(it.tag) + '">' + txtEsc(it.tag) + '</span>'
                    + '<span class="tag-pop-n">' + it.n + '</span>'
                    + '<button class="tag-pop-op plus' + (st === 1 ? ' on' : '') + '" type="button"'
                    + ' data-tag="' + attrEsc(it.tag) + '" data-op="1"'
                    + ' title="只看有这个标签的站点（再点一次取消）">+</button>'
                    + '<button class="tag-pop-op minus' + (st === -1 ? ' on' : '') + '" type="button"'
                    + ' data-tag="' + attrEsc(it.tag) + '" data-op="-1"'
                    + ' title="排除有这个标签的站点（再点一次取消）">−</button>'
                    + '</div>';
            }).join('');
        }

        function renderTagChips() {
            if (!tagChips) return;
            var keys = Object.keys(activeTags);
            tagChips.innerHTML = keys.map(function(t) {
                var neg = activeTags[t] < 0;
                return '<span class="tag-chip' + (neg ? ' neg' : '') + '" data-tag="' + attrEsc(t) + '" title="点击移除这个标签">'
                    + '<span class="op">' + (neg ? '−' : '+') + '</span>'
                    + txtEsc(t) + '<span class="x">✕</span></span>';
            }).join('');
            if (tagAddBtn) tagAddBtn.classList.toggle('has-tags', keys.length > 0);
        }

        

        function setTag(tag, op) {
            if (activeTags[tag] === op) delete activeTags[tag];
            else activeTags[tag] = op;
            renderTagPop();
            renderTagChips();
            filterAndSort();
        }

        if (tagPop) tagPop.addEventListener('click', function(e) {
            var btn = e.target.closest ? e.target.closest('.tag-pop-op') : null;
            if (!btn) return;
            setTag(btn.getAttribute('data-tag'), parseInt(btn.getAttribute('data-op'), 10));
        });
        if (tagChips) tagChips.addEventListener('click', function(e) {
            var chip = e.target.closest ? e.target.closest('.tag-chip') : null;
            if (!chip) return;
            delete activeTags[chip.getAttribute('data-tag')];
            renderTagPop();
            renderTagChips();
            filterAndSort();
        });
        if (tagAddBtn && tagPop) tagAddBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            var open = tagPop.classList.toggle('open');
            tagAddBtn.classList.toggle('active', open);
            if (open) renderTagPop();
        });
        
        document.addEventListener('click', function(e) {
            if (!tagPop || !tagPop.classList.contains('open')) return;
            if (tagPop.contains(e.target) || (tagAddBtn && tagAddBtn.contains(e.target))) return;
            tagPop.classList.remove('open');
            if (tagAddBtn) tagAddBtn.classList.remove('active');
        });
        function resetTags() {
            activeTags = Object.create(null);
            if (tagPop) tagPop.classList.remove('open');
            if (tagAddBtn) tagAddBtn.classList.remove('active');
            renderTagChips();
        }

        function loadCategory(cat, label) {
            var container = document.getElementById('cardContainer');
            var titleEl = document.getElementById('categoryTitle');
            var searchInput = document.getElementById('searchInput');
            currentLabel = label;
            titleEl.textContent = label;
            searchInput.value = '';
            

            resetTags();
            isGlobalSearch = false;
            allSites = [];
            syncMobileTabsActive(cat);
            if (!cat) {
                container.innerHTML = '<div class="loading">「' + label + '」未配置分类<br>请在 sidebar-link 的 data-cat 属性中填写 data.json 里的分类 key</div>';
                document.getElementById('siteCount').textContent = '';
                return;
            }
            container.innerHTML = '<div class="loading">加载中...</div>';
            loadData().then(function() {
                var cached = globalCache[cat];
                if (!cached) {
                    container.innerHTML = '<div class="loading" style="color:var(--danger)">data.json 中找不到分类「' + cat + '」<br>请检查侧栏 data-cat 与 data.json 的顶层 key 是否一致</div>';
                    document.getElementById('siteCount').textContent = '';
                    return;
                }
                allSites = cached.map(function(item) { var copy = Object.assign({}, item); delete copy._category; return copy; });
                prepareSites(allSites);
                



                filterAndSort();
            }).catch(function(e) {
                container.innerHTML = '<div class="loading" style="color:var(--danger)">数据加载失败: ' + e.message
                    + '<br>请检查 ' + DATA_URL + ' 是否存在且格式正确'
                    + ' <a href="javascript:location.reload()" style="color:var(--accent-gold)">重试</a></div>';
                document.getElementById('siteCount').textContent = '';
            });
        }
        sidebarLinks.forEach(function(link) {
            link.addEventListener('click', function() {
                sidebarLinks.forEach(function(l) { l.classList.remove('active'); });
                link.classList.add('active');
                currentCat = link.dataset.cat;
                loadCategory(currentCat, link.dataset.label);
                if (window.innerWidth <= 768) toggleSidebar(false);
            });
        });
        var firstLink = document.querySelector('.sidebar-link.active');
        if (firstLink) {
            currentCat = firstLink.dataset.cat;
            currentLabel = firstLink.dataset.label;
            loadCategory(currentCat, currentLabel);
        }

        


        (function syncTopbarHeight() {
            var bar = document.querySelector('.top-bar');
            if (!bar) return;
            var apply = function () {
                var h = bar.offsetHeight;
                if (h > 0) document.documentElement.style.setProperty('--topbar-h', h + 'px');
            };
            apply();
            window.addEventListener('resize', apply);
            window.addEventListener('load', apply);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(apply);
        })();
    })();
    </script>
