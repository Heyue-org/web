<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACG资源站点导航 - 合月亭</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
            --danger: #f87171;
            --excellent: #34d399;
            --top-bar-bg: rgba(15, 23, 42, 0.6);
            --input-bg: rgba(30, 41, 59, 0.8);
            --sidebar-w: 220px;
        }
        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent-gold: #d97706;
            --border-color: rgba(0, 0, 0, 0.08);
            --danger: #dc2626;
            --excellent: #059669;
            --top-bar-bg: rgba(255, 255, 255, 0.7);
            --input-bg: rgba(255, 255, 255, 0.9);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; width: 100%; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: 50%;
            transform: translateX(-50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(251,191,36,0.1) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
            transition: background 0.3s;
        }
        [data-theme="light"] body::before {
            background: radial-gradient(circle, rgba(217,119,6,0.08) 0%, transparent 70%);
        }
        .top-bar {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--top-bar-bg);
            backdrop-filter: blur(5px);
            transition: background 0.3s, border-color 0.3s;
            flex-shrink: 0;
            z-index: 200;
        }
        .top-bar-inner {
            max-width: 1400px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text-main);
            font-size: 1.8rem; font-weight: 700; letter-spacing: 2px;
            white-space: nowrap; transition: color 0.3s;
        }
        .logo img {
            width: 32px; height: 32px; border-radius: 50%;
            object-fit: cover; border: 1px solid var(--accent-gold);
        }
        .v-line {
            width: 3px; height: 32px; background: var(--text-main);
            margin: 0 1.2rem; opacity: 0.9; flex-shrink: 0;
            border-radius: 2px; transition: background 0.3s;
        }
        .page-title {
            font-size: 1.8rem; font-weight: 600; color: var(--accent-gold);
            letter-spacing: 2px; white-space: nowrap;
            text-shadow: 0 0 10px rgba(251,191,36,0.3);
            transition: color 0.3s, text-shadow 0.3s;
        }
        .theme-toggle {
            background: none; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer;
            font-size: 1.1rem; line-height: 1; color: var(--text-main);
            transition: all 0.3s; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .theme-toggle:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .mobile-sticky-tabs {
            display: none;
            position: sticky;
            top: 0;
            z-index: 199;
            background: var(--top-bar-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0;
            transition: background 0.3s, border-color 0.3s;
        }
        .mobile-tabs-scroll {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 0.8rem;
            gap: 0.5rem;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .mobile-tabs-scroll::-webkit-scrollbar { display: none; }
        .mobile-tab-item {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-sub);
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
        }
        .mobile-tab-item.active {
            background: var(--accent-gold);
            color: #0f172a;
            border-color: var(--accent-gold);
            font-weight: 700;
        }
        [data-theme="light"] .mobile-tab-item.active { color: #fff; }
        .mobile-tab-item:not(.active):hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .layout {
            display: flex; flex: 1; max-width: 1400px;
            margin: 0 auto; width: 100%;
        }
        .sidebar {
            width: var(--sidebar-w); flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 0; overflow-y: auto;
            position: sticky; top: 0; height: calc(100vh - 60px);
            transition: border-color 0.3s;
        }
        .sidebar-section-label {
            padding: 0.6rem 1.5rem 0.4rem;
            font-size: 0.75rem; font-weight: 600;
            color: var(--text-sub); letter-spacing: 3px;
            text-transform: uppercase; transition: color 0.3s;
        }
        .sidebar-link {
            display: block; padding: 0.55rem 1.5rem;
            font-size: 0.95rem; color: var(--text-main);
            text-decoration: none; transition: all 0.2s;
            border-left: 3px solid transparent; cursor: pointer;
        }
        .sidebar-link:hover {
            background: rgba(251,191,36,0.08);
            color: var(--accent-gold);
        }
        .sidebar-link.active {
            border-left-color: var(--accent-gold);
            background: rgba(251,191,36,0.12);
            color: var(--accent-gold);
            font-weight: 600;
        }
        .main-content {
            flex: 1; min-width: 0; padding: 1.5rem 2rem 4rem;
        }
        .content-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem;
        }
        .current-category {
            font-size: 1.4rem; font-weight: 700;
            color: var(--accent-gold); letter-spacing: 1px;
        }
        .site-count { color: var(--text-sub); font-size: 0.85rem; }
        .toolbar {
            display: flex; gap: 1rem; align-items: center;
            flex-wrap: wrap; margin-bottom: 1.5rem;
        }
        .search-box {
            flex: 1; min-width: 200px; padding: 0.6rem 1rem;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-main);
            font-size: 0.9rem; outline: none; transition: all 0.3s;
        }
        .search-box:focus { border-color: var(--accent-gold); }
        .sort-select {
            padding: 0.6rem 1rem; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 8px;
            color: var(--text-main); font-size: 0.9rem;
            outline: none; cursor: pointer; transition: all 0.3s;
        }
        .grid-toggle-btn {
            display: none;
            align-items: center; justify-content: center;
            padding: 0.55rem 0.8rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; white-space: nowrap;
            transition: all 0.3s; user-select: none;
            flex-shrink: 0;
        }
        .grid-toggle-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .grid-toggle-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(251,191,36,0.1); }
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;
        }
        .site-card {
            position: relative; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 1.2rem 1.4rem; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s, background 0.3s;
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .site-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            border-color: rgba(251,191,36,0.4);
        }
        [data-theme="light"] .site-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .site-name-row {
            display: flex; align-items: center; gap: 0.6rem;
            padding-right: 3rem; overflow: hidden;
        }
        .site-logo {
            width: 24px; height: 24px; border-radius: 4px;
            object-fit: cover; flex-shrink: 0;
            border: 1px solid var(--border-color);
        }
        .site-name {
            font-size: 1.05rem; font-weight: 700; color: var(--text-main);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .links-toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.5rem; padding: 0.2rem 0;
        }
        .links-toggle {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.8rem; color: var(--accent-gold);
            cursor: pointer; user-select: none; flex-shrink: 0;
        }
        .links-toggle:hover { opacity: 0.8; }
        .links-toggle .arrow { transition: transform 0.3s; font-size: 0.7rem; }
        .links-toggle.open .arrow { transform: rotate(90deg); }
        .uid-inline {
            font-size: 0.72rem; color: var(--text-sub);
            font-family: 'Fira Code', 'Consolas', monospace;
            letter-spacing: 0.5px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        .uid-inline .uid-val { color: var(--accent-gold); }
        .links-panel {
            display: none; flex-direction: column; gap: 0.3rem;
            padding: 0.4rem 0; border-top: 1px dashed var(--border-color); margin-top: 0.2rem;
        }
        .links-panel.show { display: flex; }
        .link-row {
            font-size: 0.82rem; display: flex; gap: 0.5rem;
            align-items: center; flex-wrap: wrap;
        }
        .link-label { color: var(--text-sub); flex-shrink: 0; font-size: 0.75rem; }
        .link-row a {
            color: var(--accent-gold); text-decoration: none;
            border-bottom: 1px dashed rgba(251,191,36,0.4); word-break: break-all;
        }
        .link-row a:hover { border-bottom-style: solid; }
        .related-icons { display: inline-flex; gap: 6px; margin-left: 4px; align-items: center; }
        .related-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; border-radius: 4px;
            font-size: 0.85rem; cursor: default; opacity: 0.25;
            text-decoration: none !important; border-bottom: none !important; line-height: 1;
        }
        .related-icon.active { opacity: 1; cursor: pointer; }
        .related-icon.active:hover { transform: scale(1.15); }
        .related-icon.icon-nav.active { background: rgba(251,191,36,0.2); }
        .related-icon.icon-tg.active { background: rgba(38,166,227,0.2); color: #26a6e3; }
        .related-icon.icon-gh svg { width: 14px; height: 14px; fill: var(--text-sub); }
        .related-icon.icon-gh.active svg { fill: var(--text-main); }
        .related-icon.icon-gh.active { background: rgba(255,255,255,0.12); }
        [data-theme="light"] .related-icon.icon-gh.active { background: rgba(0,0,0,0.08); }
        [data-theme="light"] .related-icon.icon-gh.active svg { fill: #1e293b; }
        .custom-links-row {
            display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem;
            padding-left: 3.2rem; margin-top: 0.1rem;
        }
        .meta-row { display: flex; gap: 0.8rem; font-size: 0.82rem; line-height: 1.5; }
        .meta-item { flex: 1; min-width: 0; }
        .meta-label { color: var(--text-sub); font-size: 0.75rem; margin-bottom: 0.1rem; }
        .meta-value { word-break: break-all; }
        .meta-value.problem {
            color: #f87171 !important; font-weight: 700 !important;
            text-shadow: 0 0 8px rgba(248,113,113,0.4);
        }
        [data-theme="light"] .meta-value.problem { color: #dc2626 !important; text-shadow: none; }
        .loading {
            text-align: center; padding: 4rem 0;
            color: var(--text-sub); grid-column: 1 / -1;
        }
        .mobile-menu-btn {
            display: none; background: none; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 0.4rem 0.6rem; cursor: pointer;
            font-size: 1.2rem; color: var(--text-main); margin-right: 0.8rem;
            flex-shrink: 0;
        }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 299;
        }
        .rating-row {
            display: flex; align-items: center; gap: 0.5rem;
            margin-top: 0.3rem; padding-top: 0.4rem;
            border-top: 1px dashed var(--border-color);
        }
        .rating-label { color: var(--text-sub); font-size: 0.75rem; flex-shrink: 0; }
        .stars { display: inline-flex; gap: 2px; cursor: pointer; }
        .star {
            font-size: 1rem; color: var(--border-color);
            transition: color 0.2s, transform 0.15s; user-select: none;
        }
        .star.active { color: var(--accent-gold); }
        .star:hover { transform: scale(1.2); }
        .rating-info {
            font-size: 0.75rem; color: var(--text-sub); margin-left: auto;
            white-space: nowrap;
        }
        .rating-info .score-val { color: var(--accent-gold); font-weight: 700; }
        .stars.disabled { cursor: default; opacity: 0.6; }
        .stars.disabled .star:hover { transform: none; }
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .mobile-sticky-tabs { display: block; }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
            .sidebar {
                position: fixed; left: -260px; top: 0; bottom: 0;
                width: 260px; z-index: 300; background: var(--bg-dark);
                border-right: 1px solid var(--border-color);
                transition: left 0.3s ease; height: 100vh;
            }
            .sidebar.open { left: 0; }
            .sidebar-overlay.active { display: block; }
            .top-bar { padding: 0.8rem 0.6rem; }
            .top-bar-inner { gap: 0.5rem; }
            .mobile-menu-btn { margin-right: 0.4rem; padding: 0.35rem 0.5rem; font-size: 1.1rem; }
            .logo { font-size: 1.2rem; gap: 6px; }
            .logo img { width: 26px; height: 26px; }
            .v-line { height: 22px; margin: 0 0.5rem; width: 2px; }
            .page-title { font-size: 1.1rem; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; }
            .theme-toggle { padding: 0.3rem 0.5rem; font-size: 1rem; }
            .main-content { padding: 0.8rem 0.6rem 3rem; }
            .toolbar { gap: 0.6rem; }
            .search-box { min-width: 0; padding: 0.5rem 0.8rem; font-size: 0.85rem; }
            .sort-select { padding: 0.5rem 0.6rem; font-size: 0.85rem; }
            .grid-toggle-btn { display: none !important; }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
                width: 100%;
            }
            .grid.cols-3 {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
            }
            .site-card {
                padding: 0.7rem 0.8rem;
                border-radius: 12px;
                gap: 0.3rem;
                min-width: 0;
            }
            .site-card:hover { transform: none; box-shadow: none; }
            .site-name-row { gap: 0.4rem; padding-right: 0; }
            .site-logo { width: 20px; height: 20px; }
            .site-name { font-size: 0.85rem; }
            .links-toggle-row { padding: 0.1rem 0; gap: 0.3rem; }
            .links-toggle { font-size: 0.7rem; gap: 0.2rem; }
            .links-toggle .arrow { font-size: 0.6rem; }
            .uid-inline { font-size: 0.6rem; }
            .links-panel { gap: 0.2rem; padding: 0.3rem 0; margin-top: 0.1rem; }
            .link-row { font-size: 0.7rem; gap: 0.3rem; }
            .link-label { font-size: 0.62rem; }
            .related-icons { gap: 4px; margin-left: 2px; }
            .related-icon { width: 20px; height: 20px; font-size: 0.72rem; }
            .related-icon.icon-gh svg { width: 12px; height: 12px; }
            .custom-links-row { padding-left: 0; gap: 0.2rem 0.5rem; margin-top: 0; }
            .custom-links-row a { font-size: 0.65rem; }
            .meta-row { gap: 0.4rem; font-size: 0.7rem; }
            .meta-label { font-size: 0.62rem; margin-bottom: 0; }
            .rating-row { gap: 0.3rem; margin-top: 0.2rem; padding-top: 0.3rem; }
            .rating-label { font-size: 0.62rem; }
            .star { font-size: 0.8rem; }
            .rating-info { font-size: 0.62rem; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <div style="display:flex;align-items:center;min-width:0;flex:1;">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <a href="index.html" class="logo">
                    <img src="assets/css/images/biglogo.png" alt="合月亭"><span class="logo-text">合月亭</span>
                </a>
                <div class="v-line"></div>
                <div class="page-title">ACG资源站点导航</div>
            </div>
            <button class="theme-toggle" id="themeToggle" title="切换日/夜模式">🌙</button>
        </div>
    </div>
    <div class="mobile-sticky-tabs" id="mobileStickyTabs">
        <div class="mobile-tabs-scroll" id="mobileTabsScroll"></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-section-label">— 资源站 —</div>
            <a class="sidebar-link active" data-json="assets/nav-pages/gal.json" data-label="GAL">GAL</a>
            <a class="sidebar-link" data-json="assets/nav-pages/voice_music.json" data-label="音声/音乐">音声/音乐</a>
            <a class="sidebar-link" data-json="assets/nav-pages/comic_illustration.json" data-label="漫画/插画/本子">漫画/插画/本子</a>
            <a class="sidebar-link" data-json="assets/nav-pages/hub.json" data-label="综合资源站">综合资源站</a>
            <a class="sidebar-link" data-json="assets/nav-pages/gal-info.json" data-label="GAL情报/入正">GAL情报/入正</a>
            <a class="sidebar-link" data-json="assets/nav-pages/ln.json" data-label="轻小说">轻小说</a>
            <a class="sidebar-link" data-json="assets/nav-pages/anime.json" data-label="动漫">动漫</a>
            <a class="sidebar-link" data-json="assets/nav-pages/mmd.json" data-label="MMD">MMD</a>
            <div class="sidebar-section-label" style="margin-top:1rem;">— 工具 —</div>
            <a class="sidebar-link" data-json="assets/nav-pages/wiki.json" data-label="WIKI">WIKI</a>
            <a class="sidebar-link" data-json="assets/nav-pages/acg-nav.json" data-label="二次元导航站">二次元导航站</a>
            <a class="sidebar-link" data-json="assets/nav-pages/tools.json" data-label="工具">工具</a>
            <a class="sidebar-link" data-json="assets/nav-pages/search.json" data-label="搜索引擎">搜索引擎</a>
            <a class="sidebar-link" data-json="assets/nav-pages/valhalla.json" data-label="英灵殿">英灵殿</a>
        </nav>
        <main class="main-content">
            <div class="content-header">
                <div class="current-category" id="categoryTitle">GAL</div>
                <span class="site-count" id="siteCount"></span>
            </div>
            <div class="toolbar">
                <input type="text" class="search-box" id="searchInput" placeholder="搜索站点名称、备注或链接或UID...">
                <select class="sort-select" id="sortSelect">
                    <option value="default">默认排序</option>
                    <option value="name">按名称排序 (A-Z)</option>
                </select>
                <button class="grid-toggle-btn" id="gridToggleBtn" title="切换每行卡片数">2列</button>
            </div>
            <div class="grid" id="cardContainer">
                <div class="loading">请选择左侧分类加载数据</div>
            </div>
        </main>
    </div>
    <script>
    (() => {
        var API_BASE = 'https://heyue-rating-worker.heyue-rating-api.workers.dev';
        var THEME_KEY = 'heyue_nav_theme';
        var htmlEl = document.documentElement;
        var themeBtn = document.getElementById('themeToggle');
        function applyTheme(theme) {
            htmlEl.setAttribute('data-theme', theme);
            themeBtn.textContent = theme === 'dark' ? '🌙' : '☀️';
            localStorage.setItem(THEME_KEY, theme);
        }
        var saved = localStorage.getItem(THEME_KEY);
        if (saved) applyTheme(saved);
        themeBtn.addEventListener('click', function() {
            applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebarOverlay');
        var menuBtn = document.getElementById('mobileMenuBtn');
        function toggleSidebar(open) {
            sidebar.classList.toggle('open', open);
            overlay.classList.toggle('active', open);
        }
        menuBtn.addEventListener('click', function() { toggleSidebar(true); });
        overlay.addEventListener('click', function() { toggleSidebar(false); });
        var mobileTabsScroll = document.getElementById('mobileTabsScroll');
        var sidebarLinks = document.querySelectorAll('.sidebar-link[data-json]');
        function buildMobileTabs() {
            mobileTabsScroll.innerHTML = '';
            sidebarLinks.forEach(function(link) {
                var tab = document.createElement('a');
                tab.className = 'mobile-tab-item';
                tab.textContent = link.dataset.label;
                tab.dataset.json = link.dataset.json;
                tab.dataset.label = link.dataset.label;
                if (link.classList.contains('active')) tab.classList.add('active');
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.mobile-tab-item').forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    sidebarLinks.forEach(function(l) { l.classList.remove('active'); });
                    var matchedLink = document.querySelector('.sidebar-link[data-json="' + link.dataset.json + '"]');
                    if (matchedLink) matchedLink.classList.add('active');
                    currentJsonPath = link.dataset.json;
                    loadCategory(currentJsonPath, link.dataset.label);
                });
                mobileTabsScroll.appendChild(tab);
            });
        }
        buildMobileTabs();
        function syncMobileTabsActive(jsonPath) {
            document.querySelectorAll('.mobile-tab-item').forEach(function(t) {
                t.classList.toggle('active', t.dataset.json === jsonPath);
            });
            var activeTab = mobileTabsScroll.querySelector('.mobile-tab-item.active');
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
        var GRID_COLS_KEY = 'heyue_nav_grid_cols';
        var gridToggleBtn = document.getElementById('gridToggleBtn');
        var cardContainer = document.getElementById('cardContainer');
        var currentCols = parseInt(localStorage.getItem(GRID_COLS_KEY)) || 2;
        function applyGridCols(cols) {
            currentCols = cols;
            localStorage.setItem(GRID_COLS_KEY, cols);
            if (cols === 3) {
                cardContainer.classList.add('cols-3');
                gridToggleBtn.textContent = '3列';
                gridToggleBtn.classList.add('active');
            } else {
                cardContainer.classList.remove('cols-3');
                gridToggleBtn.textContent = '2列';
                gridToggleBtn.classList.remove('active');
            }
        }
        applyGridCols(currentCols);
        gridToggleBtn.addEventListener('click', function() {
            applyGridCols(currentCols === 2 ? 3 : 2);
        });
        var GH_SVG = '<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
        var globalCache = {};
        var allSites = [];
        var isGlobalSearch = false;
        var currentJsonPath = '';
        var currentLabel = '';
        var ratingCache = {};
        var ratedKeys = new Set();
        function getRatingKey(site) {
            if (site.uid && site.uid.trim()) return 'uid:' + site.uid.trim();
            return 'site:' + (site.name || '') + '_' + (site.url || '').replace(/\s+/g, '_');
        }
        function getPinyin(str) {
            if (!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }
        function prepareSites(data) {
            for (var i = 0; i < data.length; i++) {
                if (!data[i]._sortName) {
                    data[i]._sortName = getPinyin(data[i].name);
                }
            }
            return data;
        }
        function fetchRatingsBatch(keys) {
            var uncached = keys.filter(function(k) { return !ratingCache[k]; });
            if (uncached.length === 0) return Promise.resolve();
            return fetch(API_BASE + '/ratings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keys: uncached })
            })
            .then(function(res) { return res.ok ? res.json() : {}; })
            .then(function(data) {
                for (var k in data) {
                    if (data.hasOwnProperty(k)) ratingCache[k] = data[k];
                }
            })
            .catch(function(e) { console.warn('batch rating fetch failed:', e); });
        }
        function submitRating(key, score, starsEl, infoEl) {
            if (ratedKeys.has(key)) return;
            starsEl.classList.add('disabled');
            var fingerprint = {
                screen: screen.width + 'x' + screen.height,
                userAgent: navigator.userAgent,
                memory: navigator.deviceMemory || 0,
                cores: navigator.hardwareConcurrency || 0,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
            fetch(API_BASE + '/rate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key, score: score, fingerprint: fingerprint })
            })
            .then(function(res) { if (!res.ok) throw new Error('fail'); return res.json(); })
            .then(function(data) {
                ratingCache[key] = data;
                ratedKeys.add(key);
                updateRatingDisplay(starsEl, infoEl, data);
            })
            .catch(function(e) { console.warn('rating submit failed:', e); starsEl.classList.remove('disabled'); });
        }
        function updateRatingDisplay(starsEl, infoEl, data) {
            var rounded = Math.round(data.score);
            var starSpans = starsEl.querySelectorAll('.star');
            for (var i = 0; i < starSpans.length; i++) {
                if (i < rounded) starSpans[i].classList.add('active');
                else starSpans[i].classList.remove('active');
            }
            infoEl.innerHTML = '<span class="score-val">' + data.score + '</span> (' + data.count + ')';
        }
        function buildRatingHtml(site) {
            var key = getRatingKey(site);
            var stars = '';
            for (var i = 1; i <= 5; i++) stars += '<span class="star" data-val="' + i + '">\u2605</span>';
            return '<div class="rating-row" data-rating-key="' + key + '">'
                + '<span class="rating-label">评分</span>'
                + '<div class="stars" data-key="' + key + '">' + stars + '</div>'
                + '<span class="rating-info">加载中...</span></div>';
        }
        function bindRatingEvents() {
            var allStars = document.querySelectorAll('.stars[data-key]');
            var keysToFetch = [];
            for (var idx = 0; idx < allStars.length; idx++) {
                var key = allStars[idx].getAttribute('data-key');
                if (!ratingCache[key]) keysToFetch.push(key);
            }
            for (var idx2 = 0; idx2 < allStars.length; idx2++) {
                (function(starsEl) {
                    var key = starsEl.getAttribute('data-key');
                    var infoEl = starsEl.nextElementSibling;
                    var starSpans = starsEl.querySelectorAll('.star');
                    if (ratingCache[key]) {
                        updateRatingDisplay(starsEl, infoEl, ratingCache[key]);
                    }
                    if (ratedKeys.has(key)) { starsEl.classList.add('disabled'); return; }
                    for (var j = 0; j < starSpans.length; j++) {
                        (function(star) {
                            star.addEventListener('mouseenter', function() {
                                if (starsEl.classList.contains('disabled')) return;
                                var val = parseInt(star.getAttribute('data-val'));
                                for (var k = 0; k < starSpans.length; k++) {
                                    if (k < val) starSpans[k].classList.add('active');
                                    else starSpans[k].classList.remove('active');
                                }
                            });
                            star.addEventListener('click', function() {
                                if (starsEl.classList.contains('disabled')) return;
                                var val = parseInt(star.getAttribute('data-val'));
                                submitRating(key, val, starsEl, infoEl);
                            });
                        })(starSpans[j]);
                    }
                    starsEl.addEventListener('mouseleave', function() {
                        if (starsEl.classList.contains('disabled')) return;
                        var cached = ratingCache[key];
                        var rounded = cached ? Math.round(cached.score) : 0;
                        for (var k = 0; k < starSpans.length; k++) {
                            if (k < rounded) starSpans[k].classList.add('active');
                            else starSpans[k].classList.remove('active');
                        }
                    });
                })(allStars[idx2]);
            }
            if (keysToFetch.length > 0) {
                fetchRatingsBatch(keysToFetch).then(function() {
                    for (var i = 0; i < allStars.length; i++) {
                        var k = allStars[i].getAttribute('data-key');
                        if (ratingCache[k]) {
                            updateRatingDisplay(allStars[i], allStars[i].nextElementSibling, ratingCache[k]);
                        }
                    }
                });
            }
        }
        function parseRelatedUrls(relatedField) {
            if (!relatedField || typeof relatedField !== 'string' || !relatedField.trim()) return [];
            var raw = relatedField.trim();
            if ((raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"))) {
                raw = raw.slice(1, -1);
            }
            var urls = [];
            var parts = raw.split(',');
            for (var i = 0; i < parts.length; i++) {
                var u = parts[i].trim().replace(/^["']+|["']+$/g, '');
                if (u && /^https?:\/\//i.test(u)) urls.push(u);
            }
            var seen = {};
            return urls.filter(function(u) { if (seen[u]) return false; seen[u] = true; return true; });
        }
        function resolveIcons(relatedUrls) {
            var result = { nav: null, tg: null, github: null, custom: [] };
            var consumed = {};
            for (var i = 0; i < relatedUrls.length; i++) {
                var lower = relatedUrls[i].toLowerCase();
                if (!result.tg && (lower.includes('t.me') || lower.includes('discord') || lower.includes('tg'))) {
                    result.tg = relatedUrls[i]; consumed[i] = true;
                } else if (!result.github && lower.includes('github.com')) {
                    result.github = relatedUrls[i]; consumed[i] = true;
                }
            }
            for (var j = 0; j < relatedUrls.length; j++) {
                if (!consumed[j]) { result.nav = relatedUrls[j]; consumed[j] = true; break; }
            }
            for (var k = 0; k < relatedUrls.length; k++) {
                if (!consumed[k]) result.custom.push(relatedUrls[k]);
            }
            return result;
        }
        function renderCards(sites) {
            var container = document.getElementById('cardContainer');
            var countEl = document.getElementById('siteCount');
            countEl.textContent = '共 ' + sites.length + ' 个站点';
            if (sites.length === 0) { container.innerHTML = '<div class="loading">未找到匹配的站点</div>'; return; }
            container.innerHTML = sites.map(function(s) {
                var siteName = s.name || '未命名站点';
                var primaryUrl = s.url || '';
                var relatedUrls = parseRelatedUrls(s.related);
                var rel = resolveIcons(relatedUrls);
                var logoHtml = '';
                if (s.logo && s.logo.trim()) {
                    logoHtml = '<img class="site-logo" src="' + s.logo.trim() + '" alt="" onerror="this.style.display=\'none\'">';
                }
                var urlLink = primaryUrl
                    ? '<a href="' + primaryUrl + '" target="_blank" rel="noopener">' + primaryUrl + '</a>' : '—';
                var navIcon = rel.nav
                    ? '<a class="related-icon icon-nav active" href="' + rel.nav + '" target="_blank" rel="noopener" title="导航/主页">📑</a>'
                    : '<span class="related-icon icon-nav" title="无导航链接">📑</span>';
                var tgIcon = rel.tg
                    ? '<a class="related-icon icon-tg active" href="' + rel.tg + '" target="_blank" rel="noopener" title="Telegram/Discord">✈️</a>'
                    : '<span class="related-icon icon-tg" title="无TG/Discord链接">✈️</span>';
                var ghIcon = rel.github
                    ? '<a class="related-icon icon-gh active" href="' + rel.github + '" target="_blank" rel="noopener" title="GitHub">' + GH_SVG + '</a>'
                    : '<span class="related-icon icon-gh" title="无GitHub链接">' + GH_SVG + '</span>';
                var iconsHtml = '<span class="related-icons">' + navIcon + tgIcon + ghIcon + '</span>';
                var customLinksHtml = rel.custom.length > 0
                    ? '<div class="custom-links-row">' + rel.custom.map(function(u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; }).join('') + '</div>' : '';
                var problemHtml = s.issue
                    ? '<span class="meta-value problem">' + s.issue + '</span>'
                    : '<span style="color:var(--text-sub)">暂无</span>';
                var uidInlineHtml = '';
                if (s.uid && s.uid.trim()) {
                    uidInlineHtml = '<span class="uid-inline">UID: <span class="uid-val">' + s.uid.trim() + '</span></span>';
                }
                var categoryTag = isGlobalSearch && s._category
                    ? '<span style="position:absolute;top:0;left:0;background:rgba(251,191,36,0.15);color:var(--accent-gold);font-size:0.65rem;font-weight:600;padding:2px 8px;border-radius:10px 0 8px 0;letter-spacing:0.5px;">' + s._category + '</span>'
                    : '';
                return '<div class="site-card">'
                    + categoryTag
                    + '<div class="site-name-row">' + logoHtml
                    + '<div class="site-name" title="' + siteName + '">' + siteName + '</div></div>'
                    + '<div class="links-toggle-row">'
                    + '<div class="links-toggle" onclick="this.classList.toggle(\'open\');this.parentElement.nextElementSibling.classList.toggle(\'show\')">'
                    + '<span class="arrow">▶</span> 查看链接</div>'
                    + uidInlineHtml + '</div>'
                    + '<div class="links-panel">'
                    + '<div class="link-row"><span class="link-label">网址</span>' + urlLink + '</div>'
                    + '<div class="link-row"><span class="link-label">相关</span>' + iconsHtml + '</div>'
                    + customLinksHtml + '</div>'
                    + '<div class="meta-row">'
                    + '<div class="meta-item"><div class="meta-label">备注</div><div class="meta-value">' + (s.remark || '—') + '</div></div>'
                    + '<div class="meta-item"><div class="meta-label">问题</div><div class="meta-value">' + problemHtml + '</div></div>'
                    + '</div>'
                    + buildRatingHtml(s) + '</div>';
            }).join('');
            bindRatingEvents();
        }
        function filterAndSort() {
            var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            var sortMode = document.getElementById('sortSelect').value;
            var titleEl = document.getElementById('categoryTitle');
            if (keyword) {
                isGlobalSearch = true;
                titleEl.textContent = '🔍 全局搜索结果';
                var allData = Object.values(globalCache).flat();
                var filtered = allData.filter(function(s) {
                    return [s.name, s.remark, s.url, s.related, s.issue, s.uid, s._category]
                        .join(' ').toLowerCase().includes(keyword);
                });
                if (sortMode === 'name') filtered.sort(function(a, b) { return a._sortName.localeCompare(b._sortName); });
                renderCards(filtered);
            } else {
                isGlobalSearch = false;
                titleEl.textContent = currentLabel;
                var filtered = allSites.slice();
                if (sortMode === 'name') filtered.sort(function(a, b) { return a._sortName.localeCompare(b._sortName); });
                renderCards(filtered);
            }
        }
        document.getElementById('searchInput').addEventListener('input', filterAndSort);
        document.getElementById('sortSelect').addEventListener('change', filterAndSort);
        function preloadAllCategories() {
            var links = document.querySelectorAll('.sidebar-link[data-json]');
            var fetchPromises = Array.from(links).map(function(link) {
                var jsonPath = link.dataset.json;
                var label = link.dataset.label;
                if (!jsonPath || globalCache[jsonPath]) return Promise.resolve();
                return fetch(jsonPath)
                    .then(function(res) { return res.ok ? res.json() : null; })
                    .then(function(data) {
                        if (data) {
                            var sites = data.map(function(item) { return Object.assign({}, item, { _category: label }); });
                            globalCache[jsonPath] = prepareSites(sites);
                        }
                    })
                    .catch(function(e) { console.warn('preload failed: ' + jsonPath, e); });
            });
            return Promise.all(fetchPromises).then(function() {
                console.log('Global index ready, cached ' + Object.keys(globalCache).length + ' categories');
            });
        }
        function loadCategory(jsonPath, label) {
            var container = document.getElementById('cardContainer');
            var titleEl = document.getElementById('categoryTitle');
            var searchInput = document.getElementById('searchInput');
            currentLabel = label;
            titleEl.textContent = label;
            searchInput.value = '';
            isGlobalSearch = false;
            allSites = [];
            syncMobileTabsActive(jsonPath);
            if (!jsonPath) {
                container.innerHTML = '<div class="loading">「' + label + '」的 JSON 数据路径尚未配置<br>请在 sidebar-link 的 data-json 属性中填写对应 .json 文件路径</div>';
                document.getElementById('siteCount').textContent = '';
                return;
            }
            container.innerHTML = '<div class="loading">加载中...</div>';
            if (globalCache[jsonPath]) {
                allSites = globalCache[jsonPath].map(function(item) { var copy = Object.assign({}, item); delete copy._category; return copy; });
                prepareSites(allSites);
                renderCards(allSites);
            } else {
                fetch(jsonPath)
                    .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                    .then(function(data) {
                        allSites = prepareSites(data);
                        renderCards(allSites);
                    })
                    .catch(function(e) {
                        container.innerHTML = '<div class="loading" style="color:var(--danger)">数据加载失败: ' + e.message + '<br>请检查 ' + jsonPath + ' 是否存在且格式正确</div>';
                        document.getElementById('siteCount').textContent = '';
                    });
            }
        }
        sidebarLinks.forEach(function(link) {
            link.addEventListener('click', function() {
                sidebarLinks.forEach(function(l) { l.classList.remove('active'); });
                link.classList.add('active');
                currentJsonPath = link.dataset.json;
                loadCategory(currentJsonPath, link.dataset.label);
                if (window.innerWidth <= 768) toggleSidebar(false);
            });
        });
        preloadAllCategories();
        var firstLink = document.querySelector('.sidebar-link.active');
        if (firstLink) {
            currentJsonPath = firstLink.dataset.json;
            currentLabel = firstLink.dataset.label;
            loadCategory(currentJsonPath, currentLabel);
        }
    })();
    </script>
