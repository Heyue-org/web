<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACG资源分类导航 - 合月亭</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(251,191,36,0.1) 0%, rgba(15,23,42,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* ========== 顶栏 ========== */
        .top-bar {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
        }
        .top-bar-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }
        .top-bar-inner .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .top-bar-inner .logo img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-gold);
        }
        .top-bar-inner .v-line {
            width: 3px;
            height: 36px;
            background: #ffffff;
            margin: 0 1.5rem;
            opacity: 0.9;
            flex-shrink: 0;
            border-radius: 2px;
        }
        .top-bar-inner .page-title {
            font-size: 2.6rem;
            font-weight: 600;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(251,191,36,0.3);
            line-height: 1.2;
            word-break: keep-all;
        }
        .divider {
            max-width: 800px;
            margin: 0 auto;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            opacity: 0.4;
        }

        /* ========== 内容区 ========== */
        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem 4rem;
        }

        .section-label {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .tags-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
        }
        .tag-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
            text-decoration: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .tag-link:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.2);
        }

        .section-divider {
            max-width: 600px;
            margin: 2.5rem auto;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            opacity: 0.3;
        }

        /* ========== ✅ 施工提示框：右侧3/10空间的8/10宽度 ========== */
        .construction-notice {
            position: fixed;
            top: 50%;
            /* 右侧3/10区域起始位置 = 70vw，居中偏移 = (30vw * 0.8) / 2 = 12vw → 70+12=82vw中心点 */
            right: calc(100vw - 82vw);
            transform: translateY(-50%);
            /* 宽度 = 30vw × 0.8 = 24vw */
            width: 24vw;
            padding: 2rem 1.5rem;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            z-index: 999;
            pointer-events: none;
            user-select: none;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .construction-notice .notice-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            display: block;
        }
        .construction-notice .notice-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 0.6rem;
            letter-spacing: 2px;
        }
        .construction-notice .notice-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
        }

        /* ========== 浅色模式 ========== */
        body.light-mode {
            background-color: #f8fafc;
            color: #1e293b;
        }
        body.light-mode .top-bar {
            background: rgba(248, 250, 252, 0.85);
            border-color: rgba(0, 0, 0, 0.08);
        }
        body.light-mode .top-bar-inner .logo { color: #1e293b; }
        body.light-mode .top-bar-inner .v-line { background: #1e293b; opacity: 0.2; }
        body.light-mode .top-bar-inner .page-title {
            color: #d97706;
            text-shadow: 0 0 10px rgba(217, 119, 6, 0.2);
        }
        body.light-mode .divider,
        body.light-mode .section-divider {
            background: linear-gradient(to right, transparent, #d97706, transparent);
        }
        body.light-mode .section-label { color: #64748b; }
        body.light-mode .tag-link {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.08);
            color: #334155;
        }
        body.light-mode .tag-link:hover {
            border-color: #d97706;
            color: #d97706;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.15);
        }
        body.light-mode .construction-notice {
            background: rgba(248, 250, 252, 0.9);
            border-color: #d97706;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        body.light-mode .construction-notice .notice-title { color: #d97706; }
        body.light-mode .construction-notice .notice-desc { color: #64748b; }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .top-bar { padding: 1rem 1.2rem; }
            .top-bar-inner .logo { font-size: 1.8rem; }
            .top-bar-inner .logo img { width: 30px; height: 30px; }
            .top-bar-inner .v-line { height: 28px; margin: 0 0.8rem; width: 2px; }
            .top-bar-inner .page-title { 
                font-size: 1.6rem; 
                text-align: center;
                line-height: 1.3;
            }
            .content { padding: 2rem 1.2rem 3rem; }
            .tags-grid { gap: 0.8rem; }
            .tag-link { padding: 0.6rem 1.4rem; font-size: 1rem; }
            .section-divider { margin: 2rem auto; }

            /* ✅ 手机端提示框自适应：不再用vw固定，改为居中底部显示 */
            .construction-notice {
                top: auto;
                bottom: 1.5rem;
                right: 50%;
                transform: translateX(50%);
                width: calc(100vw - 3rem);
                max-width: 400px;
                padding: 1.2rem 1rem;
                border-radius: 12px;
            }
            .construction-notice .notice-icon { font-size: 1.8rem; margin-bottom: 0.4rem; }
            .construction-notice .notice-title { font-size: 0.95rem; margin-bottom: 0.3rem; }
            .construction-notice .notice-desc { font-size: 0.8rem; }
        }
    </style>
</head>
