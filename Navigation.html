<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACG资源分类导航 - 合月亭</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(251,191,36,0.1) 0%, rgba(15,23,42,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .top-bar {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
        }
        .top-bar-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .top-bar-inner .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .top-bar-inner .logo img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-gold);
        }
        .top-bar-inner .v-line {
            width: 3px;
            height: 36px;
            background: #ffffff;
            margin: 0 1.5rem;
            opacity: 0.9;
            flex-shrink: 0;
            border-radius: 2px;
        }
        .top-bar-inner .page-title {
            font-size: 2.6rem;
            font-weight: 600;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(251,191,36,0.3);
            line-height: 1.2;
            word-break: keep-all;
        }
        .divider {
            max-width: 800px;
            margin: 0 auto;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            opacity: 0.4;
        }

        .search-wrapper {
            position: relative;
            margin-left: auto;
            flex-shrink: 0;
        }
        #nav-search {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            width: 180px;
            transition: all 0.3s ease;
            backdrop-filter: blur(6px);
        }
        #nav-search:focus {
            width: 240px;
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(251,191,36,0.2);
        }
        .search-results {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: none;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }
        .search-results.active { display: block; }
        .search-result-item {
            padding: 0.7rem 1rem;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            border-bottom: 1px solid var(--border-color);
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover {
            background: rgba(251,191,36,0.1);
            color: var(--accent-gold);
        }
        .search-result-item .result-type {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-left: 0.5rem;
            flex-shrink: 0;
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem 4rem;
        }
        .section-label {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }
        .tags-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
        }
        .tag-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
            text-decoration: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .tag-link:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.2);
        }
        .section-divider {
            max-width: 600px;
            margin: 2.5rem auto;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            opacity: 0.3;
        }

        body.light-mode {
            background-color: #f8fafc;
            color: #1e293b;
        }
        body.light-mode .top-bar {
            background: rgba(248, 250, 252, 0.85);
            border-color: rgba(0, 0, 0, 0.08);
        }
        body.light-mode .top-bar-inner .logo { color: #1e293b; }
        body.light-mode .top-bar-inner .v-line { background: #1e293b; opacity: 0.2; }
        body.light-mode .top-bar-inner .page-title {
            color: #d97706;
            text-shadow: 0 0 10px rgba(217, 119, 6, 0.2);
        }
        body.light-mode .divider,
        body.light-mode .section-divider {
            background: linear-gradient(to right, transparent, #d97706, transparent);
        }
        body.light-mode .section-label { color: #64748b; }
        body.light-mode .tag-link {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.08);
            color: #334155;
        }
        body.light-mode .tag-link:hover {
            border-color: #d97706;
            color: #d97706;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.15);
        }
        body.light-mode #nav-search {
            background: rgba(255,255,255,0.8);
            border-color: rgba(0,0,0,0.08);
            color: #1e293b;
        }
        body.light-mode .search-results {
            background: #f8fafc;
            border-color: rgba(0,0,0,0.08);
        }
        body.light-mode .search-result-item { color: #334155; border-color: rgba(0,0,0,0.05); }
        body.light-mode .search-result-item:hover { background: rgba(217,119,6,0.08); color: #d97706; }

        @media (max-width: 600px) {
            .top-bar { padding: 1rem 1.2rem; }
            .top-bar-inner .logo { font-size: 1.8rem; }
            .top-bar-inner .logo img { width: 30px; height: 30px; }
            .top-bar-inner .v-line { height: 28px; margin: 0 0.8rem; width: 2px; }
            .top-bar-inner .page-title { 
                font-size: 1.6rem; 
                text-align: center;
                line-height: 1.3;
            }
            .search-wrapper { margin-left: 0; width: 100%; margin-top: 0.8rem; }
            #nav-search { width: 100%; }
            #nav-search:focus { width: 100%; }
            .search-results { width: 100%; right: auto; left: 0; }
            .content { padding: 2rem 1.2rem 3rem; }
            .tags-grid { gap: 0.8rem; }
            .tag-link { padding: 0.6rem 1.4rem; font-size: 1rem; }
            .section-divider { margin: 2rem auto; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="logo">
                <img src="assets/css/images/biglogo.png" alt="合月亭">
                合月亭
            </a>
            <div class="v-line"></div>
            <div class="page-title">ACG资源分类导航</div>
            <div class="search-wrapper">
                <input type="text" id="nav-search" placeholder="检索资源/工具..." autocomplete="off">
                <div id="search-results" class="search-results"></div>
            </div>
        </div>
    </div>

    <div class="divider"></div>

    <div class="content">
        <div class="section-label">— 资源站 —</div>
        <div class="tags-grid">
            <a href="assets/nav-pages/gal.html" class="tag-link">GAL</a>
            <a href="assets/nav-pages/voice_music.html" class="tag-link">音声/音乐</a>
            <a href="assets/nav-pages/comic_illustration.html" class="tag-link">漫画/插画/本子</a>
            <a href="assets/nav-pages/hub.html" class="tag-link">综合资源站</a>
            <a href="assets/nav-pages/gal-info.html" class="tag-link">GAL情报/入正</a>
            <a href="assets/nav-pages/ln.html" class="tag-link">轻小说</a>
            <a href="assets/nav-pages/anime.html" class="tag-link">动漫</a>
            <a href="assets/nav-pages/mmd.html" class="tag-link">MMD</a>
        </div>

        <div class="section-divider"></div>

        <div class="section-label">— 工具 —</div>
        <div class="tags-grid">
            <a href="assets/nav-pages/wiki.html" class="tag-link">WIKI</a>
            <a href="assets/nav-pages/acg-nav.html" class="tag-link">二次元导航站</a>
            <a href="assets/nav-pages/tools.html" class="tag-link">工具</a>
            <a href="assets/nav-pages/valhalla.html" class="tag-link">英灵殿</a>
            <a href="assets/nav-pages/search.html" class="tag-link">搜索引擎</a>
        </div>
    </div>

    <script>
    (() => {
      const searchInput = document.getElementById('nav-search');
      const resultsBox = document.getElementById('search-results');
      const navData = [
        { "name": "gal", "label": "GAL", "type": "resource" },
        { "name": "voice_music", "label": "音声/音乐", "type": "resource" },
        { "name": "comic_illustration", "label": "漫画/插画/本子", "type": "resource" },
        { "name": "hub", "label": "综合资源站", "type": "resource" },
        { "name": "gal-info", "label": "GAL情报/入正", "type": "resource" },
        { "name": "ln", "label": "轻小说", "type": "resource" },
        { "name": "anime", "label": "动漫", "type": "resource" },
        { "name": "mmd", "label": "MMD", "type": "resource" },
        { "name": "wiki", "label": "WIKI", "type": "tool" },
        { "name": "acg-nav", "label": "二次元导航站", "type": "tool" },
        { "name": "tools", "label": "工具", "type": "tool" },
        { "name": "valhalla", "label": "英灵殿", "type": "tool" },
        { "name": "search", "label": "搜索引擎", "type": "tool" }
      ];

      searchInput.addEventListener('input', () => {
        const keyword = searchInput.value.trim().toLowerCase();
        if (!keyword) {
          resultsBox.classList.remove('active');
          return;
        }
        const matched = navData.filter(item =>
          item.label.toLowerCase().includes(keyword) ||
          item.name.toLowerCase().includes(keyword)
        );
        if (matched.length === 0) {
          resultsBox.innerHTML = '<div class="search-result-item" style="color:var(--text-sub);justify-content:center;">无匹配结果</div>';
        } else {
          resultsBox.innerHTML = matched.map(item => `
            <a href="./assets/nav-pages/${item.name}.html" class="search-result-item">
              ${item.label}
              <span class="result-type">${item.type === 'resource' ? '资源站' : '工具'}</span>
            </a>
          `).join('');
        }
        resultsBox.classList.add('active');
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
          resultsBox.classList.remove('active');
        }
      });
    })();
    </script>

    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5824bbe371ce4eefbe8027cb86c0d0a6"}'></script>
</body>
</html>
